<script>
/* ============================================================
   engine.js —— 单元(unit)模型 / 面积 / 良率 / 功耗热 / 超频 / 跑分
   每个 CPU 核心、每个 GPU 核心都是裸片上独立的一块版图。
   ============================================================ */
(function () {
  'use strict';
  const KB = window.ARM.KB;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* 多核扩展按核心等级加权：超大核抢功耗/带宽，小核贡献有限 */
  const TIER_W = { prime: 1.4, big: 1.2, mid: 1.0, small: 0.6 };
  const SLC_LOCALITY_MAX = 0.12;
  const SLC_LOCALITY_DECAY = 6;

  const FIXED = ['modem', 'noc'];

  /* 单 die / 多 die 统一的单元遍历：多 die 时顺手打上 die 序号 */
  function allUnitsOf(st) {
    if (st && Array.isArray(st.dies) && st.dies.length) {
      const out = [];
      st.dies.forEach((d, i) => {
        (d.units || []).forEach(u => { u.die = i; out.push(u); });
      });
      return out;
    }
    return (st && Array.isArray(st.units)) ? st.units : [];
  }
  const sameDie = (a, b) => a.die == null || b.die == null || a.die === b.die;

  /* ============ 面积 → 矩形（尽量方正，轻微偏好横放） ============ */
  function bestRect(area, maxN) {
    area = Math.max(1, Math.ceil(area - 1e-9));
    maxN = maxN || 99;
    let best = null;
    for (let w = 1; w <= Math.min(area, maxN); w++) {
      const h = Math.ceil(area / w);
      if (h > maxN) continue;
      const waste = w * h - area;
      const ratio = Math.max(w / h, h / w);
      let s = waste * 1.0 + (ratio - 1) * 1.8;
      if (h > w) s += 0.06;                       // 同分时优先横放
      if (!best || s < best.score) best = { w, h, score: s };
    }
    if (!best) best = { w: Math.min(area, maxN), h: Math.min(area, maxN) };
    return { w: best.w, h: best.h };
  }

  /* ============ 单个单元的物理面积（mm²，3nm 基准折算到当前制程） ============ */
  function unitMin(unit, st) {
    const nd = KB.node(st.node);
    switch (unit.kind) {
      case 'cpu': { const c = KB.core(unit.coreId); return c ? (c.area + 0.18) / nd.dense : 1; }
      case 'gpu': { const a = KB.gpu(unit.archId); return a ? a.area * 1.12 * (unit.count || 1) / nd.dense : 1; }
      case 'modem': { const m = KB.modem(st.modem); return m ? m.area / nd.dense : 0; }
      case 'mem': { const m = KB.mem(unit.memId); return m ? m.area / nd.dense : 1; }
      case 'npu': { const n = KB.npu(unit.npuId); return n ? n.area / nd.dense : 1; }
      case 'isp': { const s = KB.isp(unit.ispId); return s ? s.area / nd.dense : 1; }
      case 'vdec': { const s = KB.vdec(unit.vdecId); return s ? s.area / nd.dense : 1; }
      case 'adsp': { const s = KB.adsp(unit.adspId); return s ? s.area / nd.dense : 1; }
      case 'hsio': return 1;   // 高速连接不设物理下限：长宽全由你拉
      case 'slc': return Math.max(1, (unit.mb || 1) * 0.18) / nd.dense;
      case 'noc': return 2;
    }
    return 1;
  }
  function minCells(unit, st) { return Math.max(1, Math.ceil(unitMin(unit, st) - 1e-9)); }
  function unitFootprint(unit, st) { return bestRect(minCells(unit, st), st.n); }

  /** 超出物理最小面积的格子 → 当作 L2 缓存 / 供电余量；合并的 GPU 共享 L2 再小赚一点。
      CPU 核心面积固定，没有「余量」这回事。 */
  function unitBonus(unit, st) {
    if (unit.kind !== 'gpu') return 1;
    const extra = Math.max(0, unit.w * unit.h - minCells(unit, st));
    let b = 1 + Math.min(0.10, extra * 0.02);
    if ((unit.count || 1) > 1) {
      b *= 1 + Math.min(0.06, ((unit.count || 1) - 1) * 0.015);
    }
    return b;
  }

  function unitFreq(unit) {
    if (unit.kind === 'cpu') { const c = KB.core(unit.coreId); return unit.freq || (c ? c.refF : 2.5); }
    if (unit.kind === 'gpu') { const a = KB.gpu(unit.archId); return unit.freq || (a ? a.maxF * 0.9 : 1); }
    return 0;
  }

  /* ============ 聚合统计（内存 / NPU / SLC 可以放多块） ============ */
  const placedOf = (st, kind) => st.units.filter(u => u.kind === kind && u.x >= 0);

  function memAgg(st) {
    const us = placedOf(st, 'mem');
    let bw = 0, cost = 0; const names = {};
    us.forEach(u => {
      const m = KB.mem(u.memId); if (!m) return;
      bw += m.bw; cost += m.cost; names[m.name] = (names[m.name] || 0) + 1;
    });
    const label = Object.keys(names).map(n => (names[n] > 1 ? names[n] + '×' : '') + n).join(' + ');
    return { bw, cost, count: us.length, label: label || '无内存控制器', name: label || '无' };
  }
  function npuAgg(st) {
    const us = placedOf(st, 'npu');
    let tops = 0, cost = 0; const names = {};
    us.forEach(u => {
      const n = KB.npu(u.npuId); if (!n) return;
      tops += n.tops; cost += n.cost; names[n.name] = (names[n.name] || 0) + 1;
    });
    const label = Object.keys(names).map(n => (names[n] > 1 ? names[n] + '×' : '') + n).join(' + ');
    return { tops, cost, count: us.length, label: label || '无', name: label || '无' };
  }
  function slcAgg(st) {
    const us = placedOf(st, 'slc');
    let mb = 0;
    us.forEach(u => { mb += (u.mb || 0); });
    return { mb, count: us.length, cost: mb * 1.6, label: mb ? mb + ' MB ×' + us.length : '无' };
  }

  /** ISP / 视频解码 / 音频 DSP：都是可叠多块的，面积·功耗·成本直接相加 */
  function ispAgg(st) {
    const us = placedOf(st, 'isp');
    let cap = 0, cost = 0, pw = 0, area = 0; const names = {};
    us.forEach(u => {
      const s = KB.isp(u.ispId); if (!s) return;
      cap += s.cap; cost += s.cost; pw += s.pw; area += s.area;
      names[s.name] = (names[s.name] || 0) + 1;
    });
    const label = Object.keys(names).map(n => (names[n] > 1 ? names[n] + '×' : '') + n).join(' + ');
    return { cap, cost, pw, area, count: us.length, label: label || '无', name: label || '无' };
  }
  function vdecAgg(st) {
    const us = placedOf(st, 'vdec');
    let cap = 0, cost = 0, pw = 0, area = 0; const names = {};
    us.forEach(u => {
      const s = KB.vdec(u.vdecId); if (!s) return;
      cap += s.cap; cost += s.cost; pw += s.pw; area += s.area;
      names[s.name] = (names[s.name] || 0) + 1;
    });
    const label = Object.keys(names).map(n => (names[n] > 1 ? names[n] + '×' : '') + n).join(' + ');
    return { cap, cost, pw, area, count: us.length, label: label || '无', name: label || '无' };
  }
  function adspAgg(st) {
    const us = placedOf(st, 'adsp');
    let cap = 0, cost = 0, pw = 0, area = 0; const names = {};
    us.forEach(u => {
      const s = KB.adsp(u.adspId); if (!s) return;
      cap += s.cap; cost += s.cost; pw += s.pw; area += s.area;
      names[s.name] = (names[s.name] || 0) + 1;
    });
    const label = Object.keys(names).map(n => (names[n] > 1 ? names[n] + '×' : '') + n).join(' + ');
    return { cap, cost, pw, area, count: us.length, label: label || '无', name: label || '无' };
  }

  /** 高速连接：带宽 / 成本 / 功耗全部按占用的格数算（长宽自由） */
  function hsioAgg(st) {
    const us = placedOf(st, 'hsio');
    let bw = 0, cost = 0, pw = 0, cells = 0; const names = {};
    us.forEach(u => {
      const h = KB.hsio(u.hsioId); if (!h) return;
      const c = u.w * u.h;
      cells += c; bw += h.per * c; cost += h.cost * c; pw += h.pw * c;
      names[h.name] = (names[h.name] || 0) + 1;
    });
    const label = Object.keys(names).map(n => (names[n] > 1 ? names[n] + '×' : '') + n).join(' + ');
    return { bw, cost, pw, cells, count: us.length, label: label || '无', name: label || '无' };
  }

  /** CPU 核心的缓存局部性：离最近的 SLC 越近，延迟越低，跑分越高（最高 +12%） */
  function locality(unit, st) {
    if (unit.kind !== 'cpu' || unit.x < 0) return 1;
    /* 多 die 时，只有同一块 die 上的 SLC 才算数；跨 die 访问不吃局部性加成 */
    const slcs = placedOf(st, 'slc').filter(s => sameDie(unit, s));
    if (!slcs.length) return 1;
    const cx = unit.x + unit.w / 2, cy = unit.y + unit.h / 2;
    let best = Infinity;
    slcs.forEach(s => {
      const d = Math.abs(cx - (s.x + s.w / 2)) + Math.abs(cy - (s.y + s.h / 2));
      if (d < best) best = d;
    });
    return 1 + SLC_LOCALITY_MAX * Math.exp(-best / SLC_LOCALITY_DECAY);
  }
  function localityDist(unit, st) {
    const slcs = placedOf(st, 'slc').filter(s => sameDie(unit, s));
    if (!slcs.length || unit.x < 0) return null;
    const cx = unit.x + unit.w / 2, cy = unit.y + unit.h / 2;
    let best = Infinity;
    slcs.forEach(s => {
      const d = Math.abs(cx - (s.x + s.w / 2)) + Math.abs(cy - (s.y + s.h / 2));
      if (d < best) best = d;
    });
    return best;
  }

  /* ============ 网格工具 ============ */
  function makeGrid(n) {
    const g = [];
    for (let y = 0; y < n; y++) g.push(new Array(n).fill(null));
    return g;
  }
  function stamp(g, u, val) {
    for (let y = u.y; y < u.y + u.h; y++)
      for (let x = u.x; x < u.x + u.w; x++) if (g[y] && x >= 0 && x < g[y].length) g[y][x] = val;
  }
  function fits(g, u) {
    const n = g.length;
    if (u.x < 0 || u.y < 0 || u.x + u.w > n || u.y + u.h > n) return false;
    for (let y = u.y; y < u.y + u.h; y++)
      for (let x = u.x; x < u.x + u.w; x++) if (g[y][x]) return false;
    return true;
  }
  function occupancy(st, exceptUid) {
    const g = makeGrid(st.n);
    st.units.forEach(u => { if (u.uid !== exceptUid && u.x >= 0) stamp(g, u, 1); });
    return g;
  }
  function canPlace(st, uid, x, y, w, h) {
    if (x < 0 || y < 0 || x + w > st.n || y + h > st.n) return false;
    const g = occupancy(st, uid);
    for (let yy = y; yy < y + h; yy++)
      for (let xx = x; xx < x + w; xx++) if (g[yy][xx]) return false;
    return true;
  }

  /* ============ 形状自适应 ============
     光标附近的空位塞不下原尺寸时，找一个「最不浪费 + 最方正」的矩形塞进去。
     只影响这一次放置：单元会被标记 autoFit，下次拿起时回到物理默认尺寸。 */
  function fitShape(st, uid, cx, cy, w, h) {
    const u = st.units.find(x => x.uid === uid);
    if (!u) return null;
    const mc = Math.max(1, minCells(u, st));
    /* CPU 面积固定：只允许换成长宽不同、格数相同的形状（等于旋转） */
    const fixedArea = u.kind === 'cpu';
    const cands = [], seen = Object.create(null);
    const push = (ww, hh) => {
      if (ww < 1 || hh < 1 || ww > st.n || hh > st.n || ww * hh < mc) return;
      if (fixedArea && ww * hh !== mc) return;
      const k = ww + 'x' + hh;
      if (seen[k]) return;
      seen[k] = 1;
      const ratio = Math.max(ww / hh, hh / ww);
      cands.push({ w: ww, h: hh, score: (ww * hh - mc) * 3 + (ratio - 1) * 2 });
    };
    const cap = Math.min(st.n * st.n, Math.max(w * h, mc) + 4);
    for (let a = mc; a <= cap; a++)
      for (let ww = 1; ww <= Math.min(a, st.n); ww++) push(ww, Math.ceil(a / ww));
    cands.sort((a, b) => a.score - b.score);
    cands.length = Math.min(cands.length, 18);      // 只试最划算的十几个形状，别拖慢拖动
    for (let i = 0; i < cands.length; i++) {
      const c = cands[i];
      const bx = clamp(Math.round(cx), 0, st.n - c.w);
      const by = clamp(Math.round(cy), 0, st.n - c.h);
      for (let r = 0; r <= 2; r++) {
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
          const x = clamp(bx + dx, 0, st.n - c.w), y = clamp(by + dy, 0, st.n - c.h);
          if (canPlace(st, uid, x, y, c.w, c.h)) return { x, y, w: c.w, h: c.h };
        }
      }
    }
    return null;
  }

  /* ============ 选区：框内模块 / 复制 ============ */
  function unitsInRect(st, r) {
    if (!r || !(r.w > 0) || !(r.h > 0)) return [];
    return st.units.filter(u => u.x >= 0 &&
      u.x < r.x + r.w && u.x + u.w > r.x && u.y < r.y + r.h && u.y + u.h > r.y);
  }
  /** 复制成一批「待放置」的新单元（同型号 / 同频率 / 同尺寸） */
  function cloneUnits(list) {
    return list.map(u => {
      const c = Object.assign({}, u);
      c.uid = 'u_' + Math.random().toString(36).slice(2, 8);
      c.x = -1; c.y = -1;
      delete c.bad; delete c.autoFit;
      return c;
    });
  }

  /** 把整批单元平移 (dx,dy)：保持相对排版，且不越界、不压到任何现有模块 */
  function pasteFits(st, list, dx, dy) {
    const g = occupancy(st, null);
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      const x = u.x + dx, y = u.y + dy;
      if (x < 0 || y < 0 || x + u.w > st.n || y + u.h > st.n) return false;
      for (let yy = y; yy < y + u.h; yy++)
        for (let xx = x; xx < x + u.w; xx++) if (g[yy][xx]) return false;
    }
    return true;
  }

  /** 整批平移是否合法：不越界、不压到选区外的任何模块（选区内部原本就不重叠） */
  function regionFits(st, list, dx, dy) {
    const inside = Object.create(null);
    list.forEach(u => { inside[u.uid] = 1; });
    const g = makeGrid(st.n);
    st.units.forEach(u => { if (u.x >= 0 && !inside[u.uid]) stamp(g, u, 1); });
    for (let i = 0; i < list.length; i++) {
      const u = list[i];
      const x = u.x + dx, y = u.y + dy;
      if (x < 0 || y < 0 || x + u.w > st.n || y + u.h > st.n) return false;
      for (let yy = y; yy < y + u.h; yy++)
        for (let xx = x; xx < x + u.w; xx++) if (g[yy][xx]) return false;
    }
    return true;
  }

  /** 就近找一块能原样放下整批单元的空位；找不到返回 null */
  function findPasteSpot(st, list) {
    const offs = [];
    for (let dx = -(st.n - 1); dx <= st.n - 1; dx++)
      for (let dy = -(st.n - 1); dy <= st.n - 1; dy++) {
        if (!dx && !dy) continue;
        offs.push({ dx, dy, d: dx * dx + dy * dy });
      }
    offs.sort((a, b) => a.d - b.d);
    for (let i = 0; i < offs.length; i++)
      if (pasteFits(st, list, offs[i].dx, offs[i].dy)) return offs[i];
    return null;
  }

  /* ============ 尺寸维护 ============ */
  function ensureSizes(st) {
    st.units.forEach(u => {
      const mc = minCells(u, st);
      if (u.kind === 'cpu') {
        /* CPU 面积固定：格数必须等于物理下限；长宽可以不同（横竖对调） */
        if (!u.w || !u.h || u.w * u.h !== mc) {
          const fp = unitFootprint(u, st);
          u.w = fp.w; u.h = fp.h;
        }
      } else if (!u.w || !u.h || u.w * u.h < mc) {
        const fp = unitFootprint(u, st);
        u.w = fp.w; u.h = fp.h;
      }
      u.w = clamp(Math.round(u.w), 1, st.n);
      u.h = clamp(Math.round(u.h), 1, st.n);
    });
  }

  /** 放不下的退回「待放置」，避免留下重叠 */
  function rehome(st) {
    const g = makeGrid(st.n);
    st.units.forEach(u => {
      if (u.x < 0 || u.y < 0) { u.x = -1; u.y = -1; return; }
      if (fits(g, u)) stamp(g, u, 1);
      else { u.x = -1; u.y = -1; }
    });
  }

  /* ============ 固定模块（基带/内存/NPU/SLC/NoC）配置指纹 ============ */
  /* ============ 配置驱动的固定模块（基带 / NoC）；内存/NPU/SLC 改为自建 ============ */
  function fixedSig(kind, st) {
    if (kind === 'modem') return (st.modem && st.modem !== 'm_none') ? 'modem:' + st.modem : null;
    if (kind === 'noc') return st.noc ? 'noc' : null;
    return null;
  }

  /** 依据配置同步固定模块，并维护所有单元尺寸。opts.dieIndex 用于多 die 的唯一 uid */
  function syncUnits(st, opts) {
    opts = opts || {};
    const suf = opts.dieIndex != null ? '_d' + opts.dieIndex : '';
    const keep = [];
    st.units.forEach(u => {
      if (FIXED.indexOf(u.kind) < 0) { keep.push(u); return; }   // cpu/gpu/mem/npu/slc 由玩家自建
      const sig = fixedSig(u.kind, st);
      if (!sig) return;                                    // 已关闭 → 移除
      if (u.sig !== sig) {                                 // 配置变了 → 重算默认尺寸
        u.sig = sig;
        const fp = unitFootprint(u, st);
        u.w = fp.w; u.h = fp.h;
      }
      keep.push(u);
    });
    FIXED.forEach(kind => {
      const sig = fixedSig(kind, st);
      if (!sig) return;
      if (!keep.some(u => u.kind === kind))
        keep.push({ uid: 'b_' + kind + suf, kind, sig, x: -1, y: -1 });
    });
    st.units = keep;
    ensureSizes(st);
    rehome(st);
    return st.units;
  }

  /** 同步所有 die 的固定模块，并把 st.units 重新绑定到当前 die */
  function syncAllUnits(st) {
    if (!Array.isArray(st.dies) || !st.dies.length) return syncUnits(st);
    st.dies.forEach((d, i) => {
      const ds = Object.assign({}, st, {
        units: d.units || [],
        n: d.n || st.n, mm2: d.mm2 || st.mm2,
        modem: i === 0 ? st.modem : 'm_none'   // 基带只放在 Die 1，避免重复计费/占面积
      });
      syncUnits(ds, { dieIndex: i });
      d.units = ds.units;
      d.n = ds.n; d.mm2 = ds.mm2;
    });
    st.activeDie = Math.max(0, Math.min(st.activeDie || 0, st.dies.length - 1));
    const a = st.dies[st.activeDie];
    st.units = a.units; st.n = a.n; st.mm2 = a.mm2;
    return st.units;
  }

  /** 对所有 die 自动布局 */
  function autoPlaceAll(st, onlyUnplaced) {
    if (!Array.isArray(st.dies) || !st.dies.length) return autoPlace(st, onlyUnplaced);
    st.dies.forEach(d => {
      const ds = Object.assign({}, st, { units: d.units || [], n: d.n || st.n, mm2: d.mm2 || st.mm2 });
      autoPlace(ds, onlyUnplaced);
      d.units = ds.units;
    });
    st.activeDie = Math.max(0, Math.min(st.activeDie || 0, st.dies.length - 1));
    const a = st.dies[st.activeDie];
    st.units = a.units; st.n = a.n; st.mm2 = a.mm2;
    return st.units;
  }

  /* ============ 自动布局：大块优先 + 首次适配 + 居中 ============ */
  function autoPlace(st, onlyUnplaced) {
    const list = st.units.filter(u => !onlyUnplaced || u.x < 0);
    list.sort((a, b) => b.w * b.h - a.w * a.h);
    list.forEach(u => {
      if (u.x >= 0 && canPlace(st, u.uid, u.x, u.y, u.w, u.h)) return;   // 原地不动
      for (let y = 0; y <= st.n - u.h; y++)
        for (let x = 0; x <= st.n - u.w; x++)
          if (canPlace(st, u.uid, x, y, u.w, u.h)) { u.x = x; u.y = y; return; }
      u.x = -1; u.y = -1;
    });
    if (!onlyUnplaced) centerFloorplan(st);
    return st.units;
  }

  /** 把整块版图居中，别让模块挤在左上角 */
  function centerFloorplan(st) {
    const placed = st.units.filter(u => u.x >= 0);
    if (!placed.length) return;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    placed.forEach(u => {
      x0 = Math.min(x0, u.x); y0 = Math.min(y0, u.y);
      x1 = Math.max(x1, u.x + u.w); y1 = Math.max(y1, u.y + u.h);
    });
    const dx = Math.floor((st.n - (x1 - x0)) / 2) - x0;
    const dy = Math.floor((st.n - (y1 - y0)) / 2) - y0;
    if (!dx && !dy) return;
    const g = makeGrid(st.n);
    st.units.forEach(u => {
      if (u.x < 0) return;
      const nx = u.x + dx, ny = u.y + dy;
      const t = { x: nx, y: ny, w: u.w, h: u.h };
      if (fits(g, t)) { u.x = nx; u.y = ny; stamp(g, u, 1); }
      else { u.x = -1; u.y = -1; }
    });
  }

  /* ============ 版图校验 ============ */
  function validate(st) {
    const n = st.n, g = makeGrid(n);
    const problems = [], unplaced = [];
    let cells = 0;
    st.units.forEach(u => {
      if (u.x < 0 || u.y < 0) { unplaced.push(u); return; }
      if (u.x + u.w > n || u.y + u.h > n) { problems.push({ uid: u.uid, why: '超出裸片边界' }); return; }
      let overlap = false;
      for (let y = u.y; y < u.y + u.h; y++)
        for (let x = u.x; x < u.x + u.w; x++) if (g[y][x]) overlap = true;
      if (overlap) { problems.push({ uid: u.uid, why: '与其他模块重叠' }); return; }
      if (u.w * u.h < minCells(u, st)) { problems.push({ uid: u.uid, why: '面积小于物理下限' }); }
      stamp(g, u, 1);
      cells += u.w * u.h;
    });
    st.units.forEach(u => { u.bad = problems.some(p => p.uid === u.uid); });
    const cpuN = st.units.filter(u => u.kind === 'cpu').length;
    if (!cpuN) problems.push({ uid: '-', why: '还没有 CPU 核心' });
    // 注：未放置的模块不再阻止流片 —— 它们只是不参与计算
    return { problems, unplaced, cells, util: cells / (n * n), ok: !problems.length };
  }

  /** 多 die 版图校验：逐块检查，问题统一带 Die 序号；CPU 只要求整包至少有一颗 */
  function validateAll(st) {
    if (!Array.isArray(st.dies) || st.dies.length <= 1) return validate(st);
    const problems = [], unplaced = [];
    let cells = 0, area = 0, cpuTotal = 0;
    st.dies.forEach((d, i) => {
      const ds = Object.assign({}, st, { units: d.units || [], n: d.n || st.n, mm2: d.mm2 || st.mm2 });
      const v = validate(ds);
      d.units = ds.units;
      v.problems.forEach(p => {
        if (p.why === '还没有 CPU 核心') return;        // 整包有一颗就够
        problems.push({ uid: p.uid, why: 'Die ' + (i + 1) + '：' + p.why, die: i });
      });
      v.unplaced.forEach(u => unplaced.push(Object.assign({}, u, { die: i })));
      cpuTotal += (d.units || []).filter(u => u.kind === 'cpu').length;
      cells += v.cells;
      area += (d.n || st.n) * (d.n || st.n);
    });
    if (!cpuTotal) problems.push({ uid: '-', why: '所有 die 都还没有 CPU 核心' });
    return { problems, unplaced, cells, util: area ? cells / area : 0, ok: problems.length === 0 };
  }

  /* ============ 多 die 互连拓扑 ============ */
  function xdiePairs(k, topo) {
    const pairs = [], seen = Object.create(null);
    const add = (a, b) => {
      if (a === b || a < 0 || b < 0 || a >= k || b >= k) return;
      const key = Math.min(a, b) + '-' + Math.max(a, b);
      if (seen[key]) return;
      seen[key] = 1; pairs.push(key);
    };
    if (k > 1) {
      if (topo === 'ring') {
        for (let i = 0; i < k; i++) add(i, (i + 1) % k);
      } else if (topo === 'mesh') {
        const cols = 2;
        for (let i = 0; i < k; i++) {
          const c = i % cols;
          if (c + 1 < cols) add(i, i + 1);
          if (i + cols < k) add(i, i + cols);
        }
      } else if (topo === 'all') {
        for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) add(i, j);
      } else {
        for (let i = 0; i < k - 1; i++) add(i, i + 1);
      }
    }
    return pairs;
  }

  function xdieInfo(st) {
    const k = Math.max(1, (st.dies && st.dies.length) || 1);
    const xd = st.xdie || {};
    const topo = xd.topology || 'linear';
    const pairs = xdiePairs(k, topo);
    const defaultType = xd.defaultType || 'd2d';
    const links = pairs.map(key => {
      const id = (xd.links && xd.links[key]) || defaultType;
      return Object.assign({ key }, KB.xdie(id));
    });
    const topoDef = KB.xtopo(topo);
    const topoFactor = k <= 2 ? 1 : topoDef.factor;
    const avgQ = links.length ? links.reduce((a, l) => a + l.q, 0) / links.length : 1;
    const minQ = links.length ? Math.min.apply(null, links.map(l => l.q)) : 1;
    const Q = clamp((avgQ * 0.65 + minQ * 0.35) * topoFactor, 0, 1);
    const bw = links.reduce((a, l) => a + l.bw, 0);
    const latency = links.length ? Math.round(links.reduce((a, l) => a + l.latency, 0) / links.length / Math.max(0.4, topoFactor)) : 0;
    const cost = links.reduce((a, l) => a + l.cost, 0) + (k > 1 ? 12 * k : 0);
    const power = links.reduce((a, l) => a + l.pw, 0) + (k > 1 ? 0.18 * k : 0);
    const xdieCpu = k <= 1 ? 1 : clamp(1 - 0.10 * (k - 1) / Math.max(0.25, Q), 0.35, 1);
    const xdieGpu = k <= 1 ? 1 : clamp(1 - 0.05 * (k - 1) / Math.max(0.25, Q), 0.50, 1);
    return { k, topo, topoDef, topoFactor, pairs, links, defaultType, Q, bw, latency, cost, power, xdieCpu, xdieGpu };
  }

  /* ============ 合并 / 拆分（GPU 区域） ============ */
  function bbox(list) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    list.forEach(u => {
      x0 = Math.min(x0, u.x); y0 = Math.min(y0, u.y);
      x1 = Math.max(x1, u.x + u.w); y1 = Math.max(y1, u.y + u.h);
    });
    return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  }
  function cellsOf(list) {
    const s = new Set();
    list.forEach(u => {
      for (let y = u.y; y < u.y + u.h; y++)
        for (let x = u.x; x < u.x + u.w; x++) s.add(x + ',' + y);
    });
    return s;
  }
  /** 四邻接洪泛：选中的块必须连成一片 */
  function isConnected(list) {
    const cells = cellsOf(list);
    if (!cells.size) return false;
    const seed = cells.values().next().value.split(',').map(Number);
    const seen = new Set([seed.join(',')]);
    const q = [seed];
    while (q.length) {
      const c = q.pop();
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(d => {
        const nx = c[0] + d[0], ny = c[1] + d[1], k = nx + ',' + ny;
        if (cells.has(k) && !seen.has(k)) { seen.add(k); q.push([nx, ny]); }
      });
    }
    return seen.size === cells.size;
  }

  function canMerge(st, uids) {
    const list = st.units.filter(u => uids.indexOf(u.uid) >= 0);
    if (list.length < 2) return { ok: false, why: '至少选 2 块 GPU' };
    if (list.some(u => u.kind !== 'gpu')) return { ok: false, why: '目前只支持合并 GPU 区域' };
    const arch = list[0].archId;
    if (list.some(u => u.archId !== arch)) return { ok: false, why: '只能合并同一架构的 GPU' };
    if (list.some(u => u.x < 0)) return { ok: false, why: '有核心还没放置' };
    const f = list[0].freq || 0;
    if (list.some(u => Math.abs((u.freq || 0) - f) > 1e-6)) return { ok: false, why: '频率必须一致' };
    if (!isConnected(list)) return { ok: false, why: '选中的块彼此不相连 —— 至少要边对边贴上' };
    const bb = bbox(list);
    const cells = list.reduce((a, u) => a + u.w * u.h, 0);
    const gap = bb.w * bb.h - cells;              // 补空缺要自己吃面积
    const others = st.units.filter(u => uids.indexOf(u.uid) < 0 && u.x >= 0);
    const clash = others.find(u => u.x < bb.x + bb.w && u.x + u.w > bb.x && u.y < bb.y + bb.h && u.y + u.h > bb.y);
    if (clash) return { ok: false, why: '合并出的矩形会压到其他模块，先把它们挪开', bb, list, gap };
    return { ok: true, list, bb, gap, cells, count: list.reduce((a, u) => a + (u.count || 1), 0) };
  }

  function mergeUnits(st, uids) {
    const r = canMerge(st, uids);
    if (!r.ok) return r;
    const first = r.list[0];
    const merged = {
      uid: first.uid, kind: 'gpu', archId: first.archId, freq: first.freq,
      count: r.count, x: r.bb.x, y: r.bb.y, w: r.bb.w, h: r.bb.h, merged: true
    };
    st.units = st.units.filter(u => uids.indexOf(u.uid) < 0);
    st.units.push(merged);
    ensureSizes(st);
    return { ok: true, unit: merged, gap: r.gap, count: r.count, w: r.bb.w, h: r.bb.h };
  }
  function splitUnit(st, uid) {
    const u = st.units.find(x => x.uid === uid);
    if (!u || !(u.count > 1)) return false;
    const n = u.count, arch = u.archId, freq = u.freq;
    st.units = st.units.filter(x => x.uid !== uid);
    for (let i = 0; i < n; i++) {
      const nu = { uid: 'u_' + Math.random().toString(36).slice(2, 8), kind: 'gpu', archId: arch, freq: freq, count: 1 };
      const fp = unitFootprint(nu, st);
      nu.w = fp.w; nu.h = fp.h; nu.x = -1; nu.y = -1;
      st.units.push(nu);
    }
    return true;
  }

  /* ============ CPU 模型 ============ */
  function cpuModel(st) {
    const nd = KB.node(st.node);
    const PS = KB.seg(st.seg).pkScale || 1;
    const memBw = memAgg(st).bw;
    const slcMb = slcAgg(st).mb;
    let single = 0, sum = 0, cores = 0, weightedCores = 0, area = 0, pk = 0, sme = 0, extraCells = 0, locSum = 0, locBest = 0;
    st.units.forEach(u => {
      if (u.kind !== 'cpu' || u.x < 0) return;
      const c = KB.core(u.coreId); if (!c) return;
      const f = unitFreq(u), b = unitBonus(u, st), loc = locality(u, st);
      const s = c.ppghz * f * b * loc;
      if (s > single) single = s;
      sum += s; cores++;
      weightedCores += (TIER_W[c.tier] || 1);
      locSum += loc; if (loc > locBest) locBest = loc;
      area += (c.area + 0.18) / nd.dense;
      pk += c.pk * Math.pow(f / c.maxF, 2.6) * nd.pw * PS;
      if (c.sme2) sme++;
      extraCells += Math.round((loc - 1) / SLC_LOCALITY_MAX * 12);
    });

    /* 奖励系数用「相对基准」形式：基准 = 8MB SLC / LPDDR5X-8533 / 无 NoC
       内存现在是可叠多块的，所以给系数加上软上限，避免堆内存白嫆 */
    const bwK = clamp((memBw - 68.3) / 60, -1, 1.4);
    const slcS = 1 + 0.020 * (1 - Math.exp(-(slcMb - 3) / 16));
    const slcM = 1 + 0.055 * (1 - Math.exp(-(slcMb - 3) / 16));
    const hsK = Math.min(1, hsioAgg(st).bw / 400);      // 高速连接带宽 → 互连效率
    const nocS = (st.noc ? 1.006 : 1) * (1 + 0.010 * hsK);
    const nocM = (st.noc ? 1.015 : 1) * (1 + 0.028 * hsK);
    const memS = 1 + 0.040 * bwK;
    const memM = 1 + 0.100 * bwK;

    /* ============ 多核扩展模型 ============
       旧模型：0.55 × (8 / 加权核数)^0.42，80 核直接被压到 ~18%，
       对服务器/桌面的大核簇来说过于悲观。
       新模型：8 核以内保持原校准；核数越多，逐渐切换到该版型的多核基线
       （服务器衰减慢、桌面中等、移动端仍然快衰减），
       再叠加“SLC/核 + 布局局部性”的簇奖励。 */
    const segId = st.seg || 'mobile';
    const EFF_CFG = {
      mobile:  { base: 0.55, decay: 0.42, cacheGain: 0.10 },
      desktop: { base: 0.66, decay: 0.20, cacheGain: 0.18 },
      server:  { base: 0.70, decay: 0.14, cacheGain: 0.20 }
    }[segId] || { base: 0.55, decay: 0.42, cacheGain: 0.10 };

    const locAvg = cores ? locSum / cores : 1;
    const slcPerCore = cores ? slcMb / cores : 0;
    const cacheK = clamp(slcPerCore / 4, 0, 1);          // 4MB/核 = 满配
    const locK = clamp((locAvg - 1) / SLC_LOCALITY_MAX, 0, 1);
    const scale = clamp((cores - 8) / 24, 0, 1);        // 8 核以内不改动原校准，32 核以上吃满新模型

    const base = 0.55 + (EFF_CFG.base - 0.55) * scale;
    const decay = 0.42 + (EFF_CFG.decay - 0.42) * scale;
    const cacheBoost = 1 + EFF_CFG.cacheGain * scale * (0.60 * cacheK + 0.40 * locK);

    let eff = base * Math.pow(8 / Math.max(4, weightedCores), decay);
    if (cores <= 1) eff = 1;                            // 单核时多核分 = 单核分
    else eff = clamp(eff * cacheBoost, 0.12, 0.85);

    return {
      single: single * slcS * memS * nocS,
      multi: sum * eff * slcM * memM * nocM,
      cores, weightedCores, area, pk, sme, eff, extraCells, locAvg, locBest,
      slcPerCore, cacheK, cacheBoost,
      bonus: { slcS, slcM, memS, memM, nocS, nocM }
    };
  }

  /* ============ GPU 模型 ============ */
  function gpuModel(st) {
    const nd = KB.node(st.node);
    const PS = KB.seg(st.seg).pkScale || 1;
    const memBw = memAgg(st).bw;
    const slcMb = slcAgg(st).mb;
    const memG = clamp(0.55 + 0.45 * (memBw / 100), 0.5, 1.08);
    const slcG = 1 + 0.02 * (1 - Math.exp(-slcMb / 20));
    const hsK = Math.min(1, hsioAgg(st).bw / 400);
    const nocG = (st.noc ? 1.02 : 1) * (1 + 0.030 * hsK);
    let fps = 0, cores = 0, area = 0, pk = 0, rt = 0, aiNative = false, gens = {};
    st.units.forEach(u => {
      if (u.kind !== 'gpu' || u.x < 0) return;
      const a = KB.gpu(u.archId); if (!a) return;
      const f = unitFreq(u), b = unitBonus(u, st), n = u.count || 1;
      fps += a.pp * f * n * memG * slcG * nocG * b;
      cores += n; area += a.area * 1.12 * n / nd.dense;
      pk += a.pk * n * Math.pow(f / a.maxF, 2.6) * nd.pw * PS;
      rt += a.rt * n; if (a.ai) aiNative = true;
      gens[a.name] = (gens[a.name] || 0) + n;
    });
    return { fps, cores, area, pk, rt, aiNative, gens, memG, slcG, nocG };
  }

  /* ============ 单 die 评估 ============ */
  function analyzeOne(st, vOpt) {
    const nd = KB.node(st.node);
    const seg = KB.seg(st.seg);
    const cpu = cpuModel(st);
    const gpu = gpuModel(st);
    const mem = memAgg(st);
    const slc = slcAgg(st);
    const npu = npuAgg(st);
    const isp = ispAgg(st), vdec = vdecAgg(st), adsp = adspAgg(st), hsio = hsioAgg(st);
    const md = KB.modem(st.modem) || KB.modem('m_none');
    const cool = KB.cool(st.cooling);
    const v = vOpt || validate(st);

    const areaTotal = st.n * st.n;
    const areaPhys = cpu.area + gpu.area + md.area / nd.dense + mem.bw / 60 +
      (slc.mb * 0.18 / nd.dense) + (st.noc ? 2 / nd.dense : 0) +
      ['mem', 'npu', 'isp', 'vdec', 'adsp', 'hsio'].reduce((a, k) =>
        a + st.units.filter(u => u.kind === k && u.x >= 0).reduce((b, u) => b + unitMin(u, st), 0), 0);

    /* Murphy 良率 */
    const AD = areaTotal * nd.d0;
    const murphy = AD < 1e-6 ? 1 : (1 - Math.exp(-AD)) / AD;
    const yieldRate = clamp(murphy * murphy, 0.02, 0.99);

    const waferArea = 70685;
    const perWafer = Math.max(1, Math.floor(waferArea / areaTotal * 0.86));
    const dieCost = (nd.wafer * 7.2) / (perWafer * yieldRate);
    const bom = dieCost + md.cost + mem.cost + cool.cost + npu.cost + slc.cost + (st.noc ? 12 : 0) +
      isp.cost + vdec.cost + adsp.cost + hsio.cost;

    const uncore = (0.45 + areaTotal * 0.004) * (seg.pkScale || 1) * 0.5;
    const modemP = md.id === 'm_none' ? 0 : md.id === 'm4g' ? 0.25 : 0.6;
    const memP = 0.30 * mem.count + mem.bw / 400;
    const npuP = npu.tops * 0.012;
    const mediaP = isp.pw + vdec.pw + adsp.pw + hsio.pw;      // 媒体 / 互连引擎功耗
    const baseP = uncore + modemP + memP + npuP + mediaP;

    // SME2 主要利好矩阵/AI 与多核吞吐；单核几乎无感，多核也不能无限线性叠加
    const smeS = 1 + 0.004 * Math.min(cpu.sme, 8);
    const smeM = 1 + 0.10 * (1 - Math.exp(-cpu.sme / 12));
    const single = cpu.single * smeS;
    const multi = cpu.cores <= 1 ? single : cpu.multi * smeM;
    const ai = npu.tops * 3000 + cpu.sme * 9000 + (gpu.aiNative ? gpu.cores * 2600 : 0);
    const rt = gpu.rt;
    const comm = md.dl * 1000 + (md.sat ? 3000 : 0) + (md.id === 'm4g' ? -4000 : 0);
    /* 媒体引擎：ISP / 视频编解码 / 音频 DSP —— 权重故意压小，不改现有评级台阶 */
    const media = isp.cap * 8000 + vdec.cap * 3000 + adsp.cap * 1500;

    const score = { single, multi, gpu: gpu.fps, ai, rt, mem, comm, media };
    score.total = totalScore(score);

    return {
      seg, cpu, gpu, mem, slc, npu, isp, vdec, adsp, hsio, modem: md, cooling: cool,
      areaTotal, areaPhys, cells: v.cells, util: v.util,
      problems: v.problems, unplaced: v.unplaced, ok: v.ok,
      yieldRate, perWafer, dieCost, bom,
      baseP, uncore, modemP, memP, npuP, mediaP,
      single, multi, ai, rt, comm, media, sme: cpu.sme, score
    };
  }

  /* ============ 整芯片评估：单 die 直接算，多 die 汇总后再套互连折损 ============ */
  function analyze(st) {
    if (!Array.isArray(st.dies) || st.dies.length <= 1) {
      const an = analyzeOne(st);
      an.dieCount = 1;
      an.dieYield = an.yieldRate;
      an.packageYield = an.yieldRate;
      an.dieCostOne = an.dieCost;
      an.xdie = xdieInfo(st);
      return an;
    }

    const dies = st.dies, k = dies.length;
    const first = dies[0];
    const allSt = Object.assign({}, st, {
      units: allUnitsOf(st),
      n: first.n || st.n,
      mm2: first.mm2 || st.mm2
    });
    const vAll = validateAll(st);
    const an = analyzeOne(allSt, vAll);

    /* —— 按单 die 重算良率 / 成本 / 封装良率 —— */
    const nd = KB.node(st.node);
    const dieArea = (first.n || st.n) * (first.n || st.n);
    const AD = dieArea * nd.d0;
    const murphy = AD < 1e-6 ? 1 : (1 - Math.exp(-AD)) / AD;
    const dieYield = clamp(murphy * murphy, 0.02, 0.99);
    const packageYield = clamp(Math.pow(dieYield, k), 0.01, 0.99);
    const perWafer = Math.max(1, Math.floor(70685 / dieArea * 0.86));
    const dieCostOne = (nd.wafer * 7.2) / (perWafer * dieYield);
    const dieCostTotal = k * dieCostOne / Math.max(0.02, packageYield);
    const xi = xdieInfo(st);

    /* —— 面积 / 校验结果 —— */
    an.areaTotal = dieArea * k;
    an.cells = vAll.cells;
    an.util = vAll.util;
    an.problems = vAll.problems;
    an.unplaced = vAll.unplaced;
    an.ok = vAll.ok;
    an.dieCount = k;
    an.dieYield = dieYield;
    an.packageYield = packageYield;
    an.yieldRate = packageYield;
    an.perWafer = perWafer;
    an.dieCostOne = dieCostOne;
    an.dieCost = dieCostTotal;
    an.xdie = xi;

    /* —— 功耗：多一块 die 就多一份 uncore；再叠加互连功耗 —— */
    const uncoreOne = an.uncore;
    an.uncore = uncoreOne * k;
    an.baseP += (k - 1) * uncoreOne + xi.power;

    /* —— 多 die 封装的热阻惩罚：更大的 IHS / 更长的热路径 —— */
    an.cooling = Object.assign({}, an.cooling, {
      rth: an.cooling.rth * (1 + 0.12 * (k - 1)),
      name: an.cooling.name + ' · ' + k + ' die'
    });

    /* —— BOM：N 颗 die 的成本（按封装良率折算）+ 互连 + 额外 NoC —— */
    const nocExtra = st.noc ? 12 * (k - 1) : 0;
    an.bom = an.bom - dieCostOne + dieCostTotal + xi.cost + nocExtra;

    /* —— 跨 die 折损：多核 / GPU / AI / 光追受影响，媒体与本地内存不吃 —— */
    an.multi *= xi.xdieCpu;
    an.gpu.fps *= xi.xdieGpu;
    an.ai *= xi.xdieCpu;
    an.rt *= xi.xdieGpu;

    an.score = {
      single: an.single,
      multi: an.multi,
      gpu: an.gpu.fps,
      ai: an.ai,
      rt: an.rt,
      mem: an.mem,
      comm: an.comm,
      media: an.media
    };
    an.score.total = totalScore(an.score);
    return an;
  }

  /* ============ 综合分 ============ */
  function totalScore(s) {
    return (s.multi * 120 + s.gpu * 2200 + Math.min(s.mem.bw, 175) * 8000 + s.ai + s.rt * 1800 +
            (s.media || 0) + Math.max(0, s.comm) * 10) * 0.85;
  }

  /* ============ 频率：找出最强核心 & 超频后的频率 ============ */
  function primeUnit(st) {
    let best = null, bp = 0;
    allUnitsOf(st).forEach(u => {
      if (u.kind !== 'cpu' || u.x < 0) return;
      const c = KB.core(u.coreId); if (!c) return;
      const s = c.ppghz * unitFreq(u);
      if (s > bp) { bp = s; best = u; }
    });
    return best;
  }
  function primeFreq(st) { const u = primeUnit(st); return u ? unitFreq(u) : 0; }
  function primeCoreId(st) { const u = primeUnit(st); return u ? u.coreId : null; }

  function freqsAt(st, oc) {
    let best = 0, bestF = 0;
    const gpuF = gpuFreq(st) * oc.gpuMult;
    allUnitsOf(st).forEach(u => {
      if (u.kind !== 'cpu' || u.x < 0) return;
      const c = KB.core(u.coreId); if (!c) return;
      const f = unitFreq(u);
      const sc = c.ppghz * f;
      if (sc > best) { best = sc; bestF = f * oc.cpuMult; }
    });
    return { cpu: bestF, gpu: gpuF };
  }
  function gpuFreq(st) {
    let f = 0;
    allUnitsOf(st).forEach(u => { if (u.kind === 'gpu' && u.x >= 0) f = Math.max(f, unitFreq(u)); });
    return f || 1;
  }

  /* ============ 硅体质 & 超频上限 ============ */
  function makeQuality(rng) {
    return {
      cpu: clamp(1 + (rng() - 0.42) * 0.34, 0.98, 1.22),
      gpu: clamp(1 + (rng() - 0.42) * 0.36, 0.98, 1.24)
    };
  }
  function limits(st, q) {
    const baseCpu = primeFreq(st);
    const pid = primeCoreId(st);
    const cpuHead = (pid && KB.core(pid) ? KB.core(pid).maxF : baseCpu) || baseCpu || 3;
    const gBase = gpuFreq(st);
    let gaMax = gBase;
    allUnitsOf(st).forEach(u => { if (u.kind === 'gpu' && u.x >= 0) gaMax = Math.max(gaMax, KB.gpu(u.archId).maxF); });
    const cpuSafe = Math.max(baseCpu * 1.08, cpuHead * q.cpu);
    const gpuSafe = Math.max(gBase * 1.08, gaMax * q.gpu);
    return {
      cpuHard: Math.max(cpuHead * 1.45, baseCpu * 1.35),
      gpuHard: Math.max(gaMax * 1.50, gBase * 1.35),
      cpuSafe, gpuSafe
    };
  }

  /* ============ 超频风险 ============ */
  function riskOf(st, oc, q) {
    const lim = limits(st, q);
    const f = freqsAt(st, oc);
    const vGain = 1 + oc.vOff / 6000;
    const overCpu = f.cpu / (lim.cpuSafe * Math.max(0.6, vGain));
    const overGpu = f.gpu / (lim.gpuSafe * Math.max(0.6, vGain));
    let risk = 0;
    risk = Math.max(risk, (overCpu - 1) * 2.6);
    risk = Math.max(risk, (overGpu - 1) * 2.6);
    if (oc.vOff < -40) risk = Math.max(risk, (-oc.vOff - 40) / 260);
    risk = clamp(risk, 0, 0.96);
    return {
      risk, overCpu, overGpu, vGain, limits: lim, freq: f,
      headroomCpu: lim.cpuSafe / Math.max(0.001, f.cpu),
      headroomGpu: lim.gpuSafe / Math.max(0.001, f.gpu)
    };
  }

  /* ============ 功耗 ============ */
  function powerAt(st, oc, cpuF, gpuF) {
    const nd = KB.node(st.node);
    const PS = KB.seg(st.seg).pkScale || 1;
    const vMul = Math.pow(1 + oc.vOff / 1100, 2);
    const base = Math.max(0.01, primeFreq(st));
    const mult = cpuF / base;
    let cpuP = 0, gpuP = 0;
    allUnitsOf(st).forEach(u => {
      if (u.x < 0) return;
      if (u.kind === 'cpu') {
        const c = KB.core(u.coreId); if (!c) return;
        const f = unitFreq(u) * mult;
        cpuP += c.pk * Math.pow(f / c.maxF, 2.6) * nd.pw * vMul * PS;
      } else if (u.kind === 'gpu') {
        const a = KB.gpu(u.archId); if (!a) return;
        /* 多 GPU 混合时统一按全局 gpuF 计算：所有 GPU 同步倍频 */
        const f = gpuF;
        gpuP += a.pk * (u.count || 1) * Math.pow(f / a.maxF, 2.6) * nd.pw * vMul * PS;
      }
    });
    return { cpuP, gpuP, total: cpuP + gpuP };
  }

  /* ============ 跑分模拟 ============ */
  function simulate(st, oc, q, opts) {
    opts = opts || {};
    const an = analyze(st);
    const cool = an.cooling;
    const seg = KB.seg(st.seg);
    const rk = riskOf(st, oc, q);
    const f = rk.freq;
    const rng = opts.rng || Math.random;
    const crashed = rng() < rk.risk;

    const dt = 0.08, dur = 26, steps = Math.round(dur / dt);
    const dieN = (st.dies && st.dies.length) || 1;
    const Tamb = 26, Cth = seg.cth * dieN, TjMax = seg.tjmax, Rth = cool.rth, pLimit = oc.pLimit;
    const ocRatio = clamp(f.cpu / Math.max(0.01, primeFreq(st)), 0.5, 2);
    const gpuRatio = clamp(f.gpu / Math.max(0.01, gpuFreq(st)), 0.5, 2);

    let T = Tamb, throttle = 1;
    const series = [];
    let peakT = Tamb, peakP = 0, sustT = 0, sustP = 0, sustThrottle = 0, nSust = 0;

    for (let i = 0; i < steps; i++) {
      const t = i * dt;
      const phase = t < 1.2 ? t / 1.2 : 1;
      const pw = powerAt(st, oc, f.cpu * throttle, f.gpu * throttle);
      const P = an.baseP + pw.total * phase;
      T += dt * (P - (T - Tamb) / Rth) / Cth;
      T = Math.max(Tamb, T);
      let want = 1;
      if (T > TjMax) want = Math.min(want, clamp(1 - (T - TjMax) / 20, 0.34, 1));
      if (P > pLimit) want = Math.min(want, Math.pow(pLimit / P, 1 / 2.6));
      throttle += (want - throttle) * Math.min(1, dt / 0.65);
      peakT = Math.max(peakT, T); peakP = Math.max(peakP, P);
      if (t > dur * 0.72) { sustT += T; sustP += P; sustThrottle += throttle; nSust++; }
      series.push({ t: +t.toFixed(2), T: +T.toFixed(1), P: +P.toFixed(2), thr: +throttle.toFixed(3) });
    }
    sustT /= Math.max(1, nSust); sustP /= Math.max(1, nSust); sustThrottle /= Math.max(1, nSust);

    if (crashed) {
      return { crashed: true, risk: rk.risk, an, rk, series, peakT, peakP, sustT, sustP, throttle: sustThrottle, peak: null, sust: null };
    }

    const mk = (ratio) => {
      const s = {
        single: an.single * ocRatio * ratio,
        multi: an.multi * ocRatio * (0.35 + 0.65 * ratio),
        gpu: an.gpu.fps * gpuRatio * ratio,
        ai: an.ai * (1 + (ocRatio - 1) * 0.3),
        rt: an.rt * gpuRatio,
        mem: an.mem, comm: an.comm, media: an.media
      };
      s.total = totalScore(s);
      return s;
    };
    const peak = mk(1);
    const sust = mk(clamp(sustThrottle, 0.3, 1));
    let grade = seg.ranks[0];
    seg.ranks.forEach(x => { if (sust.total >= x.min) grade = x; });

    return { crashed: false, risk: rk.risk, an, rk, series, peakT, peakP, sustT, sustP, throttle: sustThrottle, peak, sust, grade };
  }

  /* ============ 温度标签 ============ */
  function tempTag(T) {
    if (T < 62) return { t: '冰龙', c: '#0ea5a0', d: '摸起来是凉的，可以贴脸' };
    if (T < 76) return { t: '温润', c: '#3b82f6', d: '温热，还能握得住' };
    if (T < 88) return { t: '小火龙', c: '#b4732a', d: '烫手，建议戴壳' };
    if (T < 98) return { t: '火龙', c: '#b3423f', d: '能煎蛋了，注意手感' };
    return { t: '烧烤架', c: '#b3423f', d: '这已经不是手机了，是暖手宝' };
  }

  /* ============ 点评 ============ */
  function remarks(st, an, res, q) {
    const out = [];
    const allU = allUnitsOf(st);
    const big = allU.filter(u => u.kind === 'cpu' && u.x >= 0).length;
    const gpuN = an.gpu.cores;
    if (an.dieCount > 1) {
      out.push('多 die 拼接：' + an.dieCount + ' 块 die，互连质量 Q=' + (an.xdie.Q * 100).toFixed(0) +
        '%，多核跨 die 效率 ' + (an.xdie.xdieCpu * 100).toFixed(0) + '%，GPU 跨 die 效率 ' +
        (an.xdie.xdieGpu * 100).toFixed(0) + '%。');
      if (an.xdie.Q < 0.5) out.push('互连质量偏低 —— 有机基板 + 线性拓扑会让远端 die 的核互相拖后腿，试试硅桥 / 中介层或环形 / 全连接。');
      if (an.xdie.Q > 0.85) out.push('互连质量优秀，跨 die 的带宽和延迟都压得住，拼接效率接近单片。');
    }
    if (an.unplaced.length) out.push('还有 ' + an.unplaced.length + ' 个模块没放上裸片，它们不参与跑分。');
    if (an.problems.length) out.push('版图有 ' + an.problems.length + ' 处问题（重叠/越界/面积不足），流片会废片。');
    if (an.util < 0.55) out.push('裸片只用了 ' + Math.round(an.util * 100) + '%，面积在浪费，良率白白损失。');
    if (an.util > 0.94) out.push('利用率 ' + Math.round(an.util * 100) + '%，布线（routing）压力很大。');
    if (!an.mem.count) out.push('⚠️ 一块内存控制器都没放，带宽归零，多核和 GPU 直接断粮。');
    else if (an.mem.count === 1) out.push('只有一块内存控制器（' + an.mem.bw.toFixed(1) + 'GB/s），再堆一块能再拉一波带宽。');
    else out.push(an.mem.count + ' 块内存控制器堆出 ' + an.mem.bw.toFixed(1) + 'GB/s —— 不过总线带宽会开始吃紧。');
    if (!an.slc.mb) out.push('⚠️ 没有 SLC 系统缓存，CPU 访问内存全靠远距离搬运，又慢又费电。');
    else if (an.cpu.locAvg < 1.05 && an.cpu.cores > 1) out.push('SLC 离 CPU 太远了（平均局部性仅 +' + ((an.cpu.locAvg - 1) * 100).toFixed(1) + '%）—— 把大核往缓存旁边攒。');
    else if (an.cpu.locAvg >= 1.09) out.push('CPU 紧贴着 SLC 布局，缓存局部性 +' + ((an.cpu.locAvg - 1) * 100).toFixed(1) + '%，这才是旗舰该有的版图。');
    if (!an.npu.tops) out.push('没有 NPU，端侧 AI 全靠 CPU 硬算。');
    if (!an.isp.count) out.push('没有 ISP —— 摄像头只能靠 CPU 软处理，拍照 / 录像基本就废了。');
    else if (an.isp.cap < 2) out.push('ISP 只有 ' + an.isp.cap + ' GPix/s，单摄日常能应付，多摄就排队了。');
    else out.push('ISP 堆到 ' + an.isp.cap.toFixed(1) + ' GPix/s，多摄并行、8K 录制都吃得下。');
    if (!an.vdec.count) out.push('没有视频解码器 —— 看个 4K 视频都要 CPU 软解，续航会很难看。');
    if (!an.adsp.count) out.push('没有音频 DSP，语音唤醒和音频解码都压在 CPU 上（待机耗电的常见原因）。');
    if (an.hsio.count && an.hsio.bw < 100) out.push('高速连接只有 ' + an.hsio.bw.toFixed(0) + 'GB/s，把它拉长一点，多核与 GPU 才能吃得饱。');
    else if (an.hsio.bw >= 400) out.push('高速连接堆到 ' + an.hsio.bw.toFixed(0) + 'GB/s，核间与 GPU 的数据通路彻底吃饱了。');
    if (!st.noc) out.push('省掉了 NoC 互连，多核与 GPU 数据通路吃亏。');
    if (big === 1) out.push('只有一颗 CPU 核心？这是单核跑分榜（不是）。');
    if (big > 10) out.push(big + ' 颗 CPU 核心！多核会很好看，但持续功耗要散热兜住。');
    if (an.cpu.cores >= 16) {
      const effPct = (Number(an.cpu.eff) || 0) * 100;
      const slcPerCore = Number(an.cpu.slcPerCore) || 0;
      const locAvg = Number(an.cpu.locAvg) || 1;
      out.push('多核扩展：' + an.cpu.cores + ' 核 → ' + an.seg.name + '效率 ' + effPct.toFixed(0) +
        '%，SLC ' + slcPerCore.toFixed(1) + ' MB/核，平均局部性 +' + ((locAvg - 1) * 100).toFixed(1) + '%。');
    }
    if (an.cpu.extraCells > 0) out.push('SLC 局部性等效额外 ' + an.cpu.extraCells + ' 格缓存，单核性能吃到了一点甜头。');
    if (gpuN > 20) out.push('GPU 堆到 MP' + gpuN + '，面积和功耗都要起飞了。');
    if (an.modem.id === 'm_none') out.push('不装基带 —— 桌面/服务器可以，手机就别想了。');
    else if (an.modem.id === 'm4g') out.push('只有 4G……发布会现场会被弹幕刷屏。');
    if (an.modem.sat) out.push('支持卫星通信，可以在珠峰发朋友圈。');
    if (an.cooling && an.cooling.id === 'ln2') out.push('极限液氮：θ=0.02 K/W，芯片被按在室温附近，持续性能基本等于峰值；现实中会结霜/凝露，别在家试。');
    if (an.yieldRate < 0.6) out.push('封装良率仅 ' + (an.yieldRate * 100).toFixed(0) + '%，' + (an.dieCount > 1 ? '多 die 的良率是逐块相乘的，' : '') + '裸片太大或制程太新，成本炸了。');
    if (q && q.cpu > 1.15) out.push('这颗硅的 CPU 体质 ' + (q.cpu * 100).toFixed(0) + '%，超频空间很大（欧皇）。');
    if (q && q.cpu < 1.03) out.push('CPU 体质只有 ' + (q.cpu * 100).toFixed(0) + '%，超频一碰就翻车（非酋）。');
    if (res && !res.crashed && res.peakT > 90) out.push('峰值温度 ' + res.peakT.toFixed(0) + '°C，跑分时已经贴着温度墙了。');
    if (res && !res.crashed && res.throttle < 0.7) out.push('持续性能只有峰值的 ' + (res.throttle * 100).toFixed(0) + '%，典型的「跑分一条龙、游戏一条虫」。');
    if (res && !res.crashed && res.throttle > 0.92 && res.peakT < 85) out.push('峰值与持续几乎一致，散热调校优秀，值得在 PPT 上放大。');
    return out;
  }

  function valueScore(an, res) {
    const t = (res && res.sust) ? res.sust.total : (an.score ? an.score.total : 0);
    return t / Math.max(1, an.bom);
  }

  window.ARM.Engine = {

        u.w = Math.min(Math.round(u.w), s.n);
        u.h = Math.min(Math.round(u.h), s.n);
        if (typeof u.x !== 'number' || !isFinite(u.x) || u.x < 0) { u.x = -1; u.y = -1; }
        if (typeof u.y !== 'number' || !isFinite(u.y) || u.y < 0) { u.x = -1; u.y = -1; }
        if (!u.uid || typeof u.uid !== 'string' || seen[u.uid]) u.uid = 'u_' + Math.random().toString(36).slice(2, 8) + Object.keys(seen).length;
        seen[u.uid] = 1;
        delete u.sig; delete u.die; delete u.bad;      // 旧版固定模块的指纹 / 临时字段
        return true;
      });
    }
    s.dies = s.dies.map((d, i) => {
      const units = cleanList(d.units);
      /* 基带只保留在 Die 1：其余 die 上的 modem 固定模块直接移除 */
      return { uid: d.uid, units: i > 0 ? units.filter(u => u.kind !== 'modem') : units };
    });
    s.dies.forEach(d => { d.n = s.n; d.mm2 = s.mm2; });
    bindActive(s);

    /* pLimit 随 die 数量放大，但不超过版型上限 × die 数 */
    s.oc.pLimit = clamp(s.oc.pLimit, sg.plimit.min, sg.plimit.max * s.dies.length);

    if (!Array.isArray(s.multi)) s.multi = [];
    s.multi = s.multi.filter(id => s.units.some(u => u.uid === id));
    if (!s.selRect || typeof s.selRect !== 'object' ||
        !isFinite(s.selRect.x) || !isFinite(s.selRect.y) ||
        !isFinite(s.selRect.w) || !isFinite(s.selRect.h) ||
        s.selRect.w < 1 || s.selRect.h < 1) s.selRect = null;
    else {
      s.selRect.x = Math.max(0, Math.min(s.n - 1, Math.round(s.selRect.x)));
      s.selRect.y = Math.max(0, Math.min(s.n - 1, Math.round(s.selRect.y)));
      s.selRect.w = Math.max(1, Math.min(s.n - s.selRect.x, Math.round(s.selRect.w)));
      s.selRect.h = Math.max(1, Math.min(s.n - s.selRect.y, Math.round(s.selRect.h)));
    }
    if (!s.units.some(u => u.uid === s.selected)) s.selected = null;
    if (!s.units.some(u => u.uid === s.pending)) { s.pending = null; s.pendingXY = null; }
    if (!s.result || typeof s.result !== 'object' || !s.result.an) s.result = null;
    if (s.screen === 'result' && !s.result) s.screen = 'layout';
    if (typeof s.runs !== 'number' || !isFinite(s.runs)) s.runs = 0;
    return s;
  }

  function load() {
    try {
      // 清掉早期版本的存档，避免占着茅坑
      ['armdynasty.v1', 'armdynasty.v2', 'armdynasty.v3'].forEach(k => { try { localStorage.removeItem(k); } catch (e) { } });
    } catch (e) { }
    try {
      /* v6 优先；没有就依次尝试 v5 / v4，sanitize 内部做迁移 */
      let raw = localStorage.getItem(KEY);
      if (!raw) raw = localStorage.getItem('armdynasty.v5');
      if (!raw) raw = localStorage.getItem('armdynasty.v4');
      if (!raw) return;
      const ok = sanitize(JSON.parse(raw));
      if (ok) {
        st = Object.assign(DEFAULT(ok.seg), ok);
        bindActive(st);
        rebuildXdieLinks(st);
        save();                                   // 立刻写回 v6
        try { localStorage.removeItem('armdynasty.v5'); localStorage.removeItem('armdynasty.v4'); } catch (e) { }
      }
      else localStorage.removeItem(KEY);          // 版本对不上 / 结构坏了 → 直接丢掉重开
    } catch (e) { try { localStorage.removeItem(KEY); } catch (e2) { } }
  }

  function layoutBadgesHTML(v) {

      : v.problems.length
        ? `<span class="badge r">${v.problems.length} 处冲突</span>`
        : `<span class="badge g">版图合法</span>`;
    const allU = E.allUnitsOf(st);
    const miss = [];
    if (!allU.some(u => u.kind === 'cpu')) miss.push('CPU');
    if (!allU.some(u => u.kind === 'gpu')) miss.push('GPU');
    if (!allU.some(u => u.kind === 'mem')) miss.push('内存控制器');
    if (!allU.some(u => u.kind === 'slc' && u.mb > 0)) miss.push('SLC');
    if (!allU.some(u => u.kind === 'npu')) miss.push('NPU');
    return base +
      (miss.length ? `<span class="badge o">缺少：${miss.join('、')}</span>` : '') +
      v.problems.map(p => `<span class="badge r">${esc(p.why)}</span>`).join('') +
      (v.unplaced.length ? '<span class="badge">拖拽左侧「待放置」到裸片，或先点它再点裸片</span>' : '');
  }

        <div class="xdie-stat"><span class="muted">互连总带宽 / 平均延迟</span><b>${fmt(xi.bw)}GB/s / ${xi.latency}ns</b></div>
        <div class="xdie-stat"><span class="muted">互连功耗 / 成本</span><b>${f1(xi.power)}W / ¥${fmt(xi.cost)}</b></div>
        <div class="xdie-stat"><span class="muted">预估综合分</span><b>${fmt(an.score.total)}</b></div>
        <div class="xdie-stat"><span class="muted">预估峰值功耗</span><b>${f1(peakP)}W</b></div>
      </div>
    </div>`;
  }

  /* ============================================================
     ② 版图布局
     ============================================================ */
  function viewLayout() {
    E.syncAllUnits(st);
    const v = E.validateAll(st);
    const an = E.analyze(st);
    const tabs = dieTabsHTML();
    if (st.overview && dieCount() > 1) return viewLayoutOverview(v, an, tabs);
    const cpuU = st.units.filter(u => u.kind === 'cpu');
    const gpuU = st.units.filter(u => u.kind === 'gpu');
    const unplaced = st.units.filter(u => u.x < 0);

    /* --- 框选选区 --- */
    const sr = st.selRect;
    const srList = sr ? E.unitsInRect(st, sr) : [];
    const srGpu = srList.filter(u => u.kind === 'gpu');
    const srMerged = srGpu.filter(u => (u.count || 1) > 1);
    const srMerge = srGpu.length >= 2 ? E.canMerge(st, srGpu.map(u => u.uid)) : null;
    const selBoxStyle = sr
      ? `left:${(sr.x / st.n * 100).toFixed(3)}%;top:${(sr.y / st.n * 100).toFixed(3)}%;width:${(sr.w / st.n * 100).toFixed(3)}%;height:${(sr.h / st.n * 100).toFixed(3)}%`
      : 'display:none';

    /* --- 待放置托盘 --- */
    const tray = unplaced.length
      ? unplaced.map(u => `<div class="tray-chip ${st.pending === u.uid ? 'sel' : ''}" data-uid="${u.uid}">
          <span class="pal-chip" style="--c:${unitColor(u)};background:${unitColor(u)}"></span>${esc(unitLabel(u))}
        </div>`).join('')
      : '<span class="tiny muted">全部已放置 · 拖拽移动；GPU 可拖右下角缩放</span>';

    /* --- 频率分组 --- */
    const groupBy = (list, key) => {
      const m = new Map();
      list.forEach(u => { const k = u[key]; if (!m.has(k)) m.set(k, []); m.get(k).push(u); });
      return Array.from(m.entries());
    };
    const cpuGroups = groupBy(cpuU, 'coreId').map(([id, arr]) => {
      const c = KB.core(id); const t = KB.TIERS[c.tier];
      const freq = E.unitFreq(arr[0]);
      return `<div class="group">
        <div class="group-head">
          <span class="pal-chip" style="background:${TIER_COLOR[c.tier]}"></span>
          <b>${c.short}</b><span class="count-pill">×${arr.length}</span>
          <span class="spacer"></span>
          <span class="tiny muted">${t.label}</span>
          <button class="btn btn-icon btn-sm" data-act="del-core" data-id="${id}" title="移除该型号全部核心">✕</button>
        </div>
        <div class="group-body">
          <input type="range" data-freq-cpu="${id}" min="0.6" max="${c.maxF}" step="0.01" value="${freq}"
                 style="--p:${((freq - 0.6) / (c.maxF - 0.6) * 100).toFixed(1)}%"/>
          <div class="between tiny muted"><span>频率</span><span class="mono" data-flabel-cpu="${id}">${f2(freq)} GHz</span></div>
          <div class="tiny muted">${esc(c.note || t.desc)} · ${c.isa} · 物理 ${f2(c.area + 0.18)}mm²</div>
        </div>
      </div>`;
    }).join('');

    const gpuGroups = groupBy(gpuU, 'archId').map(([id, arr]) => {
      const a = KB.gpu(id);
      const freq = E.unitFreq(arr[0]);
      const cores = arr.reduce((x, u) => x + (u.count || 1), 0);
      return `<div class="group">
        <div class="group-head">
          <span class="pal-chip" style="background:${a.ai ? '#c026d3' : '#d98324'}"></span>
          <b>${a.name.replace('Mali ', '')}</b><span class="count-pill">${gpuCountLabel(id, cores)}</span>
          <span class="spacer"></span>
          <button class="btn btn-icon btn-sm" data-act="del-gpu" data-id="${id}" title="移除该架构全部核心">✕</button>
        </div>
        <div class="group-body">
          <input type="range" data-freq-gpu="${id}" min="0.4" max="${a.maxF}" step="0.01" value="${freq}"
                 style="--p:${((freq - 0.4) / (a.maxF - 0.4) * 100).toFixed(1)}%"/>
          <div class="between tiny muted"><span>频率</span><span class="mono" data-flabel-gpu="${id}">${f2(freq)} GHz</span></div>
          <div class="tiny muted">${a.gen} · ${a.note || ''}</div>
        </div>
      </div>`;
    }).join('');

    const memU = st.units.filter(u => u.kind === 'mem');
    const npuU = st.units.filter(u => u.kind === 'npu');
    const slcU = st.units.filter(u => u.kind === 'slc');
    const ispU = st.units.filter(u => u.kind === 'isp');
    const vdecU = st.units.filter(u => u.kind === 'vdec');
    const adspU = st.units.filter(u => u.kind === 'adsp');
    const hsioU = st.units.filter(u => u.kind === 'hsio');
    const A = {
      mem: E.memAgg(st), npu: E.npuAgg(st), slc: E.slcAgg(st),
      isp: E.ispAgg(st), vdec: E.vdecAgg(st), adsp: E.adspAgg(st), hsio: E.hsioAgg(st)
    };

    const mkGroups = (list, key, colorFn, infoFn, kindName) =>
      groupBy(list, key).map(([id, arr]) => {
        const info = infoFn(id);
        return `<div class="group">
        <div class="group-head">
          <span class="pal-chip" style="background:${colorFn(id)}"></span>
          <b>${info.title}</b><span class="count-pill">×${arr.length}</span>
          <span class="spacer"></span>
          <button class="btn btn-icon btn-sm" data-act="del-kind" data-kind="${kindName}" data-key="${key}" data-id="${id}">✕</button>
        </div>
        <div class="group-body"><div class="tiny muted">${info.sub}</div></div>
      </div>`;
      }).join('');

    const memGroups = mkGroups(memU, 'memId', () => KIND_COLOR.mem,
      id => { const m = KB.mem(id); return m
        ? { title: m.name, sub: m.bw + ' GB/s · ' + f2(m.area) + 'mm²/块 · ¥' + m.cost }
        : { title: '未知内存', sub: '—' }; }, 'mem');
    const npuGroups = mkGroups(npuU, 'npuId', () => KIND_COLOR.npu,
      id => { const n = KB.npu(id); return n
        ? { title: n.name, sub: n.tops + ' TOPS · ' + f2(n.area) + 'mm²/块 · ¥' + n.cost }
        : { title: '未知 NPU', sub: '—' }; }, 'npu');
    const slcGroups = mkGroups(slcU, 'mb', () => KIND_COLOR.slc,
      id => { const mb = +(id || 0); return { title: mb + ' MB', sub: f2(mb * 0.18) + 'mm²/块 · 全部合计 ' + A.slc.mb + ' MB' }; }, 'slc');
    const ispGroups = mkGroups(ispU, 'ispId', () => KIND_COLOR.isp,
      id => { const s = KB.isp(id); return s
        ? { title: s.name, sub: s.cap + ' GPix/s · ' + f2(s.area) + 'mm²/块 · ¥' + s.cost + ' · ' + s.note }
        : { title: '未知 ISP', sub: '—' }; }, 'isp');
    const vdecGroups = mkGroups(vdecU, 'vdecId', () => KIND_COLOR.vdec,
      id => { const s = KB.vdec(id); return s
        ? { title: s.name, sub: '解码力 ' + s.cap + ' · ' + f2(s.area) + 'mm²/块 · ¥' + s.cost + ' · ' + s.note }
        : { title: '未知解码器', sub: '—' }; }, 'vdec');
    const adspGroups = mkGroups(adspU, 'adspId', () => KIND_COLOR.adsp,
      id => { const s = KB.adsp(id); return s
        ? { title: s.name, sub: s.cap + ' GOPS · ' + f2(s.area) + 'mm²/块 · ¥' + s.cost + ' · ' + s.note }
        : { title: '未知音频 DSP', sub: '—' }; }, 'adsp');
    const hsioGroups = groupBy(hsioU, 'hsioId').map(([id, arr]) => {
      const h = KB.hsio(id);
      const cells = arr.reduce((a, u) => a + u.w * u.h, 0);
      return `<div class="group">
        <div class="group-head">
          <span class="pal-chip" style="background:${KIND_COLOR.hsio}"></span>
          <b>${h ? h.name : 'HSIO'}</b><span class="count-pill">×${arr.length}</span>
          <span class="spacer"></span>
          <button class="btn btn-icon btn-sm" data-act="del-kind" data-kind="hsio" data-key="hsioId" data-id="${id}">✕</button>
        </div>
        <div class="group-body"><div class="tiny muted">${h ? h.per + ' GB/s 每格 · 共 ' + cells + ' 格 = ' + fmt(h.per * cells) + ' GB/s · ¥' + Math.round(h.cost * cells) : '—'}</div></div>
      </div>`;
    }).join('');

    /* --- 选中单元 --- */
    const sel = st.units.find(u => u.uid === st.selected);
    let selPanel = '<div class="tiny muted">点击裸片上的方块查看详情：GPU 可拉伸，CPU 面积固定、按 R 横竖对调。</div>';
    if (sel) {
      const mc = E.minCells(sel, st);
      const cells = sel.w * sel.h;
      const bonus = E.unitBonus(sel, st);
      const isCpu = sel.kind === 'cpu';
      const editable = sel.kind === 'gpu';   // 只有 GPU 能靠超额面积换缓存加成
      const cnt = sel.count || 1;
      /* 这一块自己的配置（内存代数 / NPU 型号 / SLC 容量） */
      let cfg = '';
      if (sel.kind === 'slc') {
        cfg = `<div class="between"><span class="tiny muted">缓存容量</span>
          <div class="stepper"><button data-act="mb-">−</button><span class="val">${sel.mb || 1} MB</span><button data-act="mb+">+</button></div></div>
          <div class="tiny muted">叠多块 SLC，缓存总量相加；把 CPU 摆在它旁边还能拿局部性加成。</div>`;
      } else if (sel.kind === 'mem') {
        cfg = `<div class="field"><label>内存代数</label><select data-set="unitMem">
            ${KB.MEMORIES.map(m => `<option value="${m.id}" ${sel.memId === m.id ? 'selected' : ''}>${m.name}（${m.bw}GB/s）</option>`).join('')}
          </select></div>
          <div class="tiny muted">一块 = 一路内存控制器，叠多块带宽相加（现实中就是双通道 / 四通道）。</div>`;
      } else if (sel.kind === 'npu') {
        cfg = `<div class="field"><label>NPU 型号</label><select data-set="unitNpu">
            ${KB.NPUS.map(n => `<option value="${n.id}" ${sel.npuId === n.id ? 'selected' : ''}>${n.name} · ${n.tops} TOPS</option>`).join('')}
          </select></div>
          <div class="tiny muted">叠多块 NPU，算力相加（面积与功耗也跟着上）。</div>`;
      } else if (sel.kind === 'cpu' || sel.kind === 'gpu') {
        cfg = `<div class="between"><span class="tiny muted">当前频率</span><span class="mono" style="font-weight:650">${f2(E.unitFreq(sel))} GHz</span></div>`;
      } else if (sel.kind === 'isp') {
        cfg = `<div class="field"><label>ISP 型号</label><select data-set="unitIsp">
            ${KB.ISPS.map(x => `<option value="${x.id}" ${sel.ispId === x.id ? 'selected' : ''}>${x.name} · ${x.cap} GPix/s</option>`).join('')}
          </select></div>
          <div class="tiny muted">ISP 负责拍照与录像的原始信号处理，叠多块算力相加。</div>`;
      } else if (sel.kind === 'vdec') {
        cfg = `<div class="field"><label>解码器型号</label><select data-set="unitVdec">
            ${KB.VDECS.map(x => `<option value="${x.id}" ${sel.vdecId === x.id ? 'selected' : ''}>${x.name} · ${x.cap}</option>`).join('')}
          </select></div>
          <div class="tiny muted">专职解码，不占 CPU；叠多块可以同时解多路视频。</div>`;
      } else if (sel.kind === 'adsp') {
        cfg = `<div class="field"><label>音频 DSP 型号</label><select data-set="unitAdsp">
            ${KB.ADSPS.map(x => `<option value="${x.id}" ${sel.adspId === x.id ? 'selected' : ''}>${x.name} · ${x.cap} GOPS</option>`).join('')}
          </select></div>
          <div class="tiny muted">常驻小算力，功耗极低 —— 语音唤醒与音频解码靠它省电。</div>`;
      } else if (sel.kind === 'hsio') {
        const h = KB.hsio(sel.hsioId);
        cfg = `<div class="between"><span class="tiny muted">带宽</span><span class="mono" style="font-weight:650">${h ? fmt(h.per * sel.w * sel.h) + ' GB/s' : '—'}</span></div>
          <div class="tiny muted">${h ? h.per + ' GB/s / 格 · ¥' + h.cost + '/格 · ' + h.pw + 'W/格' : ''}；用下面的 W / H 自由拉长拉宽，形状随意。</div>`;
      } else if (sel.kind === 'modem') {
        cfg = `<div class="tiny muted">基带在右侧「固定模块」里换型号。</div>`;
      }
      selPanel = `<div class="group">
        <div class="group-head">
          <span class="pal-chip" style="background:${unitColor(sel)}"></span>
          <b>${esc(unitLabel(sel))}</b>
          ${cnt > 1 ? `<span class="count-pill">MP${cnt} 合并</span>` : ''}
          <span class="spacer"></span>
          <button class="btn btn-icon btn-sm" data-act="del-sel" title="删除">✕</button>
        </div>
        <div class="group-body">
          ${cfg}
          <div class="between">
            <span class="tiny muted">区块尺寸（格）</span>
            <span class="tiny mono">${sel.w} × ${sel.h} = ${cells}</span>
          </div>
          ${isCpu ? `
          <div class="row" style="gap:7px;flex-wrap:wrap">
            <button class="btn btn-sm" data-act="rot" title="横竖对调（R），面积不变">横竖 ↻</button>
            <span class="badge">面积固定 ${mc} 格</span>
          </div>
          <div class="tiny muted">
            CPU 核心占 ${mc} 格（${f2(E.unitMin(sel, st))}mm²），面积由物理尺寸固定，不能拉伸；只能横竖对调。
          </div>` : `
          <div class="row" style="gap:7px;flex-wrap:wrap">
            <div class="stepper"><button data-act="w-">−</button><span class="val">W ${sel.w}</span><button data-act="w+">+</button></div>
            <div class="stepper"><button data-act="h-">−</button><span class="val">H ${sel.h}</span><button data-act="h+">+</button></div>
            <button class="btn btn-sm" data-act="rot" title="横竖对调（R）">横竖 ↻</button>
          </div>
          <div class="tiny muted">
            物理最小 ${mc} 格（${f2(E.unitMin(sel, st))}mm²）
            ${editable ? `· 余量 ${Math.max(0, cells - mc)} 格 → 缓存加成 <b style="color:${bonus > 1 ? 'var(--ok)' : 'var(--ink-3)'}">+${((bonus - 1) * 100).toFixed(1)}%</b>` : ''}
          </div>`}
          ${locTag(sel) ? `<div class="tiny" data-loc style="color:${E.locality(sel, st) > 1.06 ? 'var(--ok)' : 'var(--ink-3)'}">${locTag(sel)}</div>` : ''}
          ${cnt > 1 ? `<button class="btn btn-sm" data-act="split">拆分成 ${cnt} 个独立核心</button>` : ''}
        </div>
      </div>`;
    }

    /* --- 合并面板 --- */
    let mergePanel = '';
    if (st.multi.length) {
      const mr = E.canMerge(st, st.multi);
      const picked = st.units.filter(u => st.multi.indexOf(u.uid) >= 0);
      const mp = picked.reduce((a, u) => a + (u.count || 1), 0);
      mergePanel = `<div class="group">
        <div class="group-head">
          <span class="pal-chip" style="background:${KIND_COLOR.gpu}"></span>
          <b>已选 ${picked.length} 块区域</b><span class="count-pill">${gpuCountLabel(picked[0] && picked[0].archId, mp)}</span>
          <span class="spacer"></span>
          <button class="btn btn-icon btn-sm" data-act="multi-clear" title="清除选择">✕</button>
        </div>
        <div class="group-body">
          <div class="tiny muted">${mr.ok
            ? `合并后占 ${mr.bb.w}×${mr.bb.h} = ${mr.bb.w * mr.bb.h} 格` + (mr.gap > 0 ? `，其中 <b>${mr.gap}</b> 格是为了补成矩形多付的面积` : '，一点面积都没浪费')
            : esc(mr.why)}</div>
          <button class="btn btn-primary btn-sm" data-act="merge" ${mr.ok ? '' : 'disabled'}>合并成一块 GPU</button>
          <div class="tiny muted">Shift + 点击 GPU 块可多选。只要彼此相连（边对边贴上）就能合并；共享 L2 每多一颗 +1.5%，最多 +6%。合并后块右上角的 <b>MPn</b> 就是它包含的原始核心数。</div>
        </div>
      </div>`;
    }

    return `
    <div class="section-head">
      <div><h2>② 摆版图 Floorplan<span class="badge" style="margin-left:10px">${seg().name}</span>${dieCount() > 1 ? `<span class="badge o" style="margin-left:6px">正在编辑 Die ${st.activeDie + 1}/${dieCount()}</span>` : ''}</h2>
        <p>CPU / GPU 都是<b>一颗核心一块版图</b>。拖拽移动；<b>GPU 可拖右下角缩放</b>，<b>CPU 面积固定、只能按 R 横竖对调</b>；放不下的空位会自动变形适配。<b>Shift + 点击</b>多个相连的 GPU 块可以合并成一块大区域；<b>空白处拖动框选</b>（手机：<b>长按空白处</b>再拖）后可批量<b>合并 GPU / 复制 / 删除</b>；<b>把 CPU 核心摆在 SLC 旁边</b>能拿到缓存局部性加成（最高 +12%）。${dieCount() > 1 ? '<br/>多 die：顶部切换 die，或点「总览图」查看完整拼接和互连。' : ''}</p>
      </div>
      <div class="wrap">
        <button class="btn btn-sm" data-act="share-layout">分享版图</button>
        <button class="btn btn-sm" data-act="autoplace">自动布局</button>
        <button class="btn btn-primary" data-act="to-pack">去流片 →</button>
      </div>
    </div>

    ${tabs}

    <div class="layout-grid">
      <aside class="glass card card-tight stack">
        <h3>添加元件</h3>
        <div class="palette">
          <div class="pal-item" data-act="add-cpu">
            <span class="pal-chip" style="background:${TIER_COLOR.prime}"></span>
            <div><b>＋ 添加 CPU 核心</b><small>选型号 → 拖入裸片</small></div>
          </div>
          <div class="pal-item" data-act="add-gpu">
            <span class="pal-chip" style="background:${KIND_COLOR.gpu}"></span>
            <div><b>＋ 添加 GPU 核心</b><small>选架构 → 拖入裸片</small></div>
          </div>
        </div>
        <div class="hr" style="margin:4px 0"></div>
        <div class="between"><h3>待放置</h3><span class="tiny muted" data-tray-count>${unplaced.length} 个</span></div>
        <div class="tray" data-tray>${tray}</div>
        <div class="hr" style="margin:4px 0"></div>
        <div class="tiny muted" style="line-height:1.9">
          <span class="pal-chip" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${TIER_COLOR.prime}"></span> 超大核 &nbsp;
          <span class="pal-chip" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${TIER_COLOR.big}"></span> 大核<br/>
          <span class="pal-chip" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${TIER_COLOR.mid}"></span> 中核 &nbsp;
          <span class="pal-chip" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${TIER_COLOR.small}"></span> 小核<br/>
          <span class="pal-chip" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${KIND_COLOR.gpu}"></span> GPU &nbsp;
          <span class="pal-chip" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${KIND_COLOR.modem}"></span> 基带
        </div>
      </aside>

      <section class="die-wrap">
        <div class="statbar">
          <div class="stat"><small>面积占用</small><b><span data-stat="cells">${v.cells}</span><span class="muted" style="font-size:11px">/${an.areaTotal}mm²</span></b></div>
          <div class="stat"><small>GB6 单核</small><b data-stat="single">${fmt(an.score.single)}</b></div>
          <div class="stat"><small>GB6 多核</small><b data-stat="multi">${fmt(an.score.multi)}</b></div>
          <div class="stat"><small>多核效率</small><b data-stat="eff">${(an.cpu.eff * 100).toFixed(0)}%</b></div>
          <div class="stat"><small>曼哈顿 3.1</small><b data-stat="gpu">${fmt(an.gpu.fps)}</b></div>
          <div class="stat"><small>峰值功耗</small><b data-stat="power">${f1(an.baseP + an.cpu.pk + an.gpu.pk)}</b></div>
          <div class="stat ${an.yieldRate < .6 ? 'warn' : 'good'}"><small>良率</small><b data-stat="yield">${(an.yieldRate * 100).toFixed(1)}%</b></div>
        </div>
        <div class="die-shell">
          <div class="die" id="die" style="--n:${st.n}">
            <div class="io-ring"></div>
            ${st.units.filter(u => u.x >= 0).map(u => blockHTML(u)).join('')}
            <div class="sel-box" id="selbox" style="${selBoxStyle}"></div>
            <div class="drop-preview" id="prev" style="display:none"></div>
          </div>
        </div>
        <div class="between" style="padding:0 2px">
          <div class="wrap" data-badges>${layoutBadgesHTML(v)}</div>
          <span class="tiny muted">${st.n}×${st.n} 网格 · 每格 1mm² · 空白处拖动可框选</span>
        </div>
      </section>

  function inSelRect(u) {
    const r = st.selRect;
    return !!(r && u.x >= 0 && u.x < r.x + r.w && u.x + u.w > r.x && u.y < r.y + r.h && u.y + u.h > r.y);
  }

  function blockHTML(u) {
    const n = st.n, cells = u.w * u.h;
    const c = unitColor(u), m = metal(c);
    const merged = u.kind === 'gpu' && (u.count || 1) > 1;
    const cls = 'blk' + (u.bad ? ' bad' : '') + (st.selected === u.uid ? ' sel' : '') +
      (st.multi.indexOf(u.uid) >= 0 ? ' mrg' : '') + (inSelRect(u) ? ' insel' : '') +
      (merged ? ' bgpu' : '') +
      (cells === 1 ? ' sz1' : cells >= 4 ? ' sz4up' : '');
    return `<div class="${cls}" data-uid="${u.uid}" data-tx="${txOf(u)}"
      style="left:${u.x / n * 100}%;top:${u.y / n * 100}%;width:${u.w / n * 100}%;height:${u.h / n * 100}%;--c:${c};--m1:${m[0]};--m2:${m[1]}">
      <span class="blk-t">${esc(unitLabel(u))}</span>
      <span class="blk-s">${esc(unitSub(u))}</span>
      ${merged ? `<span class="blk-n">${gpuCountLabel(u.archId, u.count)}</span>` : ''}
      ${u.kind === 'cpu' ? '' : '<span class="rz" data-rz="1"></span>'}</div>`;
  }

  /* 总览图：按实际 DOM 位置画互连线 */
  function drawOverviewLinks() {
    if (st.screen !== 'layout' || !st.overview) return;
    const wrap = document.getElementById('ovdies');
    const box = document.querySelector('.overview-wrap');
    const svg = document.getElementById('ovlinks');
    const labels = document.getElementById('ovlabels');
    if (!wrap || !box || !svg || !labels) return;
    /* SVG 覆盖的是 .overview-wrap（含 padding），坐标也要以它为原点 */
    const wr = box.getBoundingClientRect();
    if (!wr.width || !wr.height) return;
    [svg, labels].forEach(el => {
      el.setAttribute('viewBox', '0 0 ' + wr.width + ' ' + wr.height);
      el.setAttribute('width', wr.width);
      el.setAttribute('height', wr.height);
    });
    const tiles = Array.prototype.slice.call(wrap.querySelectorAll('.ov-die'));
    const xi = E.xdieInfo(st);
    let lines = '', chips = '';
    xi.links.forEach((l, li) => {
      const ab = l.key.split('-').map(Number);
      const ea = tiles[ab[0]], eb = tiles[ab[1]];
      if (!ea || !eb) return;
      const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
      const x1 = ra.left + ra.width / 2 - wr.left, y1 = ra.top + ra.height / 2 - wr.top;
      const x2 = rb.left + rb.width / 2 - wr.left, y2 = rb.top + rb.height / 2 - wr.top;
      lines += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${l.color}" stroke-width="${(2 + l.q * 4).toFixed(1)}" opacity=".8"/>`;
      /* 对角线会共用中点：把两条对角线的标签沿连线错开，避免叠在一起 */
      const diag = Math.abs(x2 - x1) > 10 && Math.abs(y2 - y1) > 10;
      const t = diag ? (li % 2 ? 0.38 : 0.62) : 0.5;
      const mx = x1 + (x2 - x1) * t, my = y1 + (y2 - y1) * t;
      const w = Math.max(28, l.short.length * 9 + 10);
      chips += `<g><rect x="${(mx - w / 2).toFixed(1)}" y="${(my - 8).toFixed(1)}" width="${w}" height="16" rx="8" fill="rgba(18,18,22,.88)" stroke="${l.color}" stroke-width="1"/><text x="${mx.toFixed(1)}" y="${(my + 3.2).toFixed(1)}" fill="#fff" text-anchor="middle">${esc(l.short)}</text></g>`;
    });
    svg.innerHTML = lines;
    labels.innerHTML = chips;
  }
