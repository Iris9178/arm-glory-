  function showPicker(kind) {
    const meta = {
      cpu: { title: '选择 CPU 核心型号', hint: '点击型号加入「待放置」，然后拖到裸片上。数量不设上限，放不下是你自己的事。把大核摆在 SLC 旁边能拿到缓存局部性加成。' },
      gpu: { title: '选择 GPU 架构', hint: '点击架构加入「待放置」。只要彼此相连，就能 Shift 多选后合并成一块大 GPU 区域。' },
      mem: { title: '添加内存控制器', hint: '可以叠多块 —— 带宽相加，但总线会给边际递减，堆太多不划算。' },
      npu: { title: '添加 NPU', hint: '可以叠多块 —— 算力直接相加，面积和功耗也跟着上。' },
      isp: { title: '添加 ISP', hint: '图像信号处理器：拍照与录像的核心。可叠多块，算力相加。' },
      vdec: { title: '添加视频解码器', hint: '专职视频解码，不占 CPU。想流畅看 8K / AV1 就靠它。' },
      adsp: { title: '添加音频 DSP', hint: '音频与语音的常驻小算力，功耗极低，能省下不少待机耗电。' },
      hsio: { title: '添加高速连接', hint: '长宽完全自由：加进来后，在「选中模块」面板用 W / H 拉到你要的形状。带宽、成本、功耗都按占格数算。' },
      slc: { title: '添加 SLC 系统缓存', hint: '可以叠多块 —— 缓存总量相加。把 CPU 核心摆在 SLC 旁边，频率没变但延迟变低，跑分会涨。' }
    }[kind];

    let body = '';
    if (kind === 'cpu' || kind === 'gpu') {
      const isCpu = kind === 'cpu';
      const list = isCpu ? KB.CPU_CORES : KB.GPU_ARCHS;
      const years = Array.from(new Set(list.map(x => x.year))).sort((a, b) => b - a);
      body = years.map(y => {
        const items = list.filter(x => x.year === y).map(x => {
          if (isCpu) {
            const t = KB.TIERS[x.tier];
            return `<button class="pick" data-pick="cpu:${x.id}">
              <span class="pal-chip" style="background:${TIER_COLOR[x.tier]}"></span>
              <div><b>${x.name}</b><small>${t.label} · ${f2(x.area)}mm² · 上限 ${x.maxF}GHz${x.sme2 ? ' · SME2' : ''}</small></div></button>`;
          }
          return `<button class="pick" data-pick="gpu:${x.id}">
            <span class="pal-chip" style="background:${x.ai ? '#c026d3' : '#d98324'}"></span>
            <div><b>${x.name}</b><small>${x.gen} · ${isAdreno(x.id) ? '整颗' : '单核'} ${f2(x.area)}mm² · 上限 ${x.maxF}GHz${x.rt ? ' · 光追' : ''}</small></div></button>`;
        }).join('');
        return `<div style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">${y}</div><div class="pick-list">${items}</div></div>`;
      }).join('');
    } else if (kind === 'mem') {
      body = '<div class="pick-list" style="margin-top:16px">' + KB.MEMORIES.map(m =>
        `<button class="pick" data-pick="mem:${m.id}">
          <span class="pal-chip" style="background:${KIND_COLOR.mem}"></span>
          <div><b>${m.name}</b><small>${m.bw} GB/s · ${f2(m.area)}mm² · ¥${m.cost}</small></div></button>`).join('') + '</div>';
    } else if (kind === 'npu') {
      body = '<div class="pick-list" style="margin-top:16px">' + KB.NPUS.map(n =>
        `<button class="pick" data-pick="npu:${n.id}">
          <span class="pal-chip" style="background:${KIND_COLOR.npu}"></span>
          <div><b>${n.name}</b><small>${n.tops} TOPS · ${f2(n.area)}mm² · ¥${n.cost}</small></div></button>`).join('') + '</div>';
    } else {
      const SPECS = {
        slc:  { list: KB.SLC_SIZES, color: KIND_COLOR.slc,  title: i => i.mb + ' MB',  sub: i => f2(i.mb * 0.18) + 'mm² · ' + i.note },
        isp:  { list: KB.ISPS,      color: KIND_COLOR.isp,  title: i => i.name,         sub: i => i.cap + ' GPix/s · ' + f2(i.area) + 'mm² · ¥' + i.cost },
        vdec: { list: KB.VDECS,     color: KIND_COLOR.vdec, title: i => i.name,         sub: i => '解码力 ' + i.cap + ' · ' + f2(i.area) + 'mm² · ¥' + i.cost },
        adsp: { list: KB.ADSPS,     color: KIND_COLOR.adsp, title: i => i.name,         sub: i => i.cap + ' GOPS · ' + f2(i.area) + 'mm² · ¥' + i.cost },
        hsio: { list: KB.HSIOS,     color: KIND_COLOR.hsio, title: i => i.name,         sub: i => i.per + 'GB/s 每格 · 默认 ' + i.w + '×' + i.h + ' · ¥' + i.cost + '/格' }
      }[kind];
      body = '<div class="pick-list" style="margin-top:16px">' + SPECS.list.map(i =>
        `<button class="pick" data-pick="${kind}:${i.id !== undefined ? i.id : i.mb}">
          <span class="pal-chip" style="background:${SPECS.color}"></span>
          <div><b>${SPECS.title(i)}</b><small>${SPECS.sub(i)}</small></div></button>`).join('') + '</div>';
    }

    const countRow = (kind === 'cpu' || kind === 'gpu')
      ? `<div class="row" style="margin-top:16px;gap:12px">
          <span class="tiny muted">本次添加数量</span>
          <div class="stepper"><button data-act="pick-">−</button><span class="val" id="pick-count">${pickCount}</span><button data-act="pick+">+</button></div>
          <span class="tiny muted">个（1 个 → 手动拖入；多个 → 自动铺好）</span>
        </div>` : '';

    popup(`
      <div class="between">
        <div><h2>${meta.title}</h2><p class="tiny muted" style="margin-top:4px;max-width:56ch">${meta.hint}</p></div>
        <button class="btn btn-icon" onclick="document.getElementById('modal').hidden=true">✕</button>
      </div>
      ${countRow}
      ${body}`);
  }

  /* ============================================================
     ③ 流片封装
     ============================================================ */
  function viewPack() {
    E.syncAllUnits(st);
    const an = E.analyze(st);
    const allU = E.allUnitsOf(st);
    const dieBody = units => '<div class="io-ring"></div>' + (units || []).filter(u => u.x >= 0).map(u => {
      const n = st.n, c = unitColor(u), m = metal(c);
      const cnt = u.count || 1;
      const merged = u.kind === 'gpu' && cnt > 1;
      return `<div class="blk${merged ? ' bgpu' : ''}" data-tx="${txOf(u)}" style="left:${u.x / n * 100}%;top:${u.y / n * 100}%;width:${u.w / n * 100}%;height:${u.h / n * 100}%;--c:${c};--m1:${m[0]};--m2:${m[1]}">
        <span class="blk-t">${esc(unitLabel(u))}</span>${merged ? `<span class="blk-n">${gpuCountLabel(u.archId, cnt)}</span>` : ''}</div>`;
    }).join('');
    const dieInner = dieBody(st.units);
    const chipletHTML = dieCount() > 1
      ? `<div class="chiplet-grid ${dieCount() === 2 ? 'two' : dieCount() === 3 ? 'three' : 'four'}">${st.dies.map((d, i) =>
          `<div class="chiplet-tile"><div class="die" style="--n:${st.n}">${dieBody(d.units)}</div><span class="clabel">D${i + 1}</span></div>`).join('')}</div>`
      : dieInner;

    const placedU = allU.filter(u => u.x >= 0);
    const cpuByModel = {};
    placedU.filter(u => u.kind === 'cpu').forEach(u => { cpuByModel[u.coreId] = (cpuByModel[u.coreId] || 0) + 1; });
    const cpuDesc = Object.keys(cpuByModel).map(id => `${cpuByModel[id]}×${KB.core(id).short}@${f2(E.unitFreq(placedU.find(u => u.coreId === id)))}G`).join(' + ');
    const gpuByArch = {};
    placedU.filter(u => u.kind === 'gpu').forEach(u => { gpuByArch[u.archId] = (gpuByArch[u.archId] || 0) + (u.count || 1); });
    const gpuDesc = Object.keys(gpuByArch).map(id => `${KB.gpu(id).name.replace('Mali ', '')} ${gpuCountLabel(id, gpuByArch[id])}`).join(' + ');
    const gpuAllAdreno = placedU.some(u => u.kind === 'gpu') &&
      placedU.filter(u => u.kind === 'gpu').every(u => isAdreno(u.archId));

    return `
    <div class="section-head">
      <div><h2>③ 流片 · 封装 · 展示</h2>
        <p>把版图切成裸片、盖上封装基板、打出焊球 —— 这就是你手里这颗 SoC 了。</p></div>
      <div class="wrap">
        <button class="btn btn-sm" data-act="back-layout">← 回去改版图</button>
        <button class="btn btn-primary" data-act="to-oc">进超频实验室 →</button>
      </div>
    </div>
    <div class="pack-stage">
      <div class="glass card">
        <div class="pack-scene">
          <div class="package">
            <div class="pack-brand">${esc(st.brand)}</div>
            <div class="pack-die">${chipletHTML}</div>
            <div class="pack-label">${esc(st.chipName).toUpperCase()}</div>
          </div>
        </div>
        <div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap">
          <span class="badge">${KB.node(st.node).name}</span>
          <span class="badge">${an.dieCount} × ${st.mm2}mm² die</span>
          ${an.dieCount > 1 ? `<span class="badge">互连 ${an.xdie.topoDef.name} · Q ${(an.xdie.Q * 100).toFixed(0)}%</span>` : ''}
          <span class="badge g">封装良率 ${(an.yieldRate * 100).toFixed(1)}%</span>
          <span class="badge o">单颗成本 ¥${fmt(an.bom)}</span>
        </div>
      </div>
      <div class="stack">
        <div class="glass card">
          <h3 style="margin-bottom:12px">规格书 Spec Sheet</h3>
          <div class="field" style="margin-bottom:12px"><label>芯片名</label><input type="text" id="f-name2" value="${esc(st.chipName)}" maxlength="18"/></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
            <div class="spec-lite"><small>Die / 互连</small><b>${an.dieCount > 1 ? an.dieCount + ' die · ' + an.xdie.topoDef.name : '单片'}</b><div class="tiny muted">${an.dieCount > 1 ? (an.xdie.links.map(l => l.short).join(' / ') || '—') + ' · Q ' + (an.xdie.Q * 100).toFixed(0) + '%' : '单 die'} · 单 die 良率 ${(an.dieYield * 100).toFixed(1)}%</div></div>

  /* ============================================================
     ④ 超频实验室
     ============================================================ */
  function ocPreview() {
    const l = E.limits(st, st.quality);
    const base = E.primeFreq(st) || 1;
    const gb = E.gpuFreq(st) || 1;
    const maxCpuMult = clamp(l.cpuHard / base, 1.05, 1.8);
    const maxGpuMult = clamp(l.gpuHard / gb, 1.05, 1.8);
    st.oc.cpuMult = clamp(st.oc.cpuMult, 0.85, maxCpuMult);
    st.oc.gpuMult = clamp(st.oc.gpuMult, 0.85, maxGpuMult);
    const PL = plimitFor(dieCount());
    st.oc.pLimit = clamp(st.oc.pLimit, PL.min, PL.max);
    /* 实验室预览必须永远有数字：强制不翻车，翻车交给正式跑分的确定性判定。
       否则一套高风险参数会让 sim.peak=null，预览页直接抛错、首屏空白。 */
    const sim = E.simulate(st, st.oc, st.quality, { rng: () => 1 });
    return { l, base, gb, maxCpuMult, maxGpuMult, sim, rk: sim.rk, PL };
  }

  function viewOC() {
    const { l, base, gb, maxCpuMult, maxGpuMult, sim, rk, PL } = ocPreview();
    const cpuF = base * st.oc.cpuMult, gpuF = gb * st.oc.gpuMult;
    const power = E.powerAt(st, st.oc, cpuF, gpuF);
    const totalP = sim.an.baseP + power.total;
    const risk = rk.risk;
    const riskColor = risk < 0.06 ? '#0ea5a0' : risk < 0.25 ? '#7a7a85' : risk < 0.5 ? '#b4732a' : '#b3423f';
    const riskText = risk < 0.06 ? '稳如老狗' : risk < 0.25 ? '略有风险' : risk < 0.5 ? '心跳加速' : '大概率翻车';

    const preview = sim.peak || { single: 0, multi: 0, gpu: 0, total: 0 };

    return `
    <div class="section-head">
      <div><h2>④ 超频实验室 Overclock Lab<span class="badge" style="margin-left:10px">${seg().name}</span>${dieCount() > 1 ? `<span class="badge o" style="margin-left:6px">${dieCount()} die 封装</span>` : ''}</h2>
        <p>拉频率、加压、解锁功耗墙。温度会爬到稳态，芯片开始降频 —— 跑分的「峰值」和「持续」是两回事。</p></div>

      <div class="stack">
        <div class="glass card">
          <div class="between"><h3>频率与电压</h3>
            <span class="badge">体质 CPU ${(st.quality.cpu * 100).toFixed(0)}% · GPU ${(st.quality.gpu * 100).toFixed(0)}%</span></div>

          <div class="stack">
            <div class="oc-slider">
              <div class="between"><span class="small muted">性能核频率倍率</span><span class="v mono" data-ocv="cpu">${st.oc.cpuMult.toFixed(2)}× → ${f2(cpuF)} GHz</span></div>
              <input type="range" data-oc="cpuMult" min="0.85" max="${maxCpuMult.toFixed(2)}" step="0.01" value="${st.oc.cpuMult}" style="--p:${(st.oc.cpuMult - 0.85) / (maxCpuMult - 0.85) * 100}%"/>
              <div class="between tiny muted"><span>0.85×（省电）</span><span>设计值 ${f2(base)}GHz · 安全上限 ${f2(rk.limits.cpuSafe)}GHz</span></div>
            </div>
            <div class="oc-slider">
              <div class="between"><span class="small muted">GPU 频率倍率</span><span class="v mono" data-ocv="gpu">${st.oc.gpuMult.toFixed(2)}× → ${f2(gpuF)} GHz</span></div>

              <div class="between tiny"><span class="mono">θ=${effRth.toFixed(2)} K/W</span><span class="mono">+¥${c.cost}</span></div>
            </div>`;
            }).join('')}
          </div>
        </div>
      </div>
      <div class="stack">
        <div class="glass card">
          <h3>实时预测</h3><div class="hr"></div>
          <div class="between"><span class="small muted">预估峰值功耗</span><b class="mono" style="font-size:17px" data-ocv="power">${f1(totalP)} W</b></div>
          <div class="between" style="margin-top:9px"><span class="small muted">预估峰值温度</span><b class="mono" style="font-size:17px;color:${tag.c}" data-ocv="ptemp">${sim.peakT.toFixed(0)} °C</b></div>
          <div class="thermo" style="margin:12px 0 5px"><div class="mark" style="left:${clamp(sim.peakT / 110 * 100, 1, 99)}%" data-ocv="mark"></div></div>
          <div class="between tiny muted"><span>26°C 室温</span><span>${seg().tjmax}°C 温度墙</span><span>110°C</span></div>
          <div class="hr"></div>
          <div class="between"><span class="small muted">稳态降频后</span><b class="mono" style="font-size:17px" data-ocv="thr">${(sim.throttle * 100).toFixed(0)}%</b></div>
          <div class="between" style="margin-top:9px"><span class="small muted">预估持续温度</span><b class="mono" data-ocv="stemp">${sim.sustT.toFixed(0)} °C</b></div>
        </div>
        <div class="glass card">
          <h3>稳定性风险评估</h3>

          <div class="between" style="margin-top:7px"><span class="small muted">预计综合分</span><b class="mono" style="font-size:16px" data-ocv="total">${fmt(preview.total)}</b></div>
          <div class="tiny muted" style="margin-top:6px">预览按“不翻车”计算；实际跑分是否翻车取决于下面的稳定性风险。</div>

  }

  /** 滑块拖动时只改数字，不重绘整页 —— 每次 input 都重建玻璃层，看起来就是闪屏 */
  function updateOCLive() {
    if (st.screen !== 'oc') return;
    const { sim, rk } = ocPreview();
    const base = E.primeFreq(st) || 1, gb = E.gpuFreq(st) || 1;
    const cpuF = base * st.oc.cpuMult, gpuF = gb * st.oc.gpuMult;
    const pw = E.powerAt(st, st.oc, cpuF, gpuF);
    const totalP = sim.an.baseP + pw.total;
    const risk = rk.risk;
    const riskColor = risk < 0.06 ? '#0ea5a0' : risk < 0.25 ? '#7a7a85' : risk < 0.5 ? '#b4732a' : '#b3423f';
    const riskText = risk < 0.06 ? '稳如老狗' : risk < 0.25 ? '略有风险' : risk < 0.5 ? '心跳加速' : '大概率翻车';
    const tag = E.tempTag(sim.peakT);
    const txt = (k, v) => { const el = document.querySelector(`[data-ocv="${k}"]`); if (el) el.textContent = v; };
    const sty = (k, p, v) => { const el = document.querySelector(`[data-ocv="${k}"]`); if (el) el.style[p] = v; };

    txt('cpu', st.oc.cpuMult.toFixed(2) + '× → ' + f2(cpuF) + ' GHz');
    txt('gpu', st.oc.gpuMult.toFixed(2) + '× → ' + f2(gpuF) + ' GHz');
    txt('voff', (st.oc.vOff > 0 ? '+' : '') + st.oc.vOff + ' mV');
    txt('plimit', st.oc.pLimit + ' W');
    txt('power', f1(totalP) + ' W');
    txt('ptemp', sim.peakT.toFixed(0) + ' °C');
    sty('ptemp', 'color', tag.c);
    sty('mark', 'left', clamp(sim.peakT / 110 * 100, 1, 99) + '%');
    txt('thr', (sim.throttle * 100).toFixed(0) + '%');
    txt('stemp', sim.sustT.toFixed(0) + ' °C');
    txt('risk', (risk * 100).toFixed(0) + '%');
    sty('risk', 'color', riskColor);
    sty('riskbar', 'width', (risk * 100) + '%');
    sty('riskbar', 'background', riskColor);
    txt('risktext', riskText + (risk > 0.02 ? ' —— 建议降频或加压' : ''));
    const head = document.querySelector('[data-ocv="head"]');
    if (head) head.innerHTML =
      'CPU ' + f2(cpuF) + 'GHz vs 安全线 ' + f2(rk.limits.cpuSafe) + 'GHz（' + (rk.headroomCpu * 100).toFixed(0) + '%）<br/>' +
      'GPU ' + f2(gpuF) + 'GHz vs 安全线 ' + f2(rk.limits.gpuSafe) + 'GHz（' + (rk.headroomGpu * 100).toFixed(0) + '%）<br/>' +
      '当前 vGain ×' + rk.vGain.toFixed(3);
    const preview = sim.peak || { single: 0, multi: 0, gpu: 0, total: 0 };
    txt('gb', fmt(preview.single) + ' / ' + fmt(preview.multi));
    txt('fps', fmt(preview.gpu) + ' fps');
    txt('total', fmt(preview.total));
  }

  /* ============================================================
     跑分
     ============================================================ */
  const TESTS = [
    { id: 'st', name: 'Geekbench 6 · 单核', sub: 'CPU Single-Core', pick: s => fmt(s.single) + ' 分' },
    { id: 'mt', name: 'Geekbench 6 · 多核', sub: 'CPU Multi-Core', pick: s => fmt(s.multi) + ' 分' },
    { id: 'gpu', name: 'GFXBench · 曼哈顿 3.1', sub: '1080p Offscreen', pick: s => fmt(s.gpu) + ' fps' },
    { id: 'mem', name: '内存带宽', sub: 'LPDDR Streaming', pick: s => f1(s.mem.bw) + ' GB/s' },
    { id: 'ai', name: 'AI 算力', sub: 'SME2 + NPU', pick: s => fmt(s.ai) + ' 分' },
    { id: 'all', name: '鲸兔兔 v10 · 综合', sub: 'CPU+GPU+MEM+AI', pick: s => fmt(s.total) + ' 分' }

  function viewBench() {
    return `
    <div class="section-head">
      <div><h2>跑分中… 请不要碰手机</h2>
        <p>温度正在爬升，风扇（如果有的话）正在起飞。</p></div>
    </div>
    <div class="bench-wrap">
      <div class="glass card">
        <div class="progress-ring">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(0,0,0,.07)" stroke-width="7"/>
            <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#18181b" stroke-width="7"
              stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327"/>
          </svg>
          <div class="pct"><div><b id="pct">0</b><small id="pct-sub">GEARING UP</small></div></div>
        </div>
        <canvas class="chart" id="chart" style="margin-top:16px"></canvas>
        <div class="between tiny muted" style="margin-top:7px">
          <span>■ 温度 °C</span><span>■ 功耗 W</span><span>■ 频率保持率</span>
        </div>
      </div>
      <div class="glass card">
        <h3 style="margin-bottom:11px">测试项目</h3>
        <div class="test-list" id="tests">
          ${TESTS.map(t => `<div class="test-row" data-t="${t.id}">
            <div><div class="tname">${t.name}</div><div class="tsub">${t.sub}</div></div><b class="tv">—</b></div>`).join('')}
        </div>
      </div>
    </div>`;
  }

  function runBench() {
    st.pending = null;
    st.result = E.simulate(st, st.oc, st.quality, { rng: seedRng(benchSeed()) });
    st.screen = 'bench';
    render();
    if (st.result.crashed) {
      setTimeout(() => document.body.classList.add('crash-flash'), 900);
      setTimeout(() => {
        document.body.classList.remove('crash-flash');
        st.screen = 'result'; st.runs++; save(); render();
      }, 2600);
      return;
    }
    animateBench();
  }

  function animateBench() {
    const sim = st.result, series = sim.series;
    const ring = $('#ring'), pct = $('#pct'), sub = $('#pct-sub'), cv = $('#chart');
    const total = TESTS.length;
    let t0 = performance.now();
    const STEP = 760, DUR = total * STEP;
    function frame(now) {
      const p = clamp((now - t0) / DUR, 0, 1);
      if (ring) ring.setAttribute('stroke-dashoffset', String(327 * (1 - p)));
      if (pct) pct.textContent = Math.round(p * 100);
      const idx = Math.min(total - 1, Math.floor(p * total));
      $$('.test-row').forEach((row, i) => {
        row.classList.toggle('done', i < idx);
        row.classList.toggle('run', i === idx);
        if (i < idx) row.querySelector('.tv').textContent = TESTS[i].pick(sim.sust);
      });
      if (sub) sub.textContent = (p < 1 && TESTS[idx]) ? TESTS[idx].name.toUpperCase() : 'FINISHED';
      drawChart(cv, series, Math.max(2, Math.round(p * series.length)));
      if (p < 1) requestAnimationFrame(frame);
      else {
        const row = $$('.test-row')[total - 1];
        row.classList.remove('run'); row.classList.add('done');
        row.querySelector('.tv').textContent = TESTS[total - 1].pick(sim.sust);
        setTimeout(() => { st.screen = 'result'; st.runs++; save(); render(); }, 780);
      }
    }
    requestAnimationFrame(frame);
  }

  function drawChart(cv, series, upto) {
    if (!cv || !cv.clientWidth) return;
    const w = cv.clientWidth, h = cv.clientHeight || 180;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    const pad = { l: 30, r: 30, t: 12, b: 22 };
    const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
    const data = series.slice(0, upto);
    if (data.length < 2) return;
    const Tmax = 110, Pmax = Math.max(12, Math.max.apply(null, series.map(d => d.P)) * 1.2);
    const X = i => pad.l + iw * (i / (series.length - 1));
    const YT = v => pad.t + ih * (1 - v / Tmax);
    const YP = v => pad.t + ih * (1 - v / Pmax);

    g.strokeStyle = 'rgba(0,0,0,.10)'; g.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad.t + ih * i / 4;
      g.beginPath(); g.moveTo(pad.l, y); g.lineTo(pad.l + iw, y); g.stroke();
    }
    const wall = KB.seg(st.seg).tjmax;
    g.strokeStyle = 'rgba(179,66,63,.4)'; g.setLineDash([4, 4]);
    g.beginPath(); g.moveTo(pad.l, YT(wall)); g.lineTo(pad.l + iw, YT(wall)); g.stroke();
    g.setLineDash([]);
    g.fillStyle = 'rgba(179,66,63,.8)'; g.font = '9px system-ui';
    g.fillText(wall + '°C 温度墙', pad.l + 3, YT(wall) - 3);

    g.fillStyle = 'rgba(14,165,160,.22)';
    data.forEach((d, i) => g.fillRect(X(i), h - pad.b + 4, Math.max(1, iw / series.length), 7 * d.thr));

    const grad = g.createLinearGradient(0, pad.t, 0, pad.t + ih);
    grad.addColorStop(0, 'rgba(24,24,27,.16)');
    grad.addColorStop(1, 'rgba(24,24,27,.01)');
    g.beginPath(); g.moveTo(X(0), YT(data[0].T));
    data.forEach((d, i) => g.lineTo(X(i), YT(d.T)));
    g.lineTo(X(data.length - 1), pad.t + ih); g.lineTo(X(0), pad.t + ih); g.closePath();
    g.fillStyle = grad; g.fill();
    g.beginPath(); data.forEach((d, i) => i ? g.lineTo(X(i), YT(d.T)) : g.moveTo(X(i), YT(d.T)));
    g.strokeStyle = '#18181b'; g.lineWidth = 1.8; g.stroke();

    g.beginPath(); data.forEach((d, i) => i ? g.lineTo(X(i), YP(d.P)) : g.moveTo(X(i), YP(d.P)));
    g.strokeStyle = '#8b5cf6'; g.lineWidth = 1.8; g.setLineDash([5, 3]); g.stroke();
    g.setLineDash([]);

    g.fillStyle = 'rgba(0,0,0,.42)'; g.font = '9px system-ui';
    g.fillText('110°', 5, pad.t + 8); g.fillText('0°C', 5, pad.t + ih);
    g.fillText(Pmax.toFixed(0) + 'W', w - 28, pad.t + 8); g.fillText('0W', w - 20, pad.t + ih);
  }

  /* ============================================================
     一键分享 · Canvas 海报
     · 版图页：放大版图 + 模块清单（名称 + 数量）
     · 结果页：封装芯片 + 跑分成绩
     纯 Canvas 绘制，不依赖外部图片，toDataURL 不会被污染
     ============================================================ */
  const SHARE_FONT = '"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif';
  let shareCanvas = null, shareName = '';

  const shareFont = (weight, size) => weight + ' ' + size + 'px ' + SHARE_FONT;

  function shareRound(ctx, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function shareWrap(ctx, text, maxW) {
    const chars = Array.from(String(text));
    const out = [];
    let line = '';
    chars.forEach(ch => {
      const t = line + ch;
      if (line && ctx.measureText(t).width > maxW) { out.push(line); line = ch; }
      else line = t;
    });
    if (line) out.push(line);
    return out.length ? out : [''];
  }

  function sharePills(ctx, items, x, y, maxW) {
    ctx.textBaseline = 'middle';
    ctx.font = shareFont(500, 15);
    let cx = x, cy = y;
    items.forEach(txt => {
      const w = ctx.measureText(txt).width + 28;
      if (cx + w > x + maxW) { cx = x; cy += 36; }
      ctx.fillStyle = 'rgba(0,0,0,.045)';
      shareRound(ctx, cx, cy, w, 28, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#52525b'; ctx.textAlign = 'left';
      ctx.fillText(txt, cx + 14, cy + 14);
      cx += w + 8;
    });
    ctx.textBaseline = 'alphabetic';
    return cy + 28;
  }

  /** 画一块裸片；opts.labels=false 时只画色块（用于封装缩略） */
  function drawShareDie(ctx, x, y, size, units, n, opts) {
    opts = opts || {};
    const cell = size / Math.max(1, n);
    const r = opts.radius || 10;
    ctx.save();
    shareRound(ctx, x, y, size, size, r);
    ctx.clip();

    /* 硅片虹彩 */
    const bg = ctx.createLinearGradient(x, y, x + size, y + size);
    [['0', '#ff8fc4'], ['0.16', '#ffc07a'], ['0.33', '#f2e88c'], ['0.5', '#8ff0cf'],
     ['0.67', '#8fd4ff'], ['0.84', '#b89bff'], ['1', '#ff8fc4']]
      .forEach(([p, c]) => bg.addColorStop(parseFloat(p), c));
    ctx.fillStyle = bg;
    ctx.fillRect(x, y, size, size);

    /* 网格 */
    ctx.save();
    ctx.globalAlpha = 0.13;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    for (let i = 1; i < n; i++) {
      const p = i * cell;
      ctx.beginPath(); ctx.moveTo(x + p, y); ctx.lineTo(x + p, y + size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + p); ctx.lineTo(x + size, y + p); ctx.stroke();
    }
    ctx.restore();

    /* IO 焊盘 */
    if (opts.io !== false) {
      const step = Math.max(9, cell * 0.2);
      ctx.fillStyle = 'rgba(255,240,200,.9)';
      for (let p = 7; p < size - 7; p += step) {
        [[x + p, y + 4], [x + p, y + size - 4], [x + 4, y + p], [x + size - 4, y + p]].forEach(([bx, by]) => {
          ctx.beginPath(); ctx.arc(bx, by, 1.5, 0, Math.PI * 2); ctx.fill();
        });
      }
    }

    units.forEach(u => {
      if (!u || u.x < 0) return;
      const bx = x + u.x * cell, by = y + u.y * cell;
      const bw = u.w * cell, bh = u.h * cell;
      if (bw < 1 || bh < 1) return;
      const m = metal(unitColor(u));
      const g = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
      g.addColorStop(0, m[1]); g.addColorStop(1, m[0]);
      ctx.fillStyle = g;
      ctx.fillRect(bx + 1, by + 1, Math.max(0, bw - 2), Math.max(0, bh - 2));
      ctx.strokeStyle = 'rgba(0,0,0,.38)'; ctx.lineWidth = 1;
      ctx.strokeRect(bx + 1.5, by + 1.5, Math.max(0, bw - 3), Math.max(0, bh - 3));
      /* 左侧等级色条 */
      ctx.fillStyle = unitColor(u);
      ctx.fillRect(bx + 1.5, by + 1.5, Math.max(3, Math.min(5, cell * 0.06)), Math.max(0, bh - 3));

      if (opts.labels === false) return;

      const padL = Math.max(4, Math.min(10, cell * 0.13));
      const padT = Math.max(3, Math.min(7, cell * 0.09));
      const maxW = bw - padL - 4;
      const maxH = bh - padT * 2;
      if (maxW < 6 || maxH < 6) return;

      let fs = clamp(Math.min(bw / 5.0, bh / 3.0), 7, 17);
      let lines = [''];
      let lineH = fs * 1.12;
      for (let k = 0; k < 10; k++) {
        ctx.font = shareFont(700, fs);
        lines = shareWrap(ctx, unitLabel(u), maxW);
        lineH = fs * 1.12;
        if (lines.length * lineH <= maxH || fs <= 7) break;
        fs -= 1;
      }
      const showSub = bh > fs * 3.1 && maxW > fs * 3;
      const subH = showSub ? fs * 0.95 : 0;
      const totalH = lines.length * lineH + subH;

      ctx.save();
      ctx.beginPath();
      ctx.rect(bx + padL - 1, by + 1, Math.max(1, bw - padL - 2), Math.max(1, bh - 2));
      ctx.clip();
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.shadowColor = 'rgba(0,0,0,.7)';
      ctx.shadowBlur = 2;
      ctx.shadowOffsetY = 1;
      ctx.fillStyle = 'rgba(255,255,255,.97)';
      let ty = by + (bh - totalH) / 2 + fs * 0.95;
      lines.forEach(ln => { ctx.fillText(ln, bx + padL, ty); ty += lineH; });
      if (showSub) {
        ctx.font = shareFont(500, fs * 0.82);
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.fillText(unitSub(u), bx + padL, ty);
      }
      ctx.restore();

      /* 合并 GPU 的原始核心数 */
      if (u.kind === 'gpu' && (u.count || 1) > 1 && bw > cell * 0.9) {
        const txt = gpuCountLabel(u.archId, u.count);
        ctx.font = shareFont(700, Math.max(8, fs * 0.78));
        const tw = ctx.measureText(txt).width;
        if (tw + 8 < bw - 4) {
          ctx.fillStyle = 'rgba(0,0,0,.55)';
          shareRound(ctx, bx + bw - tw - 8, by + 4, tw + 8, fs * 1.25, 3); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
          ctx.fillText(txt, bx + bw - tw - 4, by + 4 + fs * 0.98);
        }
      }
    });

    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.2)';
    ctx.lineWidth = 2;
    shareRound(ctx, x, y, size, size, r);
    ctx.stroke();
  }

  /** 模块清单：同名同频合并计数 */
  function shareLegend(units) {
    const map = new Map();
    const add = (key, label, color, n, sub) => {
      const o = map.get(key) || { label, color, count: 0, sub: '' };
      o.count += n;
      if (sub) o.sub = sub;
      map.set(key, o);
    };
    units.filter(u => u && u.x >= 0).forEach(u => {
      if (u.kind === 'cpu') {
        const c = KB.core(u.coreId); if (!c) return;
        add('cpu:' + u.coreId, c.name, TIER_COLOR[c.tier], 1, f2(E.unitFreq(u)) + ' GHz');
      } else if (u.kind === 'gpu') {
        const a = KB.gpu(u.archId); if (!a) return;
        const cnt = u.count || 1;
        add('gpu:' + u.archId, a.name + (cnt > 1 ? ' ' + gpuCountLabel(u.archId, cnt) : ''),
          a.ai ? '#c026d3' : '#d98324', cnt, f2(E.unitFreq(u)) + ' GHz');
      } else if (u.kind === 'mem') {
        const m = KB.mem(u.memId); if (m) add('mem:' + u.memId, m.name, KIND_COLOR.mem, 1, m.bw + ' GB/s');
      } else if (u.kind === 'npu') {
        const x = KB.npu(u.npuId); if (x) add('npu:' + u.npuId, x.name, KIND_COLOR.npu, 1, x.tops + ' TOPS');
      } else if (u.kind === 'slc') {
        add('slc:' + (u.mb || 0), 'SLC ' + (u.mb || 0) + ' MB', KIND_COLOR.slc, 1, '');
      } else if (u.kind === 'isp') {
        const x = KB.isp(u.ispId); if (x) add('isp:' + u.ispId, x.name, KIND_COLOR.isp, 1, x.cap + ' GPix/s');
      } else if (u.kind === 'vdec') {
        const x = KB.vdec(u.vdecId); if (x) add('vdec:' + u.vdecId, x.name, KIND_COLOR.vdec, 1, '解码力 ' + x.cap);
      } else if (u.kind === 'adsp') {
        const x = KB.adsp(u.adspId); if (x) add('adsp:' + u.adspId, x.name, KIND_COLOR.adsp, 1, x.cap + ' GOPS');
      } else if (u.kind === 'hsio') {
        const x = KB.hsio(u.hsioId); if (x) add('hsio:' + u.hsioId, x.name, KIND_COLOR.hsio, 1, fmt(x.per * u.w * u.h) + ' GB/s');
      } else if (u.kind === 'modem') {
        const m = KB.modem(st.modem); if (m) add('modem', m.name, KIND_COLOR.modem, 1, m.dl ? '↓' + m.dl + ' Gbps' : '');
      } else if (u.kind === 'noc') {
        add('noc', 'NoC 互连总线', KIND_COLOR.noc, 1, '');
      }
    });
    return Array.from(map.values());
  }

  function drawSharePackage(ctx, x, y, size) {
    const g = ctx.createLinearGradient(x, y, x + size, y + size);
    g.addColorStop(0, '#2b2b31'); g.addColorStop(0.5, '#3b3b44'); g.addColorStop(1, '#1c1c21');
    shareRound(ctx, x, y, size, size, 26);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 2; ctx.stroke();

    ctx.save();
    shareRound(ctx, x, y, size, size, 26); ctx.clip();
    /* 基板走线 */
    ctx.strokeStyle = 'rgba(228,190,120,.18)'; ctx.lineWidth = 1;
    for (let p = 0; p < size; p += 18) {
      ctx.beginPath(); ctx.moveTo(x + p, y); ctx.lineTo(x + p, y + size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + p); ctx.lineTo(x + size, y + p); ctx.stroke();
    }
    /* 焊球 */
    ctx.fillStyle = 'rgba(235,215,165,.9)';
    const step = 22, m = 9;
    for (let p = m; p <= size - m; p += step) {
      [[x + p, y + m], [x + p, y + size - m], [x + m, y + p], [x + size - m, y + p]].forEach(([bx, by]) => {
        ctx.beginPath(); ctx.arc(bx, by, 2.1, 0, Math.PI * 2); ctx.fill();
      });
    }
    ctx.restore();

    /* 裸片 / chiplet */
    const pad = size * 0.15, inner = size - pad * 2;
    if (dieCount() <= 1) {
      drawShareDie(ctx, x + pad, y + pad, inner, st.units.filter(u => u && u.x >= 0), st.n,
        { labels: false, radius: 8, io: false });
    } else {
      const k = dieCount();
      const gap = 8, tile = (inner - gap) / 2;
      /* 2 die 左右并排；3 die 上二下一中；4 die 2×2 */
      const spots = k === 2
        ? [[0, 0.5], [1, 0.5]]
        : k === 3
          ? [[0, 0], [1, 0], [0.5, 1]]
          : [[0, 0], [1, 0], [0, 1], [1, 1]];
      st.dies.forEach((d, i) => {
        const sp = spots[i]; if (!sp) return;
        const tx = x + pad + sp[0] * (tile + gap);
        const ty = y + pad + sp[1] * (tile + gap);
        drawShareDie(ctx, tx, ty, tile, (d.units || []).filter(u => u && u.x >= 0), st.n,
          { labels: false, radius: 5, io: false });
        ctx.font = shareFont(700, 10);
        ctx.fillStyle = 'rgba(255,255,255,.82)';
        ctx.fillText('D' + (i + 1), tx + 5, ty + 14);
      });
    }

    /* 封装文字 */
    ctx.font = shareFont(600, Math.max(13, size * 0.026));
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.textAlign = 'left';
    ctx.fillText(st.chipName.toUpperCase(), x + size * 0.07, y + size * 0.94);
    ctx.textAlign = 'right';
    ctx.font = shareFont(600, Math.max(10, size * 0.018));
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.fillText(st.brand.toUpperCase(), x + size * 0.93, y + size * 0.075);
    ctx.textAlign = 'left';
  }

  function openShare(cv, filename, hint) {
    shareCanvas = cv;
    shareName = filename;
    popup(`
      <div class="between">
        <div><h2>分享图片</h2><p class="tiny muted" style="margin-top:4px;max-width:52ch">${esc(hint || '')}</p></div>
        <button class="btn btn-icon" data-act="close-share" title="关闭">✕</button>
      </div>
      <div class="share-preview" id="sharePreview"></div>
      <div class="wrap" style="margin-top:14px">
        <button class="btn btn-primary" data-act="share-save">下载图片</button>
        <button class="btn" data-act="close-share">关闭</button>
      </div>
      <div class="tiny muted" style="margin-top:8px">手机浏览器如果没触发下载，可以长按图片保存到相册。</div>
    `);
    const box = document.getElementById('sharePreview');
    if (box) box.appendChild(cv);
  }

  function saveShareImage() {
    if (!shareCanvas) return;
    try {
      const a = document.createElement('a');
      a.download = shareName || 'arm-dynasty.png';
      a.href = shareCanvas.toDataURL('image/png');
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast('图片已开始下载');
    } catch (err) {
      toast('导出失败，请长按图片保存');
    }
  }

  /** 版图海报：放大版图 + 模块名称与数量 */
  function buildLayoutShare() {
    const units = st.units.filter(u => u && u.x >= 0);
    if (!units.length) { toast('裸片上还没有模块，先摆点东西再分享'); return; }
    const n = st.n;
    const cell = n <= 12 ? 90 : n <= 16 ? 82 : n <= 20 ? 74 : 68;
    const dieSize = cell * n;
    const legend = shareLegend(units);
    const cols = legend.length > 10 ? 2 : 1;
    const rows = Math.ceil(legend.length / cols);
    const M = 64;
    const W = Math.max(1080, dieSize + M * 2);
    const H = 236 + dieSize + 58 + 64 + rows * 42 + 104;

    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');

    ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#18181b'; ctx.fillRect(0, 0, W, 8);

    /* 标题 */
    let nameSize = 48;
    ctx.font = shareFont(700, nameSize);
    while (nameSize > 28 && ctx.measureText(st.chipName).width > W - M * 2 - 40) {
      nameSize -= 2; ctx.font = shareFont(700, nameSize);
    }
    ctx.textAlign = 'left';
    ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(600, 15);
    ctx.fillText('ARM DYNASTY · FLOORPLAN SHARE', M, 56);
    ctx.fillStyle = '#18181b'; ctx.font = shareFont(700, nameSize);
    ctx.fillText(st.chipName, M, 112);
    ctx.fillStyle = '#52525b'; ctx.font = shareFont(400, 19);
    ctx.fillText('“' + st.slogan + '”', M, 148);

    const an = E.analyze(st);
    const v = E.validate(st);
    const pills = [
      seg().name, KB.node(st.node).short,
      n + '×' + n + ' · ' + st.mm2 + 'mm²',
      '利用率 ' + (v.util * 100).toFixed(0) + '%'
    ];
    if (dieCount() > 1) pills.push('Die ' + (st.activeDie + 1) + '/' + dieCount());
    pills.push('GB6 ' + fmt(an.score.single) + ' / ' + fmt(an.score.multi));
    sharePills(ctx, pills, M, 172, W - M * 2);

    /* 版图 */
    const dx = (W - dieSize) / 2, dy = 236;
    drawShareDie(ctx, dx, dy, dieSize, units, n, { radius: 14 });

    ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(500, 13);
    ctx.textAlign = 'right';
    ctx.fillText('每格 1mm² · ' + n + '×' + n + ' 网格', W - M, dy - 12);
    ctx.textAlign = 'left';

    /* 模块清单 */
    const ly = dy + dieSize + 46;
    ctx.fillStyle = '#18181b'; ctx.font = shareFont(700, 24);
    ctx.fillText('模块清单', M, ly);
    ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(400, 15);
    ctx.fillText('共 ' + units.length + ' 个已放置单元', M + 112, ly - 1);

    const colW = cols === 2 ? (W - M * 2 - 32) / 2 : (W - M * 2);
    legend.forEach((it, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const x = M + col * (colW + 32);
      const y = ly + 34 + row * 42;
      shareRound(ctx, x, y + 3, 12, 12, 3);
      ctx.fillStyle = it.color; ctx.fill();
      let lf = 17;
      ctx.font = shareFont(600, lf);
      while (lf > 11 && ctx.measureText(it.label).width > colW - 78) {
        lf -= 1; ctx.font = shareFont(600, lf);
      }
      ctx.fillStyle = '#18181b';
      ctx.fillText(it.label, x + 22, y + 14);
      if (it.sub) {
        ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(400, 12);
        ctx.fillText(it.sub, x + 22, y + 31);
      }
      ctx.fillStyle = '#18181b'; ctx.font = shareFont(700, 17);
      ctx.textAlign = 'right';
      ctx.fillText('×' + it.count, x + colW, y + 14);
      ctx.textAlign = 'left';
    });

    /* 页脚 */
    ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(400, 13);
    ctx.fillText('重振 ARM 荣光 · v15.3 · ' + new Date().toLocaleString('zh-CN'), M, H - 34);
    ctx.textAlign = 'right';
    ctx.fillText('ARM DYNASTY', W - M, H - 34);
    ctx.textAlign = 'left';

    openShare(cv, 'arm-dynasty-layout.png', '当前 die 的完整版图 + 模块清单，已放大到模块名称可读。');
  }

  /** 成绩海报：封装芯片 + 跑分 */
  function buildResultShare() {
    const res = st.result;
    if (!res || res.crashed) { toast('先跑一次成功的分，再来分享成绩'); return; }
    const an = res.an;
    const W = 1080, H = 1320, M = 64;

    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#18181b'; ctx.fillRect(0, 0, W, 8);

    /* 评级圆环 */
    const cx = M + 92, cy = 138, rr = 78;
    const colors = ['#ff6fb0', '#ffab5c', '#f0e35c', '#6ff0bd', '#5cc8ff', '#c46bff'];
    colors.forEach((c, i) => {
      ctx.beginPath();
      ctx.arc(cx, cy, rr, -Math.PI / 2 + i * Math.PI / 3 + 0.02, -Math.PI / 2 + (i + 1) * Math.PI / 3 - 0.02);
      ctx.strokeStyle = c; ctx.lineWidth = 15; ctx.lineCap = 'round'; ctx.stroke();
    });
    ctx.beginPath(); ctx.arc(cx, cy, rr - 10, 0, Math.PI * 2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = '#18181b'; ctx.font = shareFont(700, 64);
    ctx.fillText(res.grade.grade, cx, cy + 14);
    ctx.font = shareFont(600, 12); ctx.fillStyle = '#a1a1aa';
    ctx.fillText(res.grade.title, cx, cy + 42);

    /* 标题 */
    const tx = M + 210;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(600, 14);
    ctx.fillText('ARM DYNASTY · BENCHMARK RESULT', tx, 74);
    let ns = 44;
    ctx.font = shareFont(700, ns);
    while (ns > 26 && ctx.measureText(st.chipName).width > W - tx - M) {
      ns -= 2; ctx.font = shareFont(700, ns);
    }
    ctx.fillStyle = '#18181b';
    ctx.fillText(st.chipName, tx, 124);
    ctx.fillStyle = '#52525b'; ctx.font = shareFont(400, 18);
    ctx.fillText('“' + st.slogan + '”', tx, 154);
    ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(500, 14);
    ctx.fillText([st.brand, KB.node(st.node).short,
      an.dieCount > 1 ? an.dieCount + ' die · ' + an.xdie.topoDef.name : '单片'].join('  ·  '), tx, 184);

    /* 封装 */
    const pkgSize = 600, px = (W - pkgSize) / 2, py = 240;
    drawSharePackage(ctx, px, py, pkgSize);

    /* 跑分卡片 */
    const cards = [
      ['综合分', fmt(res.sust.total), '峰值 ' + fmt(res.peak.total)],
      ['GB6 单核', fmt(res.peak.single), '持续 ' + fmt(res.sust.single)],
      ['GB6 多核', fmt(res.peak.multi), '持续 ' + fmt(res.sust.multi)],
      ['曼哈顿 3.1', fmt(res.peak.gpu), '持续 ' + fmt(res.sust.gpu) + ' fps'],
      ['AI 算力', fmt(res.peak.ai), 'SME2 ×' + an.sme],
      ['通信', String(an.modem.dl), 'Gbps 下行']
    ];
    const gx = M, gy = 880, gw = (W - M * 2 - 40) / 3, gh = 112, gap = 20;
    cards.forEach((c, i) => {
      const col = i % 3, row = Math.floor(i / 3);
      const x = gx + col * (gw + gap), y = gy + row * (gh + gap);
      ctx.fillStyle = '#fff';
      shareRound(ctx, x, y, gw, gh, 14); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(500, 13);
      ctx.fillText(c[0], x + 16, y + 26);
      ctx.fillStyle = '#18181b'; ctx.font = shareFont(700, 34);
      ctx.fillText(c[1], x + 16, y + 68);
      ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(400, 12);
      ctx.fillText(c[2], x + 16, y + 92);
    });

    /* 底部数据 */
    const stats = [
      ['峰值温度', res.peakT.toFixed(0) + ' °C'],
      ['频率保持', (res.throttle * 100).toFixed(0) + ' %'],
      ['封装良率', (an.yieldRate * 100).toFixed(1) + ' %'],
      ['单颗成本', '¥' + fmt(an.bom)]
    ];
    const sy = 1160;
    stats.forEach((s, i) => {
      const x = M + i * ((W - M * 2) / 4);
      ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(500, 13);
      ctx.fillText(s[0], x, sy);
      ctx.fillStyle = '#18181b'; ctx.font = shareFont(700, 24);
      ctx.fillText(s[1], x, sy + 32);
    });

    /* 页脚 */
    ctx.fillStyle = '#a1a1aa'; ctx.font = shareFont(400, 13);
    ctx.fillText(res.grade.remark, M, 1244);
    ctx.fillText('重振 ARM 荣光 · v15.3 · ' + new Date().toLocaleString('zh-CN'), M, 1272);
    ctx.textAlign = 'right';
    ctx.fillText('ARM DYNASTY', W - M, 1272);
    ctx.textAlign = 'left';

    openShare(cv, 'arm-dynasty-score.png', '封装芯片 + 关键跑分，适合发群 / 发朋友圈。');
  }

  /* ============================================================
     ⑤ 结果
     ============================================================ */
  function viewResult() {
    const res = st.result;
    if (!res) return viewHome();
    const an = res.an;
    /* 兼容极旧的 result 结构：没有多 die 字段时按单片补齐 */
    if (typeof an.dieCount !== 'number') {
      an.dieCount = 1;
      an.dieYield = an.yieldRate;
      an.packageYield = an.yieldRate;
      an.xdie = E.xdieInfo(st);
    }

    if (res.crashed) {
      return `
      <div class="section-head"><div><h2>翻车了</h2>
        <p>频率拉得太狠，这颗硅在测试跑到一半的时候直接挂掉了 —— 黑屏、重启、掉帧三连。</p></div></div>
      <div class="glass card">
        <h3 style="margin-bottom:11px">事故报告</h3>
        <div class="statbar">
          <div class="stat warn"><small>翻车概率</small><b>${(res.risk * 100).toFixed(0)}%</b></div>
          <div class="stat warn"><small>CPU 频率</small><b>${f2(res.rk.freq.cpu)}G</b></div>
          <div class="stat warn"><small>GPU 频率</small><b>${f2(res.rk.freq.gpu)}G</b></div>
          <div class="stat warn"><small>安全上限</small><b>${f2(res.rk.limits.cpuSafe)}G</b></div>
        </div>
        <div class="remark" style="margin-top:14px">
          体质只有 <b>${(st.quality.cpu * 100).toFixed(0)}%</b> 的硅，你让它跑到 <b>${f2(res.rk.freq.cpu)}GHz</b>。
          下次要么降频、要么加压，要么重新抽一颗体质好的。
        </div>
        <div class="wrap" style="margin-top:16px">
          <button class="btn btn-primary" data-act="back-oc">← 回去调参数</button>
          <button class="btn" data-act="reset-mania">重新抽一颗硅</button>
        </div>
      </div>`;
    }

    const peak = res.peak, sust = res.sust, grade = res.grade;
    const refs = (an.seg && an.seg.refs) ? an.seg.refs : KB.REF_CHIPS;
    const tag = E.tempTag(res.peakT);
    const remarks = E.remarks(st, an, res, st.quality);
    const value = E.valueScore(an, res);

    const maxMulti = Math.max(peak.multi, ...refs.map(r => r.gb6m)) * 1.06;
    const gpuRefs = refs.filter(r => r.gpu > 0);
    const maxGpu = Math.max(peak.gpu, ...gpuRefs.map(r => r.gpu)) * 1.06;
    const cmpMulti = refs.map(r => `<div class="cmp-row">
        <span class="nm">${r.name} <span class="tiny muted">${r.year}</span></span>
        <span class="cmp-bar"><i style="width:${r.gb6m / maxMulti * 100}%"></i></span>
        <span class="vl mono">${fmt(r.gb6m)}</span></div>`).join('');
    const cmpGpu = gpuRefs.map(r => `<div class="cmp-row">
        <span class="nm">${r.name}</span>
        <span class="cmp-bar"><i style="width:${r.gpu / maxGpu * 100}%"></i></span>
        <span class="vl mono">${fmt(r.gpu)}</span></div>`).join('');
    const multiSummary = an.dieCount > 1 ? `<div class="glass card" style="margin-top:16px">
      <div class="between" style="margin-bottom:10px"><h3>多 Die 拼接</h3><span class="badge">${an.dieCount} die · ${an.xdie.topoDef.name}</span></div>
      <div class="xdie-stat"><span class="muted">基础 die</span><b>${an.dieCount} × ${st.mm2}mm² = ${an.areaTotal}mm²</b></div>
      <div class="xdie-stat"><span class="muted">单 die 良率 / 封装良率</span><b>${(an.dieYield * 100).toFixed(1)}% / ${(an.packageYield * 100).toFixed(1)}%</b></div>
      <div class="xdie-stat"><span class="muted">互连质量 Q</span><b>${(an.xdie.Q * 100).toFixed(0)}%</b></div>
      <div class="xdie-stat"><span class="muted">多核 / GPU 跨 die 效率</span><b>${(an.xdie.xdieCpu * 100).toFixed(0)}% / ${(an.xdie.xdieGpu * 100).toFixed(0)}%</b></div>
      <div class="xdie-stat"><span class="muted">互连方案</span><b>${an.xdie.links.map(l => 'D' + (l.key.split('-')[0] * 1 + 1) + '↔D' + (l.key.split('-')[1] * 1 + 1) + ' ' + l.short).join(' · ') || '—'}</b></div>
      <div class="tiny muted" style="margin-top:8px;line-height:1.7">跨 die 的多核 / GPU / AI / 光追都按 Q 折损；媒体与本地内存不吃互连折损。想拉高 Q：换更密的互连，或用环形 / 网格 / 全连接拓扑。</div>
    </div>` : '';

    return `
    <div class="result-hero">
      <div class="grade-ring"><div class="inner"><div class="g">${grade.grade}</div><div class="rn">${grade.title}</div></div></div>
      <div>
        <span class="badge">${esc(st.brand)} · ${KB.node(st.node).short}</span>
        <h1 style="font-size:clamp(24px,3vw,36px);margin:12px 0 5px">${esc(st.chipName)}</h1>
        <p class="muted" style="font-size:13px">“${esc(st.slogan)}”</p>
        <div class="score-cards" style="margin-top:18px">
          <div class="score-card"><small>鲸兔兔 v10 综合</small><b>${fmt(sust.total)}</b><div class="sust">峰值 ${fmt(peak.total)}</div></div>
          <div class="score-card"><small>GB6 单核</small><b>${fmt(peak.single)}</b><div class="sust">持续 ${fmt(sust.single)}</div></div>
          <div class="score-card"><small>GB6 多核</small><b>${fmt(peak.multi)}</b><div class="sust">持续 ${fmt(sust.multi)}</div></div>
          <div class="score-card"><small>曼哈顿 3.1</small><b>${fmt(peak.gpu)}</b><div class="sust">持续 ${fmt(sust.gpu)} fps</div></div>
          <div class="score-card"><small>AI 算力</small><b>${fmt(peak.ai)}</b><div class="sust">SME2 ×${an.sme}</div></div>
          <div class="score-card"><small>媒体引擎</small><b>${fmt(peak.media || 0)}</b><div class="sust">ISP + 编解码 + 音频</div></div>
          <div class="score-card"><small>通信</small><b>${an.modem.dl}</b><div class="sust">Gbps 下行</div></div>
        </div>
      </div>
    </div>
    ${multiSummary}
    <div class="stack" style="margin-top:26px">
      <div class="glass card">
        <div class="section-head" style="margin-bottom:12px">
          <div><h2>成绩单</h2><p>${grade.remark}</p></div>
          <span class="badge ${res.peakT > 88 ? 'r' : 'g'}">${tag.t} · 峰值 ${res.peakT.toFixed(0)}°C</span>
        </div>
        <div class="statbar">
          <div class="stat"><small>峰值功耗</small><b>${f1(res.peakP)}W</b></div>
          <div class="stat"><small>持续功耗</small><b>${f1(res.sustP)}W</b></div>
          <div class="stat"><small>持续温度</small><b>${res.sustT.toFixed(0)}°C</b></div>
          <div class="stat"><small>频率保持率</small><b>${(res.throttle * 100).toFixed(0)}%</b></div>
          <div class="stat"><small>单颗成本</small><b>¥${fmt(an.bom)}</b></div>
          <div class="stat"><small>性价比</small><b>${fmt(value)}</b></div>
          ${an.dieCount > 1 ? `<div class="stat"><small>Die 数</small><b>${an.dieCount}</b></div>
          <div class="stat"><small>互连质量</small><b>${(an.xdie.Q * 100).toFixed(0)}%</b></div>` : ''}
        </div>
        <canvas class="chart" id="chart2" style="margin-top:16px"></canvas>
      </div>
      <div class="glass card">
        <h3 style="margin-bottom:14px">Geekbench 6 多核 · 与历代旗舰对比</h3>
        <div class="cmp">
          <div class="cmp-row me"><span class="nm">${esc(st.chipName)}</span>
            <span class="cmp-bar"><i style="width:${peak.multi / maxMulti * 100}%"></i></span>
            <span class="vl mono">${fmt(peak.multi)}</span></div>
          ${cmpMulti}
        </div>
        <div class="hr"></div>
        ${gpuRefs.length ? `<h3 style="margin-bottom:14px">GFXBench 曼哈顿 3.1（fps）</h3>
        <div class="cmp">
          <div class="cmp-row me"><span class="nm">${esc(st.chipName)}</span>
            <span class="cmp-bar"><i style="width:${peak.gpu / maxGpu * 100}%"></i></span>
            <span class="vl mono">${fmt(peak.gpu)}</span></div>
          ${cmpGpu}
        </div>` : `<div class="tiny muted">本版型的参考机型均无集成 GPU，略过图形对比。</div>`}
      </div>
      <div class="glass card">
        <h3 style="margin-bottom:11px">架构师点评</h3>
        ${remarks.length
          ? '<div class="stack" style="gap:7px">' + remarks.map(r => `<div class="remark">${r}</div>`).join('') + '</div>'
          : '<div class="remark">这颗芯片没毛病，规格均衡、散热到位 —— 教科书级别的设计。</div>'}
        <div class="hr"></div>
        <div class="statbar">
          <div class="stat"><small>版图利用率</small><b>${(an.util * 100).toFixed(0)}%</b></div>
          <div class="stat"><small>${an.dieCount > 1 ? '封装良率' : '良率'}</small><b>${(an.yieldRate * 100).toFixed(1)}%</b></div>
          <div class="stat"><small>散热方案</small><b style="font-size:12.5px">${an.cooling.name}</b></div>
          <div class="stat"><small>每片晶圆出片${an.dieCount > 1 ? '（单 die）' : ''}</small><b>${an.perWafer} 颗</b></div>
        </div>
        <div class="wrap" style="margin-top:16px">
          <button class="btn" data-act="back-oc">← 重新超频</button>
          <button class="btn" data-act="back-layout">改版图</button>
          <button class="btn" data-act="share-result">分享成绩</button>
          <button class="btn" data-act="copy-review">复制发布会文案</button>
          <button class="btn btn-primary" data-act="new">设计下一颗 →</button>
        </div>
      </div>
    </div>`;
  }

  /* ============================================================
     渲染
     ============================================================ */
  const VIEWS = { home: viewHome, setup: viewSetup, layout: viewLayout, pack: viewPack, oc: viewOC, bench: viewBench, result: viewResult };

  function render() {
    try {
      const stage = $('#stage');
      stage.innerHTML = (VIEWS[st.screen] || viewHome)();
      /* 立刻结算一次布局，避免新 DOM 在合成器上先空一帧再填充（看起来就是闪一下） */
      void stage.offsetHeight;
      renderSteps();
      if (st.screen === 'result' && st.result && !st.result.crashed) {
        const cv = $('#chart2');
        if (cv) setTimeout(() => drawChart(cv, st.result.series, st.result.series.length), 50);
      }
      if (st.screen === 'layout' && st.overview) setTimeout(drawOverviewLinks, 40);
      document.documentElement.dataset.screen = st.screen;
      Adaptive.schedule();
    } catch (err) {
      // 任何渲染异常都不能只留一个白屏；同时记下真正的错误，供 init / 诊断层使用
      window.__lastRenderError = err;
      const b = document.getElementById('boot');
      if (b) { b.removeAttribute('data-done'); b.style.display = ''; }
      if (window.__bootFail) window.__bootFail('渲染出错：<br>' + (err && err.message ? err.message : err) +
        '<br><span style="opacity:.7">屏幕：' + st.screen + '</span>');
      else throw err;
    }
  }

  function go(screen) {
    if ((screen === 'pack' || screen === 'oc') && !E.validateAll(st).ok) {
      const v = E.validateAll(st);
      toast('版图还有 ' + v.problems.length + ' 处问题需要先解决');
      return;
    }
    st.screen = screen;
    const step = STEPS.find(s => s.id === screen);
    if (step) st.maxStep = Math.max(st.maxStep, step.n);
    if (screen === 'layout') {
      E.syncAllUnits(st); E.autoPlaceAll(st, false);
      const pb = st.units.find(u => u.uid === st.pending);
      if (pb && pb.x >= 0) st.pending = null;
    }
    save(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ============================================================
     交互
     ============================================================ */
  let drag = null, lpTimer = 0, suppressTapUntil = 0;
  const LP_MS = 380, LP_SLOP = 9;      // 长按判定：380ms，手指移动超过 9px 视为滑动
  const dieEl = () => document.getElementById('die');
  function setDieArming(on) { const d = dieEl(); if (d) d.classList.toggle('arming', !!on); }

  function dieMetrics() {
    const die = $('#die'); if (!die) return null;
    const r = die.getBoundingClientRect();
    return { r, cw: r.width / st.n, ch: r.height / st.n };
  }
  function showPreview(x, y, w, h, ok) {
    const p = $('#prev'); if (!p) return;
    p.style.display = 'block';
    p.style.left = x / st.n * 100 + '%'; p.style.top = y / st.n * 100 + '%';
    p.style.width = w / st.n * 100 + '%'; p.style.height = h / st.n * 100 + '%';
    p.className = 'drop-preview ' + (ok ? 'ok' : 'bad');
  }
  function hidePreview() { const p = $('#prev'); if (p) p.style.display = 'none'; }

  /* 拖出删除提示 */
  function setDelHint(on, hot, txt) {
    const el = $('#delhint'); if (!el) return;
    el.classList.toggle('on', !!on);
    el.classList.toggle('hot', !!hot);
    const t = $('#delhint-txt');
    if (txt && t) t.textContent = txt;
  }
  const OUT_MARGIN = 26;      // 离开裸片边缘多少像素算「拖出」
  /** 长按空白处触发：把等待态升级为框选，先在按下的那一格显示起始框 */
  function activateLongPress() {
    if (!drag || drag.mode !== 'lp') return;
    const d = drag;
    drag = {
      mode: 'rect', longPress: true, moved: true,
      startX: d.startX, startY: d.startY, gx0: d.gx0, gy0: d.gy0,
      rect: { x: d.gx0, y: d.gy0, w: 0, h: 0 }
    };
    setDieArming(false);
    suppressTapUntil = Date.now() + 700;   // 长按之后的那次 click 不算点击
    const box = $('#selbox');
    if (box) {
      box.style.display = 'block';
      box.className = 'sel-box empty';
      box.style.left = d.gx0 / st.n * 100 + '%';
      box.style.top = d.gy0 / st.n * 100 + '%';
      box.style.width = 1 / st.n * 100 + '%';
      box.style.height = 1 / st.n * 100 + '%';
    }
    toast('已进入选区：拖动圈住模块，松手后可合并 / 复制 / 删除', 1800);
  }

  function onDown(e) {
    if (st.screen !== 'layout' || st.overview) return;

    /* 待放置托盘 → 拖入 */
    const tile = e.target.closest('.tray-chip');
    if (tile) {
      const u = st.units.find(x => x.uid === tile.dataset.uid);
      if (!u) return;
      e.preventDefault();
      resetFit(u);                       // 上次是自适应尺寸 → 回到默认
      drag = { mode: 'place', uid: u.uid, w: u.w, h: u.h, bw: u.w, bh: u.h,
               startX: e.clientX, startY: e.clientY, moved: false, entered: false };
      st.selected = u.uid;
      return;
    }

    const blk = e.target.closest('.blk');
    if (!blk) {
      /* 空白处：鼠标按住拖动 = 框选；触屏长按 = 进入框选 */
      const m0 = dieMetrics();
      if (!m0 || !e.target.closest('#die')) return;
      const gx0 = clamp(Math.round((e.clientX - m0.r.left) / m0.cw), 0, st.n);
      const gy0 = clamp(Math.round((e.clientY - m0.r.top) / m0.ch), 0, st.n);

      if (e.pointerType && e.pointerType !== 'mouse') {
        /* 触屏：先不拦截默认行为，轻扫仍可滚动页面；长按才接管 */
        clearTimeout(lpTimer);
        setDieArming(true);
        drag = { mode: 'lp', startX: e.clientX, startY: e.clientY, gx0, gy0 };
        lpTimer = setTimeout(activateLongPress, LP_MS);
        return;
      }

      e.preventDefault();
      drag = {
        mode: 'rect', moved: false, startX: e.clientX, startY: e.clientY,
        gx0, gy0
      };
      return;
    }
    const uidv = blk.dataset.uid;
    const u = st.units.find(x => x.uid === uidv);
    const m = dieMetrics();
    if (!u || !m) return;

    /* Shift / Ctrl + 点击 → GPU 多选合并 */
    if (e.shiftKey || e.ctrlKey || e.metaKey) {
      e.preventDefault();
      if (u.kind !== 'gpu') { toast('目前只支持合并 GPU 核心'); return; }
      if (u.x < 0) { toast('先把它放上裸片才能合并'); return; }
      const i = st.multi.indexOf(uidv);
      if (i >= 0) st.multi.splice(i, 1); else st.multi.push(uidv);
      st.selected = uidv;
      save(); render();
      return;
    }
    e.preventDefault();
    st.selected = uidv;

    if (e.target.closest('.rz') && u.kind !== 'cpu') {   /* 缩放（CPU 面积固定，没有把手） */
      drag = { mode: 'resize', uid: uidv, w0: u.w, h0: u.h, moved: false, entered: true,
               startX: e.clientX, startY: e.clientY };
      return;
    }
    /* 选区整体移动：拖选区内任意模块 = 把整块选区搬走（按住 Alt 则只拖这一块） */
    if (!e.altKey && st.selRect) {
      const rlist = E.unitsInRect(st, st.selRect);
      if (rlist.length > 1 && rlist.some(x => x.uid === uidv)) {
        drag = {
          mode: 'rmove', moved: false, entered: true,
          startX: e.clientX, startY: e.clientY,
          gx0: (e.clientX - m.r.left) / m.cw, gy0: (e.clientY - m.r.top) / m.ch,
          items: rlist.map(x => ({ uid: x.uid, x0: x.x, y0: x.y })),
          rect0: { x: st.selRect.x, y: st.selRect.y, w: st.selRect.w, h: st.selRect.h },
          dx: 0, dy: 0, ok: true
        };
        return;
      }
    }
    /* 移动：上一次是自适应尺寸的话，先回到物理默认，再由拖动重新适配 */
    if (u.autoFit) {
      resetFit(u);
      blk.style.width = u.w / st.n * 100 + '%';
      blk.style.height = u.h / st.n * 100 + '%';
      toast('已恢复默认尺寸 ' + u.w + '×' + u.h + ' —— 空位不够时会自动变形');
    }
    /* 移动 */
    drag = {
      mode: 'move', uid: uidv, w: u.w, h: u.h, bw: u.w, bh: u.h,
      grabCX: (e.clientX - m.r.left) / m.cw - u.x,
      grabCY: (e.clientY - m.r.top) / m.ch - u.y,
      startX: e.clientX, startY: e.clientY, moved: false, entered: true
    };
    blk.classList.add('dragging');
  }

  function onMove(e) {
    if (st.screen !== 'layout' || st.overview) return;
    const m = dieMetrics(); if (!m) return;

    if (drag) {
      /* 长按等待中：手指一动就取消，把滚动/点击还给页面 */
      if (drag.mode === 'lp') {
        if (Math.abs(e.clientX - drag.startX) > LP_SLOP || Math.abs(e.clientY - drag.startY) > LP_SLOP) {
          clearTimeout(lpTimer);
          setDieArming(false);
          drag = null;
        }
        return;
      }
      if (!drag.moved && (Math.abs(e.clientX - drag.startX) > 5 || Math.abs(e.clientY - drag.startY) > 5)) {
        drag.moved = true;
        if (drag.mode === 'move') setDelHint(true, false, '拖出裸片即删除该模块');
      }
      if (!drag.moved) return;

      /* —— 框选 —— */
      if (drag.mode === 'rect') {
        hidePreview();
        const gx = clamp(Math.round((e.clientX - m.r.left) / m.cw), 0, st.n);
        const gy = clamp(Math.round((e.clientY - m.r.top) / m.ch), 0, st.n);
        const r = { x: Math.min(drag.gx0, gx), y: Math.min(drag.gy0, gy),
                    w: Math.abs(gx - drag.gx0), h: Math.abs(gy - drag.gy0) };
        drag.rect = r;
        const box = $('#selbox');
        if (box) {
          box.style.display = 'block';
          box.style.left = r.x / st.n * 100 + '%'; box.style.top = r.y / st.n * 100 + '%';
          box.style.width = r.w / st.n * 100 + '%'; box.style.height = r.h / st.n * 100 + '%';
          /* 框里没模块 → 底色全透明，只看得到虚线 */
          box.classList.toggle('empty', !E.unitsInRect(st, r).length);
        }
        return;
      }

      if (drag.mode === 'rmove') {
        /* 数据不动，只实时挪 DOM；松手才真正落位 */
        const gc = (e.clientX - m.r.left) / m.cw, gr = (e.clientY - m.r.top) / m.ch;
        const dx = Math.round(gc - drag.gx0), dy = Math.round(gr - drag.gy0);
        const list = [];
        drag.items.forEach(it => { const u = st.units.find(x => x.uid === it.uid); if (u) list.push(u); });
        drag.dx = dx; drag.dy = dy;
        drag.ok = E.regionFits(st, list, dx, dy);
        drag.items.forEach(it => {
          const el = document.querySelector(`.blk[data-uid="${it.uid}"]`);
          if (!el) return;
          el.style.left = (it.x0 + dx) / st.n * 100 + '%';
          el.style.top = (it.y0 + dy) / st.n * 100 + '%';
        });
        const box = $('#selbox');
        if (box) {
          box.style.display = 'block';
          box.style.left = (drag.rect0.x + dx) / st.n * 100 + '%';
          box.style.top = (drag.rect0.y + dy) / st.n * 100 + '%';
          box.classList.remove('empty');
          box.classList.toggle('bad', !drag.ok);
        }
        setDelHint(false);
        return;
      }

      if (drag.mode === 'resize') {
        const u = st.units.find(x => x.uid === drag.uid);
        if (!u || u.kind === 'cpu') return;     // CPU 面积固定，不参与缩放
        let w = Math.round((e.clientX - m.r.left) / m.cw) - u.x;
        let h = Math.round((e.clientY - m.r.top) / m.ch) - u.y;
        u.w = clamp(w, 1, st.n - u.x);
        u.h = clamp(h, 1, st.n - u.y);
        const el = document.querySelector(`.blk[data-uid="${drag.uid}"]`);
        if (el) {
          el.style.width = u.w / st.n * 100 + '%';
          el.style.height = u.h / st.n * 100 + '%';
          el.classList.toggle('bad', u.w * u.h < E.minCells(u, st) || !E.canPlace(st, u.uid, u.x, u.y, u.w, u.h));
        }
        return;
      }

      /* —— 拖出裸片即删除 —— */
      const inside = e.clientX > m.r.left - OUT_MARGIN && e.clientX < m.r.right + OUT_MARGIN &&
                     e.clientY > m.r.top - OUT_MARGIN && e.clientY < m.r.bottom + OUT_MARGIN;
      if (inside) drag.entered = true;
      // move：从裸片里拖出去才算「删除」；place：本来就是从外面拿进来的，没落到裸片上就算「取消」
      const out = drag.mode === 'place' ? !inside : (drag.entered && !inside);
      if (drag.out !== out) {
        drag.out = out;
        if (drag.mode === 'move') setDelHint(true, out, out ? '松开即删除' : '拖出裸片即删除该模块');
      }
      if (out) { hidePreview(); return; }

      const gc = (e.clientX - m.r.left) / m.cw, gr = (e.clientY - m.r.top) / m.ch;
      let w = drag.bw, h = drag.bh;
      let x = clamp(Math.round(gc - (drag.mode === 'place' ? w / 2 : drag.grabCX)), 0, st.n - w);
      let y = clamp(Math.round(gr - (drag.mode === 'place' ? h / 2 : drag.grabCY)), 0, st.n - h);
      let ok = E.canPlace(st, drag.uid, x, y, w, h);
      let fit = false;
      if (!ok) {
        /* 原尺寸塞不下 → 换一个形状试试 */
        const fs = E.fitShape(st, drag.uid, gc - w / 2, gr - h / 2, w, h);
        if (fs) { x = fs.x; y = fs.y; w = fs.w; h = fs.h; ok = true; fit = true; }
      }
      drag.x = x; drag.y = y; drag.w = w; drag.h = h; drag.ok = ok; drag.fit = fit;
      showPreview(x, y, w, h, ok);
      return;
    }
  }

  /* 自适应过的尺寸 → 回到物理默认（脱手即忘） */
  function resetFit(u) {
    if (!u || !u.autoFit) return false;
    if (u.kind === 'hsio') {
      const h = KB.hsio(u.hsioId);              // 高速连接回到数据里的默认长宽
      if (h) { u.w = h.w; u.h = h.h; }
      else { const fp = E.unitFootprint(u, st); u.w = fp.w; u.h = fp.h; }
    } else {
      const fp = E.unitFootprint(u, st);
      u.w = fp.w; u.h = fp.h;
    }
    u.autoFit = false;
    return true;
  }

  /** 位置变了以后只刷新「距 SLC」那一行，避免整页重绘 */
  function updateLocTag(u) {
    const el = document.querySelector('[data-loc]');
    if (!el || !u || u.kind !== 'cpu') return;
    const t = locTag(u);
    if (!t) { el.style.display = 'none'; return; }
    el.style.display = '';
    el.textContent = t;
    el.style.color = E.locality(u, st) > 1.06 ? 'var(--ok)' : 'var(--ink-3)';
  }

  /** 放置完成后的就地更新：只动必要节点，避免整页重建导致玻璃层闪一下 */
  function patchAfterPlace(u) {
    const die = dieEl();
    if (!die) return false;
    let el = die.querySelector(`.blk[data-uid="${u.uid}"]`);
    if (!el) {
      const box = document.createElement('div');
      box.innerHTML = blockHTML(u);
      el = box.firstElementChild;
      if (!el) return false;
      const sb = document.getElementById('selbox');
      if (sb) die.insertBefore(el, sb); else die.appendChild(el);
    } else {
      el.style.left = u.x / st.n * 100 + '%';
      el.style.top = u.y / st.n * 100 + '%';
      el.style.width = u.w / st.n * 100 + '%';
      el.style.height = u.h / st.n * 100 + '%';
    }

    /* 托盘：移除这一枚，顺手把高亮交给下一个待放置 */
    const chip = document.querySelector(`.tray-chip[data-uid="${u.uid}"]`);
    if (chip) chip.remove();
    const tray = document.querySelector('[data-tray]');
    if (tray && !tray.querySelector('.tray-chip'))
      tray.innerHTML = '<span class="tiny muted">全部已放置 · 拖拽方块可移动，拖右下角可缩放</span>';
    document.querySelectorAll('.tray-chip.sel').forEach(c => c.classList.remove('sel'));
    if (st.pending) {
      const pc = document.querySelector(`.tray-chip[data-uid="${st.pending}"]`);
      if (pc) pc.classList.add('sel');
    }
    const tc = document.querySelector('[data-tray-count]');
    if (tc) tc.textContent = st.units.filter(x => x.x < 0).length + ' 个';

    const stEl = document.querySelector('[data-selstate]');
    if (stEl) stEl.textContent = '已放置';
    const badges = document.querySelector('[data-badges]');
    if (badges) badges.innerHTML = layoutBadgesHTML(E.validateAll(st));

    liveStats();          // 重算参数条并保存
    Adaptive.fitDieLabels();
    return true;
  }

  function onUp(e) {
    clearTimeout(lpTimer);
    setDieArming(false);
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved) {
      st.pendingXY = null;                 // 拖完就清，否则接下来的 click 会把待放置模块误放
      suppressTapUntil = Date.now() + 700; // 浏览器在 pointerup 后还会补一个 click：
                                           // 不拦的话它会立刻把下一个待放置模块丢到落点上，
                                           // 表现为“一闪又多出一块”
      if (e.cancelable) e.preventDefault(); // 触屏上再堵一层：别让浏览器补发合成 click
    }
    hidePreview();
    setDelHint(false);
    const el = document.querySelector('.blk.dragging'); if (el) el.classList.remove('dragging');

    /* 长按还没到时间就松手：就是一次普通点击（仍可用于放置待放置模块） */
    if (d.mode === 'lp') return;

    /* —— 框选结束 —— */
    if (d.mode === 'rect') {
      if (d.moved && d.rect && d.rect.w > 0 && d.rect.h > 0) {
        const list = E.unitsInRect(st, d.rect);
        st.selRect = list.length ? d.rect : null;
        st.selected = null; st.multi = [];
        const gpuN = list.filter(u => u.kind === 'gpu').length;
        suppressTapUntil = Date.now() + 500;
        toast(list.length
          ? '已框选 ' + list.length + ' 个模块' + (gpuN >= 2 ? '（含 ' + gpuN + ' 块 GPU，可合并）' : '')
          : '这块区域里没有模块');
        /* 手机上选区面板在裸片下方，自动带用户过去操作 */
        if (list.length && window.innerWidth <= 1080) {
          setTimeout(() => {
            const g = document.querySelector('.insp .group');
            if (g) g.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 80);
        }
      } else if (d.longPress) {
        render(); return;                 // 长按后没拖动：保留原选区
      } else {
        st.selRect = null; st.selected = null; st.multi = [];
      }
      save(); render(); return;
    }

    /* —— 选区整体移动落地 —— */
    if (d.mode === 'rmove') {
      if (d.moved && d.ok && (d.dx || d.dy)) {
        d.items.forEach(it => {
          const u = st.units.find(x => x.uid === it.uid);
          if (u) { u.x = it.x0 + d.dx; u.y = it.y0 + d.dy; }
        });
        st.selRect = {
          x: clamp(d.rect0.x + d.dx, 0, Math.max(0, st.n - d.rect0.w)),
          y: clamp(d.rect0.y + d.dy, 0, Math.max(0, st.n - d.rect0.h)),
          w: d.rect0.w, h: d.rect0.h
        };
        save(); render();
        toast('已整体搬走 ' + d.items.length + ' 个模块（相对排版不变）');
      } else {
        save(); render();
        if (d.moved && !d.ok) toast('那里放不下整块选区，已退回原位');
      }
      return;
    }

    const u = st.units.find(x => x.uid === d.uid);
    if (!u) { render(); return; }

    if (!d.moved) {                       /* 点击：待放置 / 选中 */
      if (d.mode === 'place') { st.pending = u.uid; toast('点一下裸片上的空位放下它'); }
      save(); render(); return;
    }

    /* —— 拖出了裸片 —— */
    if (d.out) {
      if (d.mode === 'move') {
        st.units = st.units.filter(x => x.uid !== u.uid);
        if (st.selected === u.uid) st.selected = null;
        if (st.pending === u.uid) st.pending = null;
        save(); render();
        toast('已删除 ' + unitLabel(u) + '，面积释放 ' + u.w * u.h + 'mm²');
      } else {
        save(); render();
        toast('已取消放置，它还在待放置区');
      }
      return;
    }

    if (d.mode === 'resize') {
      u.autoFit = false;
      if (u.w * u.h < E.minCells(u, st)) {
        const fp = E.unitFootprint(u, st); u.w = fp.w; u.h = fp.h;
        toast('不能再小了，物理面积兜不住');
      } else if (!E.canPlace(st, u.uid, u.x, u.y, u.w, u.h)) {
        u.w = d.w0; u.h = d.h0;
        toast('这里放不下这么大的块');
      } else if (u.kind === 'cpu' || u.kind === 'gpu') {
        const extra = u.w * u.h - E.minCells(u, st);
        toast('尺寸改为 ' + u.w + '×' + u.h + (extra > 0 ? ' → 缓存加成 +' + Math.min(10, extra * 2) + '%' : ' → 已达物理下限'));
      }
      save(); render(); return;
    }

    if (d.ok) {
      u.x = d.x; u.y = d.y;
      const fitted = d.fit && (d.w !== d.bw || d.h !== d.bh);
      if (fitted) { u.w = d.w; u.h = d.h; u.autoFit = true; }
      const extra = u.w * u.h - E.minCells(u, st);
      if (d.mode === 'place') {
        const rest = st.units.find(x => x.x < 0 && x.uid !== u.uid);
        st.pending = rest ? rest.uid : null;
        st.pendingXY = null;
        toast(fitted ? '空位塞不下默认尺寸，已自适应成 ' + d.w + '×' + d.h + ' 放入'
          : rest ? '放好了，还剩 ' + st.units.filter(x => x.x < 0).length + ' 个' : '放置完成');
        /* 没有变形时做局部插入，避免整页重建把玻璃层闪一下 */
        if (!fitted && patchAfterPlace(u)) return;
      } else if (fitted) {
        toast('已自适应成 ' + d.w + '×' + d.h + ' 塞进空位 —— 拖出去就恢复默认尺寸');
      } else if ((u.kind === 'cpu' || u.kind === 'gpu') && extra > 0) {
        toast('余量 ' + extra + ' 格 → 缓存加成 +' + Math.min(10, extra * 2) + '%');
      }

      /* 纯移动：直接改这一块的位置 + 刷新参数条，不重绘整页（玻璃层重建会闪） */
      if (d.mode === 'move' && !fitted) {
        const el = document.querySelector(`.blk[data-uid="${u.uid}"]`);
        if (el) {
          el.style.left = u.x / st.n * 100 + '%';
          el.style.top = u.y / st.n * 100 + '%';
          el.classList.remove('dragging');
          updateLocTag(u);
          liveStats();          // 内部已 save()
          return;
        }
      }
    } else toast('这里放不下，换个位置');
    save(); render();
  }

  /* ---------------- 点击事件 ---------------- */
  function onUp2(e) {
    const t = e.target;

    /* 多 die：顶部选择栏 / 总览里的 die 卡片 / 设置页的 die 数 */
    const dieTab = t.closest('[data-die]');
    if (dieTab) {
      const v = dieTab.dataset.die;
      if (v === 'overview') {
        st.overview = true;
        st.selected = null; st.pending = null; st.multi = []; st.selRect = null;
        save(); render();
      } else setActiveDie(+v);
      return;
    }
    const ovDie = t.closest('[data-ovdie]');
    if (ovDie) { setActiveDie(+ovDie.dataset.ovdie); return; }
    const dc = t.closest('[data-diecount]');
    if (dc) { setDieCount(+dc.dataset.diecount); return; }

    const goEl = t.closest('[data-go]');
    if (goEl) { go(goEl.dataset.go); return; }

    const pick = t.closest('[data-pick]');
    if (pick) {
      const [kind, id] = pick.dataset.pick.split(':');
      addUnits(kind, id, (kind === 'cpu' || kind === 'gpu') ? pickCount : 1);
      return;
    }

    const mm = t.closest('[data-mm2]');
    if (mm) {
      st.mm2 = +mm.dataset.mm2;
      st.n = seg().areas.find(a => a.mm2 === st.mm2).n;
      st.dies.forEach(d => {
        d.n = st.n; d.mm2 = st.mm2;
        (d.units || []).forEach(u => { u.x = -1; u.y = -1; });
      });
      st.selRect = null; st.selected = null; st.multi = [];
      E.syncAllUnits(st); E.autoPlaceAll(st, false); bindActive(st);
      save(); render(); return;
    }

    const sc = t.closest('[data-seg]');
    if (sc && sc.dataset.seg !== st.seg) {
      applySegment(sc.dataset.seg);
      save(); render();
      toast('已切换到「' + seg().name + '」，上一版的选择与版图已清空');
      return;
    }
    const nd = t.closest('[data-node]');
    if (nd) { st.node = nd.dataset.node; E.syncAllUnits(st); E.autoPlaceAll(st, true); save(); render(); return; }
    const cool = t.closest('[data-cool]');
    if (cool) { st.cooling = cool.dataset.cool; save(); render(); return; }

    const act = t.closest('[data-act]');
    if (!act) {
      /* 点裸片空白处放置 pending：以点击位置为中心 */
      if (Date.now() < suppressTapUntil) return;   // 长按/框选后的残留 click
      if (st.screen === 'layout' && st.pending && t.closest('#die') && !t.closest('.blk')) {
        const u = st.units.find(x => x.uid === st.pending);
        const m = dieMetrics();
        if (u && m) {
          const x = clamp(Math.round((e.clientX - m.r.left) / m.cw - u.w / 2), 0, st.n - u.w);
          const y = clamp(Math.round((e.clientY - m.r.top) / m.ch - u.h / 2), 0, st.n - u.h);
          if (E.canPlace(st, u.uid, x, y, u.w, u.h)) {
            u.x = x; u.y = y;
            const rest = st.units.find(z => z.x < 0 && z.uid !== u.uid);
            st.pending = rest ? rest.uid : null;
            st.pendingXY = null;
            save(); render();
            toast(rest ? '放好了，还剩 ' + st.units.filter(z => z.x < 0).length + ' 个' : '放置完成');
          } else toast('这里放不下');
        }
      }
      return;
    }
    const a = act.dataset.act;

    switch (a) {
      case 'new':
        newChip(); save(); render();
        toast('新芯片：版图已清空，先选版型与面积'); break;
      case 'help': showHelp(); break;
      case 'to-layout': go('layout'); break;
      case 'back-layout': go('layout'); break;
      case 'to-pack': go('pack'); break;
      case 'to-oc': go('oc'); break;
      case 'back-oc': go('oc'); break;
      case 'autoplace': E.autoPlace(st, false); save(); render(); toast('已自动布局'); break;
      case 'auto-place-all': E.syncAllUnits(st); E.autoPlaceAll(st, false); save(); render(); toast('已自动布局全部 die'); break;
      case 'add-cpu': showPicker('cpu'); break;
      case 'add-gpu': showPicker('gpu'); break;
      case 'add-mem': showPicker('mem'); break;
      case 'add-npu': showPicker('npu'); break;
      case 'add-slc': showPicker('slc'); break;
      case 'add-isp': showPicker('isp'); break;
      case 'add-vdec': showPicker('vdec'); break;
      case 'add-adsp': showPicker('adsp'); break;
      case 'add-hsio': showPicker('hsio'); break;
      case 'del-kind': {
        st.units = st.units.filter(u => !(u.kind === act.dataset.kind && String(u[act.dataset.key]) === String(act.dataset.id)));
        save(); render(); break;
      }
      case 'pick+': pickCount = clamp(pickCount + 1, 1, 8); $('#pick-count').textContent = pickCount; break;
      case 'pick-': pickCount = clamp(pickCount - 1, 1, 8); $('#pick-count').textContent = pickCount; break;
      case 'del-core': st.units = st.units.filter(u => !(u.kind === 'cpu' && u.coreId === act.dataset.id)); save(); render(); break;
      case 'del-gpu': st.units = st.units.filter(u => !(u.kind === 'gpu' && u.archId === act.dataset.id)); save(); render(); break;
      case 'del-sel': if (st.selected) st.units = st.units.filter(u => u.uid !== st.selected); st.selected = null; save(); render(); break;
      case 'w+': case 'w-': case 'h+': case 'h-': {
        const u = st.units.find(x => x.uid === st.selected); if (!u) break;
        if (u.kind === 'cpu') { toast('CPU 核心面积固定，只能横竖对调（按 R）'); break; }
        const p = a[0], dir = a[1] === '+' ? 1 : -1;
        u.autoFit = false;
        const ow = u.w, oh = u.h;
        u[p] = clamp(u[p] + dir, 1, st.n);
        if (u.w * u.h < E.minCells(u, st)) {
          u.w = ow; u.h = oh;
          toast('已到物理面积下限（' + E.minCells(u, st) + ' 格）');
        } else if (u.x >= 0 && !E.canPlace(st, u.uid, u.x, u.y, u.w, u.h)) {
          u.x = -1; u.y = -1;
          E.autoPlace(st, true);
          toast('放不下了，已重新安排位置');
        }
        save(); render(); break;
      }
      case 'run-bench': runBench(); break;
      case 'rot': rotateSel(); break;
      case 'mb+': case 'mb-': {
        const u = st.units.find(x => x.uid === st.selected);
        if (!u || u.kind !== 'slc') break;
        u.mb = clamp((u.mb || 1) + (a === 'mb+' ? 1 : -1), 1, 32);
        E.ensureSizes(st);
        if (u.x >= 0 && !E.canPlace(st, u.uid, u.x, u.y, u.w, u.h)) { u.x = -1; u.y = -1; }
        E.autoPlace(st, true);
        save(); render();
        toast('SLC 容量 → ' + u.mb + ' MB（需要 ' + E.minCells(u, st) + ' 格）');
        break;
      }
      case 'merge': doMerge(); break;
      case 'split': doSplit(); break;
      case 'multi-clear': st.multi = []; save(); render(); break;
      case 'rect-clear': st.selRect = null; st.multi = []; save(); render(); break;
      case 'rect-merge': {
        const list = st.selRect ? E.unitsInRect(st, st.selRect) : [];
        const gpus = list.filter(u => u.kind === 'gpu');
        if (gpus.length < 2) { toast('选区里至少要有 2 块 GPU'); break; }
        /* 先把它们挂到多选上：即便合不了，右侧合并面板也会解释原因 */
        st.multi = gpus.map(u => u.uid);
        const r = E.canMerge(st, st.multi);
        if (!r.ok) { save(); render(); toast(r.why || '这些 GPU 不能合并'); break; }
        doMerge();
        break;
      }
      case 'rect-split': {
        const list = st.selRect ? E.unitsInRect(st, st.selRect) : [];
        const target = list.find(u => u.kind === 'gpu' && (u.count || 1) > 1);
        if (!target) { toast('选区里没有合并过的 GPU'); break; }
        st.selected = target.uid;
        doSplit();
        break;
      }
      case 'rect-del': {
        const list = E.unitsInRect(st, st.selRect);
        if (!list.length) { toast('选区里没有模块'); break; }
        const ids = list.map(u => u.uid);
        const freed = list.reduce((a, u) => a + u.w * u.h, 0);
        st.units = st.units.filter(u => ids.indexOf(u.uid) < 0);
        st.multi = st.multi.filter(id => ids.indexOf(id) < 0);
        if (ids.indexOf(st.selected) >= 0) st.selected = null;
        if (ids.indexOf(st.pending) >= 0) { st.pending = null; st.pendingXY = null; }
        st.selRect = null;
        save(); render();
        toast('已删除选区内 ' + list.length + ' 个模块，释放 ' + freed + 'mm²');
        break;
      }
      case 'rect-copy': {
        const sr = st.selRect;
        const list = E.unitsInRect(st, sr);
        if (!list.length) { toast('选区里没有模块'); break; }
        const clones = E.cloneUnits(list);
        const spot = E.findPasteSpot(st, list);   // 就近找一块能整体原样放下的空位
        if (spot) {
          clones.forEach((c, i) => { c.x = list[i].x + spot.dx; c.y = list[i].y + spot.dy; });
          st.units = st.units.concat(clones);
          st.selRect = { x: sr.x + spot.dx, y: sr.y + spot.dy, w: sr.w, h: sr.h };
          st.selected = null;
          save(); render();
          toast('已按原排版复制 ' + clones.length + ' 个模块 —— 选区跟到了副本上，可以连着贴');
        } else {
          clones.forEach(c => { c.x = -1; c.y = -1; });
          st.units = st.units.concat(clones);
          st.selected = null;
          save(); render();
          toast('剩余空间不足，' + clones.length + ' 个副本已放进待放置区');
        }
        break;
      }
      case 'reset-mania': st.quality = E.makeQuality(rngSeed()); st.result = null; save(); go('oc'); toast('重新抽了一颗硅'); break;
      case 'copy-spec': copy(specText(), '规格文案已复制'); break;
      case 'copy-review': copy(reviewText(), '发布会文案已复制'); break;
      case 'share-layout': buildLayoutShare(); break;
      case 'share-result': buildResultShare(); break;
      case 'share-save': saveShareImage(); break;
      case 'close-share': closePopup(); shareCanvas = null; shareName = ''; break;
    }
  }

  function copy(txt, ok) {
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast(ok), () => toast('复制失败'));
    else toast('浏览器不支持复制');
  }

  /* ---------------- 横竖对调 / 合并 / 拆分 ---------------- */
  function rotateSel() {
    const u = st.units.find(x => x.uid === st.selected);
    if (!u) { toast('先选中一个模块再转'); return; }
    if (u.w === u.h) { toast('正方形，横竖一样宽'); return; }
    u.autoFit = false;
    const ow = u.w, oh = u.h;
    u.w = oh; u.h = ow;
    if (u.x >= 0 && !E.canPlace(st, u.uid, u.x, u.y, u.w, u.h)) {
      u.w = ow; u.h = oh;
      toast('这个位置转不开，先挪个地方再转');
    } else {
      toast('已转成 ' + u.w + '×' + u.h);
    }
    save(); render();
  }

  function doMerge() {
    const r = E.mergeUnits(st, st.multi);
    if (!r.ok) { toast(r.why || '不能合并'); return; }
    st.selected = r.unit.uid;
    st.multi = [];
    save(); render();
    toast('已合并成 ' + gpuCountLabel(r.unit.archId, r.count) + ' 的 GPU 区域（' + r.w + '×' + r.h + '）' + (r.gap > 0 ? '，补空缺多付 ' + r.gap + ' 格' : '，一点没浪费'));
  }

  function doSplit() {
