<!doctype html>
<html lang="zh-CN">
<head>
<!-- 单文件构建 · 由 index.html + css/style.css + js/*.js 合并而成 · 无外部依赖 -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>重振 ARM 荣光 · ARM Dynasty · v15.3</title>
<meta name="description" content="选 die 面积、逐个摆放 CPU/GPU 核心、超频跑分的芯片自制模拟器" />
<meta http-equiv="Cache-Control" content="no-store" />
<meta name="build" content="v15.3-2026-10-17" />
<style>
/* ============================================================
   重振 ARM 荣光 · ARM Dynasty
   双主题（浅色 / 暗灰）· 液态玻璃 · 真实硅片版图渲染
   玻璃方案遵循知识库《液态玻璃渲染说明.md》
   ============================================================ */

:root{
  /* 滤镜链写进 CSS 变量，一处开关即可整体降级（知识库 §4） */
  --lg: url(#lg) blur(8px) saturate(1.15) brightness(1.02);
  --lg-soft: url(#lg) blur(14px) saturate(1.1) brightness(1.01);

  /* —— 浅色主题 —— */
  --paper:#fafafa;
  --paper-2:#ededef;
  --bg-glow:#ffffff;
  --grid-line:rgba(0,0,0,.020);
  --topbar-1:rgba(250,250,250,.86);
  --topbar-2:rgba(250,250,250,.42);

  --ink:#18181b;
  --ink-2:#52525b;
  --ink-3:#a1a1aa;

  --line:rgba(0,0,0,.08);
  --line-2:rgba(0,0,0,.05);
  --white-edge:rgba(255,255,255,.90);
  --glass-hi:rgba(255,255,255,.70);
  --panel:rgba(255,255,255,.58);

  --surface:#ffffff;
  --surface-2:#fcfcfc;
  --hover:rgba(0,0,0,.035);
  --hover-2:rgba(0,0,0,.06);

  --btn-face:#ffffff;
  --btn-face-hover:#fcfcfc;
  --btn-1-bg:#18181b;
  --btn-1-fg:#ffffff;
  --btn-1-hover:#000000;

  --ok:#3f8f6f;
  --warn:#b4732a;
  --bad:#b3423f;
  --ok-bg:rgba(63,143,111,.09);
  --warn-bg:rgba(180,115,42,.09);
  --bad-bg:rgba(179,66,63,.09);
  --bad-solid:#b3423f;

  --shadow:0 1px 2px rgba(0,0,0,.03), 0 10px 30px rgba(0,0,0,.05);
  --shadow-s:0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  --modal-bg:rgba(24,24,27,.24);
  --toast-bg:#18181b;
  --toast-fg:#ffffff;

  --r:18px; --r-s:12px; --r-xs:9px;

  /* —— 自适应排版令牌（由 CSS clamp + JS 断点共同驱动） —— */
  --gutter:26px;
  --topbar-h:64px;
  --blk-t:9px;
  --blk-s:7.5px;

  /* 核心等级色（只在裸片与色点上出现） */
  --c-prime:#e0466f;
  --c-big:#8b5cf6;
  --c-mid:#3b82f6;
  --c-small:#0ea5a0;
  --c-gpu:#d98324;
  --c-modem:#0d9488;
  --c-mem:#6366f1;
  --c-noc:#8b8b95;
  --c-npu:#c026d3;
  --c-slc:#0891b2;

  color-scheme: light;
}

/* ==================== 暗灰主题 ==================== */
body.dark{
  --paper:#1a1a1e;
  --paper-2:#141417;
  --bg-glow:#2c2c34;
  --grid-line:rgba(255,255,255,.026);
  --topbar-1:rgba(22,22,26,.90);
  --topbar-2:rgba(22,22,26,.42);

  --ink:#f2f2f4;
  --ink-2:#a6a6b2;
  --ink-3:#6e6e7a;

  --line:rgba(255,255,255,.135);
  --line-2:rgba(255,255,255,.07);
  --white-edge:rgba(255,255,255,.09);
  --glass-hi:rgba(255,255,255,.10);
  --panel:rgba(255,255,255,.048);

  --surface:#242429;
  --surface-2:#1f1f24;
  --hover:rgba(255,255,255,.055);
  --hover-2:rgba(255,255,255,.09);

  --btn-face:#26262c;
  --btn-face-hover:#2e2e35;
  --btn-1-bg:#f2f2f4;
  --btn-1-fg:#16161a;
  --btn-1-hover:#ffffff;

  --ok:#4ec38f;
  --warn:#d9a24e;
  --bad:#e0706c;
  --ok-bg:rgba(78,195,143,.12);
  --warn-bg:rgba(217,162,78,.12);
  --bad-bg:rgba(224,112,108,.12);
  --bad-solid:#c9554f;

  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 36px rgba(0,0,0,.5);
  --shadow-s:0 1px 2px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.3);
  --modal-bg:rgba(0,0,0,.5);
  --toast-bg:#f2f2f4;
  --toast-fg:#16161a;

  color-scheme: dark;
}

body.no-lg{
  --lg: blur(10px) saturate(1.1) brightness(1.01);
  --lg-soft: blur(16px) saturate(1.05) brightness(1.005);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",
              "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  letter-spacing:.005em;
  transition:background .3s, color .3s;
}
button{font-family:inherit;color:inherit}
::selection{background:var(--hover-2)}

/* ==================== 背景 ==================== */
.bg{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1100px 620px at 50% -12%, var(--bg-glow) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  transition:background .3s;
}
.bg::after{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 72px);
  -webkit-mask:radial-gradient(120% 90% at 50% 0%, #000 0%, transparent 72%);
  mask:radial-gradient(120% 90% at 50% 0%, #000 0%, transparent 72%);
}
.grain{
  position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.10;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
}
body.dark .grain{opacity:.055;mix-blend-mode:screen}

/* ==================== 玻璃 ==================== */
.glass{
  position:relative;
  background:var(--panel);
  border:1px solid var(--white-edge);
  outline:1px solid var(--line-2);
  outline-offset:-1px;
  border-radius:var(--r);
  -webkit-backdrop-filter:var(--lg);
  backdrop-filter:var(--lg);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow);
}
.glass-2{
  position:relative;
  background:var(--panel);
  border:1px solid var(--white-edge);
  outline:1px solid var(--line-2);
  outline-offset:-1px;
  border-radius:999px;
  -webkit-backdrop-filter:blur(14px) saturate(1.1);
  backdrop-filter:blur(14px) saturate(1.1);
  box-shadow:inset 0 1px 0 var(--glass-hi), var(--shadow-s);
}
body:not(.dark) .glass-2{background:rgba(255,255,255,.72)}

/* ==================== 启动遮罩 ==================== */
.boot{
  position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;background:var(--paper);color:var(--ink);font-size:13px;text-align:center;padding:24px;
}
.boot-spin{
  width:22px;height:22px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--ink);
  animation:bootspin .8s linear infinite;
}
@keyframes bootspin{to{transform:rotate(360deg)}}
.boot.err{justify-content:center}
.boot.err b{font-size:16px;color:var(--bad)}
.boot-msg{max-width:62ch;line-height:1.7;color:var(--ink-2);font-size:12.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-family:ui-monospace,Consolas,monospace}
.boot-btn{
  cursor:pointer;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--ink);color:var(--paper);border:0;
}
.boot-hint{font-size:11px;color:var(--ink-3)}
.boot.noscript{z-index:10001}
.boot a.boot-btn{display:inline-block;text-decoration:none;line-height:1.2}

/* ==================== 骨架 ==================== */
.stage{
  position:relative;z-index:1;max-width:1480px;margin:0 auto;
  /* 顶栏高度由 JS 实测写入 --topbar-h，顶栏换行也不会压住正文 */
  padding:calc(var(--topbar-h,64px) + 26px) var(--gutter,26px) 72px;
}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;align-items:center;gap:14px;justify-content:space-between;
  flex-wrap:nowrap;min-height:60px;
  padding:12px var(--gutter,26px);
  background:linear-gradient(to bottom, var(--topbar-1), var(--topbar-2));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-2);
  transition:background .3s;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;min-width:0;flex:0 1 auto}
.brand-mark{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-weight:700;font-size:10.5px;letter-spacing:.04em;
  background:var(--ink);color:var(--paper);
}
.brand-txt{line-height:1.2;min-width:0}
.brand-txt b{display:block;font-size:13.5px;font-weight:650;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-mark{flex:none}
.top-actions{display:flex;gap:8px;flex:none}
.brand-txt small{font-size:9px;color:var(--ink-3);letter-spacing:.14em}

.steps{
  display:flex;gap:2px;padding:4px;border-radius:999px;
  /* 桌面悬浮在顶栏正中；手机端在下面的媒体查询里改为底部导航 */
  position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:61;
}
.steps button{
  border:0;background:transparent;cursor:pointer;padding:7px 14px;border-radius:999px;
  font-size:12.5px;color:var(--ink-2);transition:.18s;white-space:nowrap;font-weight:500;
}
.steps button .n{
  display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;
  background:var(--hover-2);font-size:9.5px;margin-right:6px;font-weight:650;
}
.steps button.on{background:var(--btn-1-bg);color:var(--btn-1-fg)}
.steps button.on .n{background:rgba(255,255,255,.22);color:inherit}
body.dark .steps button.on .n{background:rgba(0,0,0,.18)}
.steps button.done .n{background:var(--ok-bg);color:var(--ok)}
.steps button:disabled{opacity:.34;cursor:not-allowed}

.top-actions{display:flex;gap:8px}
.chip-btn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  padding:8px 14px;font-size:12.5px;font-weight:550;transition:.18s;
}
.chip-btn:hover{background:var(--btn-face-hover)}
.chip-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--ink);transition:.2s}
body.no-lg .chip-btn .dot{background:var(--ink-3)}
.chip-btn .th{
  width:12px;height:12px;border-radius:50%;border:1px solid var(--line);
  background:linear-gradient(90deg, #f2f2f4 0 50%, #26262c 50% 100%);
}
body.dark .chip-btn .th{background:linear-gradient(90deg, #26262c 0 50%, #f2f2f4 50% 100%)}

/* ==================== 文字 ==================== */
h1,h2,h3,h4{margin:0;letter-spacing:-.022em;line-height:1.18;font-weight:650}
h1{font-size:clamp(28px,4vw,46px);font-weight:600;letter-spacing:-.03em}
h2{font-size:20px;font-weight:640}
h3{font-size:14px;font-weight:640}
p{margin:0}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.tiny{font-size:11px;line-height:1.6}
.mono{font-family:"SF Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:9px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:13px}
.hr{height:1px;background:var(--line-2);margin:13px 0}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:999px;
  font-size:11px;font-weight:550;color:var(--ink-2);
  background:var(--hover);border:1px solid var(--line-2);
}
.badge.solid{background:var(--btn-1-bg);color:var(--btn-1-fg);border-color:transparent}
.badge.g{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.badge.o{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.badge.r{color:var(--bad);background:var(--bad-bg);border-color:transparent}

/* ==================== 按钮 ==================== */
.btn{
  cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:10px 18px;
  font-size:13px;font-weight:550;background:var(--btn-face);color:var(--ink);
  box-shadow:var(--shadow-s);transition:.16s;
}
.btn:hover{background:var(--btn-face-hover);border-color:var(--hover-2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.34;cursor:not-allowed;transform:none;box-shadow:none}
.btn-primary{background:var(--btn-1-bg);color:var(--btn-1-fg);border-color:transparent}
.btn-primary:hover{background:var(--btn-1-hover)}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:9px}
.btn-icon{padding:6px 9px;border-radius:8px;line-height:1}
.btn-go{background:var(--btn-1-bg);color:var(--btn-1-fg);border-color:transparent;padding:13px 24px;font-size:13.5px}
.btn-go:hover{background:var(--btn-1-hover)}

/* ==================== 输入控件 ==================== */
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
select,input[type=text],input[type=number]{
  width:100%;padding:9px 11px;border-radius:10px;font-size:13px;font-weight:500;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);outline:none;transition:.16s;
}
select:focus,input:focus{border-color:var(--ink-3);box-shadow:0 0 0 3px var(--hover-2)}
select{appearance:none;cursor:pointer;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}

input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;height:20px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:99px;
  /* 先铺底色再叠渐变：即使 --p 异常也不会整条轨道消失 */
  background-color:var(--hover-2);
  background-image:linear-gradient(90deg,var(--ink) 0 var(--p,50%),transparent var(--p,50%) 100%);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;margin-top:-6px;
  background:var(--surface);border:1px solid var(--hover-2);
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:var(--hover-2)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:1px solid var(--hover-2);border-radius:50%;background:var(--surface)}

.stepper{display:inline-flex;align-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);overflow:hidden}
.stepper button{border:0;background:transparent;width:26px;height:28px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.stepper button:hover{background:var(--hover)}
.stepper .val{min-width:30px;text-align:center;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}

.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:500}
.switch input{display:none}
.switch .tk{width:36px;height:20px;border-radius:99px;background:var(--hover-2);position:relative;transition:.2s;flex:none}
.switch .tk::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:.2s}
.switch input:checked + .tk{background:var(--ink)}
.switch input:checked + .tk::after{left:18px}

.card{padding:20px}
.card-tight{padding:14px}

/* ==================== 首页 ==================== */
.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:48px;align-items:center;min-height:62vh}
.hero-sub{font-size:14.5px;line-height:1.85;color:var(--ink-2);max-width:54ch;margin-top:16px}
.hero-cta{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:40px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpi{padding:18px 4px 16px}
.kpi + .kpi{border-left:1px solid var(--line);padding-left:20px}
.kpi b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em}
.eyebrow{font-size:10.5px;letter-spacing:.22em;color:var(--ink-3);font-weight:600;text-transform:uppercase}

.wafer-visual{
  position:relative;width:100%;max-width:430px;aspect-ratio:1;border-radius:50%;margin:0 auto;
  background:
    radial-gradient(circle at 32% 26%, rgba(255,255,255,.92), transparent 46%),
    linear-gradient(125deg,#ff6fb0 0%,#ffab5c 15%,#f0e35c 30%,#6ff0bd 44%,#5cc8ff 58%,#7f8cff 72%,#c46bff 86%,#ff6fb0 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.7),
    inset 0 0 80px rgba(255,255,255,.55),
    0 2px 6px rgba(0,0,0,.06), 0 30px 70px rgba(0,0,0,.16);
  animation:spin 70s linear infinite;
}
.wafer-visual::before{
  content:"";position:absolute;inset:4.5%;border-radius:50%;
  background:
    repeating-conic-gradient(rgba(255,255,255,.5) 0 1deg, transparent 1deg 6deg),
    repeating-radial-gradient(circle, rgba(255,255,255,.3) 0 1px, transparent 1px 5.5%);
  opacity:.6;mix-blend-mode:overlay;
}
.wafer-visual::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.82) 48%,transparent 56%);
  mix-blend-mode:screen;animation:sweep 8s ease-in-out infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%,100%{transform:translateX(-70%)}50%{transform:translateX(70%)}}
.wafer-die{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:33%;aspect-ratio:1;border-radius:8px;background:#141417;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.55), 0 0 34px rgba(0,0,0,.35);
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:2px;padding:6px;
}
.wafer-die i{border-radius:2px;background:rgba(255,255,255,.9)}
.wafer-die i:nth-child(1){grid-column:span 2;grid-row:span 2;background:#e0466f}
.wafer-die i:nth-child(2){grid-column:span 2;background:#d98324}
.wafer-die i:nth-child(3){background:#0ea5a0}
.wafer-die i:nth-child(4){grid-column:span 2;background:#3b82f6}
.wafer-die i:nth-child(5){background:#8b5cf6}

/* ==================== 区块标题 ==================== */
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.section-head p{font-size:12.5px;color:var(--ink-2);max-width:76ch;line-height:1.7;margin-top:6px}

/* ==================== 选面积 / 制程 ==================== */
.seg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.seg-card{
  cursor:pointer;border-radius:14px;padding:15px;border:1px solid var(--line);
  background:var(--surface);transition:.16s;position:relative;
}
.seg-card:hover{border-color:var(--hover-2);transform:translateY(-2px);box-shadow:var(--shadow-s)}
.seg-card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.seg-card.on::after{content:"";position:absolute;top:13px;right:13px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.seg-card b{font-size:14px;font-weight:640}
.seg-badge{
  display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;flex:none;
  background:linear-gradient(150deg,#ff6fb0,#ffab5c 26%,#6ff0bd 52%,#5cc8ff 76%,#c46bff);
  color:#fff;font-size:9px;font-weight:700;letter-spacing:.02em;
  text-shadow:0 1px 2px rgba(0,0,0,.45);
}
.area-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.area-card{
  cursor:pointer;border-radius:14px;padding:13px;border:1px solid var(--line);
  background:var(--surface);transition:.16s;position:relative;
}
.area-card:hover{border-color:var(--hover-2);transform:translateY(-2px);box-shadow:var(--shadow-s)}
.area-card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.area-card .mini-die{
  width:100%;aspect-ratio:1;border-radius:9px;margin-bottom:10px;
  background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);
  display:grid;place-items:center;overflow:hidden;position:relative;
}
.area-card .mini-die b{font-size:15px;font-weight:600;color:var(--ink-2);letter-spacing:-.02em}
.area-card .mini-die::before{
  content:"";position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px var(--c,10%)),
    repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px var(--c,10%));
}
body.dark .area-card .mini-die::before{--grid-line:rgba(255,255,255,.07)}
.area-card .mm{font-size:10px;color:var(--ink-3);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.area-card.on::after{content:"";position:absolute;top:11px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--ink)}

.node-list{display:flex;flex-direction:column;gap:6px}
.node-row{
  display:grid;grid-template-columns:90px 1.5fr 1fr 1fr 1fr auto;gap:14px;align-items:center;
  padding:11px 14px;border-radius:12px;cursor:pointer;transition:.16s;
  border:1px solid var(--line);background:var(--surface);
}
.node-row:hover{border-color:var(--hover-2)}
.node-row.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.node-row b{font-size:13px;font-weight:600}
.bar-mini{height:3px;border-radius:99px;background:var(--hover-2);overflow:hidden}
.bar-mini > i{display:block;height:100%;border-radius:99px;background:var(--ink)}

/* ==================== 版图编辑器 ==================== */
.layout-grid{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:1280px){.layout-grid{grid-template-columns:1fr}}

.die-wrap{display:flex;flex-direction:column;gap:11px}
.die-shell{
  position:relative;width:100%;max-width:680px;margin:0 auto;aspect-ratio:1;
  border-radius:20px;padding:14px;
  background:var(--surface);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  transition:background .3s;
}
.die{
  position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.16) 0 1px, transparent 1px calc(100% / var(--n))),
    repeating-linear-gradient(0deg, rgba(255,255,255,.16) 0 1px, transparent 1px calc(100% / var(--n))),
    radial-gradient(125% 95% at 16% 10%, rgba(255,255,255,.72), transparent 46%),
    linear-gradient(118deg,
      #ff6fb0 0%, #ffab5c 14%, #f0e35c 27%, #6ff0bd 40%,
      #5cc8ff 54%, #7f8cff 68%, #c46bff 82%, #ff6fb0 100%),
    #141417;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);
}
body.dark .die{
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 1px, transparent 1px calc(100% / var(--n))),
    repeating-linear-gradient(0deg, rgba(255,255,255,.10) 0 1px, transparent 1px calc(100% / var(--n))),
    radial-gradient(125% 95% at 16% 10%, rgba(255,255,255,.42), transparent 46%),
    linear-gradient(118deg,
      #cf4f8a 0%, #cf8340 14%, #c0b43c 27%, #4cc79a 40%,
      #3fa4d9 54%, #5f6cd6 68%, #9c4fd6 82%, #cf4f8a 100%),
    #0f0f12;
}
.die::before{ /* 薄膜干涉细纹 */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    repeating-linear-gradient(64deg,
      rgba(255,0,190,.18) 0 5px, rgba(0,215,255,.18) 5px 10px, rgba(255,225,0,.18) 10px 15px),
    radial-gradient(65% 55% at 74% 82%, rgba(255,255,255,.5), transparent 62%);
  mix-blend-mode:soft-light;
  animation:holo 16s ease-in-out infinite;
}
@keyframes holo{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(-30deg)}}

/* IO / 焊盘环（真实裸片边缘的那圈 pad） */
.io-ring{
  position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:inherit;
  background:
    radial-gradient(circle, rgba(255,236,190,.95) 1.1px, rgba(0,0,0,.35) 1.5px, transparent 2px) 0 0/8px 8px;
  -webkit-mask:linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude;
  padding:5px;opacity:.55;
}

/* ==================== 真实风格模块 ==================== */
.blk{
  position:absolute;border-radius:2px;cursor:grab;overflow:hidden;z-index:2;
  /* 金属层高光 + 硅基底 */
  background:
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 44%, rgba(0,0,0,.30)),
    linear-gradient(155deg, var(--m1,#2a2a33), var(--m2,#3a3a45));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    inset 0 -1px 0 rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(0,0,0,.35),
    0 1px 2px rgba(0,0,0,.4);
  transition:box-shadow .16s, filter .16s;
  display:flex;flex-direction:column;justify-content:center;
  padding:2px 4px 2px 7px;user-select:none;touch-action:none;
}
/* 版图纹理：按模块类型换图案 */
.blk::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:var(--tx);
}
.blk[data-tx="cpu"]{--tx:
  repeating-linear-gradient(0deg, rgba(255,255,255,.16) 0 1px, transparent 1px 3px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.09) 0 1px, transparent 1px 3px);}
.blk[data-tx="gpu"]{--tx:
  radial-gradient(circle, rgba(255,255,255,.30) 1px, transparent 1.5px) 0 0/6px 6px,
  repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 12px);}
.blk[data-tx="sram"]{--tx:
  repeating-linear-gradient(90deg, rgba(255,255,255,.20) 0 2px, transparent 2px 5px),
  repeating-linear-gradient(0deg, rgba(0,0,0,.26) 0 1px, transparent 1px 9px);}
.blk[data-tx="rf"]{--tx:
  repeating-linear-gradient(90deg, rgba(255,255,255,.15) 0 3px, transparent 3px 6px,
    rgba(0,0,0,.22) 6px 7px, transparent 7px 13px);}
.blk[data-tx="phy"]{--tx:
  repeating-linear-gradient(90deg, rgba(255,255,255,.17) 0 1px, transparent 1px 6px),
  repeating-linear-gradient(0deg, rgba(255,255,255,.11) 0 1px, transparent 1px 6px);}
.blk[data-tx="bus"]{--tx:
  repeating-linear-gradient(0deg, rgba(255,255,255,.24) 0 1px, transparent 1px 4px);}
.blk[data-tx="io"]{--tx:
  radial-gradient(circle, rgba(255,235,180,.5) 1px, transparent 1.6px) 0 0/7px 7px;}
/* 等级色条 */
.blk::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--c,#888);box-shadow:0 0 8px var(--c);
}
.blk:hover{filter:brightness(1.16)}
.blk.sel{z-index:7;
  box-shadow:0 0 0 1.5px #fff, 0 0 0 3.5px var(--c,#888), 0 6px 18px rgba(0,0,0,.45);}
.blk.mrg{z-index:5;
  box-shadow:0 0 0 1.5px #fff, 0 0 0 3.5px #22d3ee, 0 0 18px rgba(34,211,238,.55);}
.blk.mrg.sel{box-shadow:0 0 0 1.5px #fff, 0 0 0 4px #22d3ee, 0 0 22px rgba(34,211,238,.7);}
.blk.dragging{opacity:.28}
.blk.bad{box-shadow:0 0 0 1.5px var(--bad-solid), 0 0 0 4px rgba(179,66,63,.35);}
.blk .blk-t{
  font-size:var(--blk-t,9px);font-weight:650;letter-spacing:-.01em;color:rgba(255,255,255,.96);
  text-shadow:0 1px 2px rgba(0,0,0,.7);
  position:relative;width:100%;min-width:0;
  /* 先换行，行数由每一块的可用高度决定；换不下的部分直接裁掉 */
  white-space:normal;overflow-wrap:anywhere;word-break:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:var(--blk-lines,2);line-clamp:var(--blk-lines,2);
  overflow:hidden;line-height:1.1;max-height:100%;
}
.blk .blk-s{
  font-size:var(--blk-s,7.5px);font-weight:500;color:rgba(255,255,255,.62);
  text-shadow:0 1px 2px rgba(0,0,0,.7);
  position:relative;width:100%;min-width:0;
  white-space:normal;overflow-wrap:anywhere;word-break:break-word;
  display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:1;line-clamp:1;
  overflow:hidden;line-height:1.15;max-height:100%;
}
.blk.hide-sub .blk-s{display:none}

/* 合并后的 GPU 区域：右上角标出原始核心数（MP12 = 12 颗） */
.blk .blk-n{
  position:absolute;top:2px;right:2px;z-index:3;pointer-events:none;
  padding:0 3px;border-radius:3px;letter-spacing:0;
  font-size:calc(var(--blk-s,7.5px) * .95);font-weight:650;line-height:1.35;
  color:#fff;background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.30);
  box-shadow:0 1px 2px rgba(0,0,0,.4);
}
.blk.bgpu .blk-t{padding-right:2.8em}
.pack-die .blk .blk-n{font-size:calc(var(--blk-t,6.5px) * .8);padding:0 2px;top:1px;right:1px}
.blk.sz1{padding-left:5px}
.blk.sz1 .blk-t{font-size:calc(var(--blk-t,9px) * .84)}
.blk.sz1 .blk-s{display:none}
.blk.sz4up .blk-t{font-size:calc(var(--blk-t,9px) * 1.06)}
.blk.sz4up .blk-s{font-size:calc(var(--blk-s,7.5px) * 1.07)}
.blk .rz{
  position:absolute;right:0;bottom:0;width:12px;height:12px;cursor:nwse-resize;
  opacity:0;transition:opacity .15s;
}
.blk .rz::after{
  content:"";position:absolute;right:2px;bottom:2px;width:5px;height:5px;
  border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.7));
}
.blk.sel .rz{opacity:1}

.drop-preview{
  position:absolute;border-radius:2px;pointer-events:none;z-index:8;
  border:1.5px dashed rgba(255,255,255,.85);background:rgba(255,255,255,.22);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.drop-preview.bad{border-color:#ff5a5a;background:rgba(255,90,90,.24)}
.drop-preview.ok{border-color:#fff;background:transparent}

/* ==================== 框选选区 ==================== */
.sel-box{
  position:absolute;border-radius:2px;pointer-events:none;z-index:6;
  border:1.5px dashed #22d3ee;background:rgba(34,211,238,.10);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16);
}
.sel-box.empty{background:transparent;border-color:rgba(34,211,238,.45)}
.sel-box.bad{border-color:#ff5a5a;background:rgba(255,90,90,.16);border-style:solid}
.blk.insel{outline:1.5px solid rgba(34,211,238,.95);outline-offset:-1.5px}

/* 触屏长按：等待进入选区的预备态 */
#die.arming{outline:2px solid rgba(34,211,238,.55);outline-offset:-2px}
.die-shell,.die,.blk{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}


/* 拖出删除提示 */
.delhint{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,14px);z-index:130;
  display:flex;align-items:center;gap:9px;
  padding:10px 18px;border-radius:999px;font-size:12.5px;font-weight:600;
  background:var(--surface);color:var(--ink-3);border:1px solid var(--line);
  box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:.2s;
}
.delhint.on{opacity:1;transform:translate(-50%,0)}
.delhint .ic{
  width:14px;height:14px;border-radius:3px;border:1.5px solid currentColor;position:relative;flex:none;
}
.delhint .ic::before{
  content:"";position:absolute;left:2.5px;right:2.5px;top:4.5px;height:1.5px;background:currentColor;
}
.delhint.hot{background:var(--bad-solid);border-color:transparent;color:#fff;box-shadow:0 10px 28px rgba(0,0,0,.35)}

/* 面板列表 */
.palette{display:flex;flex-direction:column;gap:5px}
.pal-item{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);transition:.15s;user-select:none;
}
.pal-item:hover{border-color:var(--hover-2);background:var(--surface-2)}
.pal-item.dis{opacity:.4;cursor:not-allowed}
.pal-chip{width:16px;height:16px;border-radius:4px;flex:none;background:var(--c,#888)}
.pal-item b{font-size:12.5px;display:block;font-weight:600}
.pal-item small{font-size:10px;color:var(--ink-3)}

.tray{
  border:1px dashed var(--hover-2);border-radius:11px;padding:9px;
  background:var(--hover);min-height:52px;
}
.tray-chip{
  display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:550;
  cursor:grab;margin:3px 3px 0 0;box-shadow:var(--shadow-s);touch-action:none;
}
.tray-chip.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.tray-chip .pal-chip{width:9px;height:9px;border-radius:2px}

/* 检查器 */
.insp{display:flex;flex-direction:column;gap:11px}
.group{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.group-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.group-head b{font-size:12.5px;font-weight:600}
.group-head .pal-chip{width:11px;height:11px;border-radius:3px}
.group-body{padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.count-pill{
  font-size:10.5px;font-weight:650;font-variant-numeric:tabular-nums;
  padding:1px 7px;border-radius:99px;background:var(--hover-2);color:var(--ink-2);
}

/* ==================== 参数条 ==================== */
.statbar{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stat{flex:1;min-width:92px;padding:10px 13px}
.stat + .stat{border-left:1px solid var(--line-2)}
.stat b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;letter-spacing:-.02em}
.stat small{font-size:9.5px;color:var(--ink-3);letter-spacing:.06em}
.stat.warn b{color:var(--bad)}
.stat.good b{color:var(--ok)}

/* ==================== 弹窗 ==================== */
.modal-wrap{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:22px;
  background:var(--modal-bg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
}
.modal-wrap[hidden]{display:none}
.modal{width:min(760px,95vw);max-height:86vh;overflow:auto;padding:24px;border-radius:16px}
.modal h2{margin-bottom:6px}

.pick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:7px;margin-top:14px}
.pick{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:.14s;text-align:left;
}
.pick:hover{border-color:var(--ink);background:var(--surface-2)}
.pick .pal-chip{width:14px;height:14px;border-radius:4px}
.pick b{font-size:12.5px;display:block;font-weight:600;line-height:1.3}
.pick small{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ==================== 封装展示 ==================== */
.pack-stage{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
@media (max-width:1040px){.pack-stage{grid-template-columns:1fr}}
.pack-scene{perspective:1500px;display:grid;place-items:center;padding:24px 10px;min-height:400px}
.package{
  width:min(390px,70vw);aspect-ratio:1;border-radius:22px;position:relative;
  transform-style:preserve-3d;transform:rotateX(14deg) rotateY(-11deg);
  transition:transform .5s cubic-bezier(.2,.8,.3,1);
  background:linear-gradient(150deg,#252528,#38383c 46%,#1c1c1f);
  box-shadow:
    0 30px 60px rgba(0,0,0,.34),
    0 0 0 1px rgba(255,255,255,.14),
    inset 0 1px 0 rgba(255,255,255,.2);
  padding:9%;
}
.package::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.4;
  background:
    repeating-linear-gradient(90deg, rgba(228,190,120,.3) 0 1px, transparent 1px 13px),
    repeating-linear-gradient(0deg, rgba(228,190,120,.2) 0 1px, transparent 1px 13px);
}
.package::after{
  content:"";position:absolute;inset:2.5%;border-radius:20px;pointer-events:none;
  background:radial-gradient(circle, rgba(235,215,165,.9) 1.4px, transparent 1.9px) 0 0/15px 15px;
  -webkit-mask:linear-gradient(#000,#000) content-box, linear-gradient(#000,#000);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:6px;opacity:.8;
}
.pack-die{
  position:absolute;inset:14%;border-radius:8px;overflow:hidden;
  background:
    radial-gradient(125% 95% at 16% 10%, rgba(255,255,255,.7), transparent 46%),
    linear-gradient(118deg,#ff6fb0 0%,#ffab5c 14%,#f0e35c 27%,#6ff0bd 40%,#5cc8ff 54%,#7f8cff 68%,#c46bff 82%,#ff6fb0 100%),
    #141417;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.4), 0 0 26px rgba(0,0,0,.4);
}
.pack-die .blk{cursor:default;border-radius:1.5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.pack-die .blk::before{opacity:.4}
.pack-die .blk .blk-t{font-size:calc(var(--blk-t,6.5px) * .72)}
.pack-die .blk .blk-s{display:none}
.pack-die .blk::after{width:2px;box-shadow:none}
.pack-label{
  position:absolute;left:9%;bottom:5%;font-size:10px;font-weight:650;letter-spacing:.14em;
  color:rgba(255,255,255,.6);
}
.pack-brand{
  position:absolute;right:9%;top:5.2%;font-size:8.5px;font-weight:600;letter-spacing:.2em;
  color:rgba(255,255,255,.35);text-transform:uppercase;
}

/* ==================== 超频实验室 ==================== */
.oc-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1040px){.oc-grid{grid-template-columns:1fr}}
.oc-slider{padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.oc-slider .v{font-size:14.5px;font-weight:650;font-variant-numeric:tabular-nums}
.risk-meter{height:5px;border-radius:99px;overflow:hidden;background:var(--hover-2)}
.risk-meter > i{display:block;height:100%;border-radius:99px;transition:width .25s, background .25s}
.thermo{
  height:5px;border-radius:99px;position:relative;
  background:linear-gradient(90deg,var(--ink-3),var(--ink));
}
.thermo .mark{position:absolute;top:-5px;width:2px;height:15px;border-radius:2px;background:var(--ink)}
.cool-card{
  cursor:pointer;border-radius:12px;padding:11px;border:1px solid var(--line);background:var(--surface);
  transition:.15s;flex:1;min-width:148px;
}
.cool-card:hover{border-color:var(--hover-2)}
.cool-card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* ==================== 跑分 ==================== */
.bench-wrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1040px){.bench-wrap{grid-template-columns:1fr}}
.progress-ring{position:relative;width:100%;aspect-ratio:1;max-width:200px;margin:0 auto}
.progress-ring svg{transform:rotate(-90deg);width:100%;height:100%}
.progress-ring .pct{position:absolute;inset:0;display:grid;place-items:center}
.progress-ring .pct b{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.progress-ring .pct small{font-size:9.5px;color:var(--ink-3);letter-spacing:.16em;display:block;text-align:center;margin-top:5px}

.test-list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.test-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 13px;transition:.25s}
.test-row + .test-row{border-top:1px solid var(--line-2)}
.test-row.run{background:var(--surface-2)}
.test-row b{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}
.test-row.done b{color:var(--ink)}
.test-row .tname{font-size:12.5px;font-weight:550}
.test-row .tsub{font-size:10px;color:var(--ink-3)}
canvas.chart{width:100%;height:180px;display:block;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

/* ==================== 结果 ==================== */
.result-hero{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center}
@media (max-width:840px){.result-hero{grid-template-columns:1fr}}
.grade-ring{
  width:172px;height:172px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:linear-gradient(135deg,#ff6fb0,#ffab5c 22%,#f0e35c 38%,#6ff0bd 54%,#5cc8ff 70%,#c46bff);
  box-shadow:0 2px 6px rgba(0,0,0,.08), 0 20px 44px rgba(0,0,0,.14);
}
.grade-ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.1)}
.grade-ring .inner{position:relative;text-align:center}
.grade-ring .g{font-size:42px;font-weight:650;line-height:1;letter-spacing:-.05em}
.grade-ring .rn{font-size:10px;font-weight:650;letter-spacing:.16em;color:var(--ink-3);margin-top:7px}

.score-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:0;
  border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.score-card{padding:13px 15px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.score-card small{font-size:9.5px;color:var(--ink-3);letter-spacing:.07em;display:block}
.score-card b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.score-card .sust{font-size:10.5px;color:var(--ink-3);margin-top:1px}

.cmp{display:flex;flex-direction:column;gap:6px}
.cmp-row{display:grid;grid-template-columns:120px 1fr 74px;gap:11px;align-items:center;font-size:11.5px}
.cmp-row .nm{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-bar{height:13px;border-radius:3px;background:var(--hover-2);overflow:hidden}
.cmp-bar > i{display:block;height:100%;background:var(--ink-3);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.cmp-row.me .nm{font-weight:650;color:var(--ink)}
.cmp-row.me .cmp-bar > i{background:linear-gradient(90deg,#ff6fb0,#6ff0bd 40%,#5cc8ff 70%,#c46bff)}
.cmp-row .vl{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

.remark{padding:13px 15px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.remark b{color:var(--ink);font-weight:600}

/* 规格小卡（pack 页内联） */
.spec-lite{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.spec-lite small{display:block;font-size:9.5px;color:var(--ink-3);letter-spacing:.08em;margin-bottom:3px}
.spec-lite b{font-size:13px;font-weight:600}

/* ==================== 分享海报 ==================== */
.share-preview{
  margin-top:12px;max-height:62vh;overflow:auto;
  border:1px solid var(--line);border-radius:12px;
  background:var(--surface-2);padding:10px;
  -webkit-overflow-scrolling:touch;
}
.share-preview canvas{display:block;width:100%;min-width:560px;height:auto;border-radius:8px;box-shadow:var(--shadow-s)}
@media (max-width:820px){ .share-preview{max-height:56vh} }

/* ==================== 其他 ==================== */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);z-index:300;
  padding:11px 20px;border-radius:999px;font-size:12.5px;font-weight:550;
  background:var(--toast-bg);color:var(--toast-fg);box-shadow:0 10px 30px rgba(0,0,0,.3);
  opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1);max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
.delhint.on ~ .toast{bottom:82px}

.crash-flash{animation:crash .45s steps(3) 4}
@keyframes crash{0%{filter:invert(0)}50%{filter:invert(1)}100%{filter:invert(0)}}

@media (prefers-reduced-motion: reduce){
  .wafer-visual,.wafer-visual::after,.die::before{animation:none !important}
  *{transition-duration:.01ms !important}
}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--hover-2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   自适应布局 · Adaptive Layout
   断点：xxl ≥1600 / xl 1321-1599 / lg 1081-1320 / md 821-1080
        sm 641-820 / xs 431-640 / xxs ≤430
   JS 侧同步写入 data-bp，并在断点切换时重排界面、重算裸片字号
   ============================================================ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
h1,h2,h3{text-wrap:balance}
.section-head p,.hero-sub,.remark,.seg-card .tiny{text-wrap:pretty}

/* 流式字号：桌面略放、手机自动收，不靠媒体查询一刀切 */
h1{font-size:clamp(27px,4.6vw,46px)}
h2{font-size:clamp(18px,2.05vw,21px)}
h3{font-size:clamp(13.5px,1.35vw,15px)}
.hero-sub{font-size:clamp(13.5px,1.12vw,15px)}
.section-head p{font-size:clamp(12px,.98vw,12.8px)}
.tiny{font-size:clamp(10px,.8vw,11px)}
.small{font-size:clamp(11.5px,.92vw,12.2px)}
.btn{font-size:clamp(12.2px,.95vw,13.2px)}
.btn-sm{font-size:clamp(11.4px,.88vw,12.2px)}
.stat b{font-size:clamp(14.5px,1.25vw,16.5px)}
.score-card b{font-size:clamp(18px,1.7vw,21px)}

/* 超宽屏：版心放宽，三栏同步加宽 */
@media (min-width:1600px){
  .stage{max-width:1660px}
  .layout-grid{grid-template-columns:230px minmax(0,1fr) 360px}
  .die-shell{max-width:760px}
}

/* 小桌面 / 平板横屏：顶栏收紧，版图三栏略收 */
@media (max-width:1320px){
  .layout-grid{grid-template-columns:190px minmax(0,1fr) 310px;gap:12px}
  .topbar{padding:10px 18px;gap:10px}
  .stage{padding-left:18px;padding-right:18px}
  .steps button{padding:6px 11px;font-size:12px}
}

/* 平板竖屏：版图改单列，裸片优先，检查器殿后 */
@media (max-width:1080px){
  .layout-grid{grid-template-columns:1fr}
  .layout-grid > .die-wrap{order:1}
  .layout-grid > aside:first-of-type{order:2}
  .layout-grid > .insp{order:3}
  .pack-stage,.oc-grid,.bench-wrap{grid-template-columns:1fr}
  .section-head{align-items:flex-start}
  .steps button{padding:6px 9px;font-size:11.5px}
  .steps button .n{width:15px;height:15px;font-size:9px}
}

/* ==================== 手机 / 小屏 ==================== */
@media (max-width:820px){
  .stage{padding:calc(var(--topbar-h,60px) + 14px) var(--gutter,14px) calc(88px + env(safe-area-inset-bottom))}
  .topbar{padding:calc(8px + env(safe-area-inset-top)) var(--gutter,14px) 8px;gap:8px}

  /* 步骤条：固定在底部，变成五等分胶囊导航，而不是直接消失 */
  .steps{
    display:flex;left:10px;right:10px;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));
    transform:none;z-index:70;justify-content:space-between;gap:0;padding:5px;
    box-shadow:inset 0 1px 0 var(--glass-hi),var(--shadow);
  }
  .steps button{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:6px 2px;font-size:9px;line-height:1.1;letter-spacing:0;
  }
  .steps button .n{margin:0;width:18px;height:18px;font-size:9.5px}
  .steps button .sl{display:block;white-space:nowrap;transform:scale(.94)}
  .steps button:disabled{opacity:.26}

  /* 提示条避让底部导航 */
  .toast{bottom:calc(78px + env(safe-area-inset-bottom));width:max-content;max-width:calc(100vw - 32px)}
  .delhint{bottom:calc(78px + env(safe-area-inset-bottom))}
  .delhint.on ~ .toast{bottom:calc(130px + env(safe-area-inset-bottom))}

  .top-actions{gap:6px}
  .top-actions .lbl{display:none}
  .chip-btn{padding:8px 11px}
  #btn-help{font-size:11.5px;padding:8px 10px}

  .brand{padding:5px 12px 5px 5px;gap:8px}
  .brand-mark{width:29px;height:29px;font-size:9.5px}
  .brand-txt b{font-size:12.5px}

  .hero{grid-template-columns:1fr;gap:30px;min-height:auto}
  .hero-sub{margin-top:12px;line-height:1.8}
  .hero-cta{margin-top:22px}
  .hero-cta .btn{flex:1;min-width:132px;text-align:center}
  .wafer-visual{max-width:300px}
  .kpis{grid-template-columns:1fr 1fr;margin-top:26px}
  .kpi + .kpi{border-left:0}
  .kpi{padding:14px 2px}
  .kpi:nth-child(even){border-left:1px solid var(--line);padding-left:14px}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}

  /* 卡片 / 网格：按可用宽度自动铺 */
  .seg-grid{grid-template-columns:1fr;gap:10px}
  .area-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
  .pick-list{grid-template-columns:1fr}
  .score-cards{grid-template-columns:repeat(2,1fr)}
  .score-card{padding:11px 12px}
  .score-card:nth-child(even){border-right:0}

  /* 制程节点：从六列压成三行卡片 */
  .node-row{
    grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-areas:"name name badge" "desc desc desc" "d0 cost yield";
    gap:9px 10px;padding:13px;border-radius:12px;
  }
  .node-row > div:nth-child(1){grid-area:name}
  .node-row > div:nth-child(2){grid-area:desc}
  .node-row > div:nth-child(3){grid-area:d0}
  .node-row > div:nth-child(4){grid-area:cost}
  .node-row > div:nth-child(5){grid-area:yield}
  .node-row > span.badge{grid-area:badge;justify-self:end;align-self:start}
  .node-row.on::after{display:none}

  /* 参数条：三列网格，去掉落单的左边框 */
  .statbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .stat{min-width:0;padding:9px 10px}
  .stat + .stat{border-left:1px solid var(--line-2)}
  .stat:nth-child(3n+1){border-left:0}
  .stat:nth-child(n+4){border-top:1px solid var(--line-2)}

  /* 对比条：名字让位给数据 */
  .cmp-row{grid-template-columns:96px minmax(0,1fr) 58px;gap:8px}
  .result-hero{grid-template-columns:1fr;gap:20px}
  .result-hero .grade-ring{justify-self:center}
  .grade-ring{width:clamp(132px,44vw,172px);height:clamp(132px,44vw,172px)}
  .grade-ring .g{font-size:clamp(34px,10vw,42px)}

  /* 裸片：更小的内边距，把像素全留给版图 */
  .die-shell{padding:clamp(6px,2.4vw,12px);border-radius:16px}
  .die{border-radius:8px}
  .section-head{gap:10px}
  .section-head .btn-go,.section-head .wrap{width:100%}
  .section-head .wrap .btn{flex:1;text-align:center}

  .modal-wrap{padding:0;align-items:end}
  .modal{
    width:100%;max-height:92dvh;border-radius:18px 18px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .modal .between{align-items:flex-start}

  .btn-go{width:100%;text-align:center}
  .pack-scene{min-height:auto;padding:16px 6px}
  .package{width:min(330px,78vw)}
}

/* 窄屏手机 */
@media (max-width:560px){
  .stage{padding-top:calc(var(--topbar-h,60px) + 10px)}
  .statbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3n+1){border-left:1px solid var(--line-2)}
  .stat:nth-child(2n+1){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line-2)}
  .area-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .score-cards{grid-template-columns:1fr}
  .score-card{border-right:0}
  .cmp-row{grid-template-columns:82px minmax(0,1fr) 52px}
  .layout-grid > aside:first-of-type .palette{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .topbar .brand-txt small{display:none}
}

/* 超窄屏：只保留必需信息 */
@media (max-width:430px){
  .brand-txt b{font-size:11.5px}
  .brand-mark{width:27px;height:27px}
  .steps button{padding:6px 0}
  .steps button .sl{font-size:8.5px}
  .stat b{font-size:14px}
  .area-grid{grid-template-columns:1fr}
  .pick-list{gap:6px}
  .modal{padding-left:13px;padding-right:13px}
}

/* 触屏 / 小屏：关掉裸片的持续色相动画，避免整块版图每帧重绘导致文字缺笔 */
@media (pointer:coarse),(max-width:820px){
  .die::before{animation:none}
}

/* 触屏：取消 hover 位移，避免点完“跳一下” */
@media (hover:none){
  .btn:hover,.seg-card:hover,.area-card:hover{transform:none}
  .blk:hover{filter:none}
}

/* ============================================================
   多 die 拼接（桌面 / 服务器）
   ============================================================ */
.die-tabs{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  width:max-content;max-width:100%;padding:5px;margin:0 0 13px;border-radius:999px;
}
.die-tab{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  border:1px solid transparent;background:transparent;color:var(--ink-2);
  font-size:12px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;
}
.die-tab small{font-size:9.5px;font-weight:500;color:var(--ink-3)}
.die-tab:hover{background:var(--hover)}
.die-tab.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.die-tab.on small{color:rgba(255,255,255,.62)}
body.dark .die-tab.on small{color:rgba(0,0,0,.52)}
.die-tab .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.die-tabs .sep{width:1px;height:16px;background:var(--line);margin:0 3px}

.die-count-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:680px}
.die-count-card{
  cursor:pointer;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  padding:11px 12px;text-align:left;transition:.15s;position:relative;
}
.die-count-card:hover{border-color:var(--hover-2);transform:translateY(-1px)}
.die-count-card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.die-count-card b{display:block;font-size:17px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.die-count-card small{display:block;font-size:10px;color:var(--ink-3);margin-top:5px;line-height:1.45}
.die-count-card.on::after{content:"";position:absolute;top:9px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--ink)}

.overview-wrap{position:relative;padding:16px;overflow:hidden}
.ov-dies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;position:relative;z-index:2}
.ov-dies.one{grid-template-columns:minmax(0,1fr)}
.ov-die{
  position:relative;border:1px solid var(--line);border-radius:14px;background:var(--surface);
  padding:10px;cursor:pointer;transition:.16s;
}
.ov-die:hover{border-color:var(--ink-3);transform:translateY(-1px);box-shadow:var(--shadow-s)}
.ov-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px;font-size:11.5px}
.ov-head b{font-size:12px;font-weight:650}
.ov-die .die{width:100%;aspect-ratio:1;border-radius:8px}
.ov-die .die .blk-t,.ov-die .die .blk-s{display:none}
.ov-die .die .blk .blk-n{font-size:7px;padding:0 2px}
.ov-die .blk{cursor:pointer;pointer-events:none}
.ov-die .rz{display:none}
.ov-links,.ov-labels{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.ov-links{z-index:1}
.ov-labels{z-index:3}
.ov-links line{stroke-linecap:round}
.ov-links text,.ov-labels text{font-family:inherit;font-size:8.5px;font-weight:650;letter-spacing:.02em}
.overview-bottom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}
.xdie-link-row{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(112px,150px) auto;gap:9px;align-items:center;
  padding:8px 0;border-top:1px solid var(--line-2);font-size:11.5px;
}
.xdie-link-row:first-child{border-top:0;padding-top:0}
.xdie-link-row .lk{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xdie-link-row select{padding:6px 8px;font-size:11px;border-radius:8px}
.xdie-link-row .meta{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.xdie-stat{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:11.5px}
.xdie-stat:first-of-type{border-top:0}
.xdie-stat b{font-variant-numeric:tabular-nums}
.xdie-quality{height:6px;border-radius:99px;background:var(--hover-2);overflow:hidden;margin:7px 0 4px}
.xdie-quality > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#b3423f,#b4732a 40%,#3f8f6f 100%)}
.xdie-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--ink-3)}

/* 封装：多 die 排布 */
.chiplet-grid{
  position:absolute;inset:10%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  gap:5px;border-radius:8px;padding:4px;
  background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(0,0,0,.22));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.28);
}
.chiplet-grid.one{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.chiplet-grid.two{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.chiplet-grid.three{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.chiplet-tile{min-width:0;min-height:0}
.chiplet-tile{position:relative;border-radius:5px;overflow:hidden;background:#141417;box-shadow:0 0 0 1px rgba(255,255,255,.24)}
.chiplet-tile .die{width:100%;height:100%;border-radius:5px}
.chiplet-tile .die .blk-t,.chiplet-tile .die .blk-s{display:none}
.chiplet-tile .clabel{
  position:absolute;left:4px;top:3px;z-index:4;font-size:6px;font-weight:700;letter-spacing:.08em;
  color:rgba(255,255,255,.72);text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none;
}
.chiplet-tile .cscore{
  position:absolute;right:4px;bottom:3px;z-index:4;font-size:6px;font-weight:650;
  color:rgba(255,255,255,.7);text-shadow:0 1px 2px rgba(0,0,0,.7);pointer-events:none;
}

@media (max-width:1080px){
  .overview-bottom{grid-template-columns:1fr}
  .ov-dies{gap:12px}
}
@media (max-width:820px){
  .die-tabs{width:100%;border-radius:14px;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start}
  .die-tab{flex:none}
  .die-count-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ov-dies{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .xdie-link-row{grid-template-columns:1fr;gap:5px}
}
@media (max-width:390px){
  .ov-dies{grid-template-columns:1fr}
}

      <!-- ② 让噪声缓慢漂移：画面就动起来了 -->

      <!-- ③ 抹平噪声硬边，避免撕裂纹理 -->
      <feGaussianBlur in="moved" stdDeviation="2.6" result="soft"/>
      <!-- ④ 按噪声位移原图：折射本体 -->
      <feDisplacementMap id="disp" in="SourceGraphic" in2="soft" scale="16"
                         xChannelSelector="R" yChannelSelector="G"/>
