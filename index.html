    const u = st.units.find(x => x.uid === st.selected);
    if (!u || !(u.count > 1)) return;
    const n = u.count;
    if (E.splitUnit(st, u.uid)) {
      st.selected = null;
      E.autoPlace(st, true);
      save(); render();
      toast('已拆回 ' + n + ' 个独立核心，重新安排了位置');
    }
  }

  function addUnits(kind, id, n) {
    let last = null;
    for (let i = 0; i < n; i++) {
      const u = { uid: uid(kind), kind, x: -1, y: -1 };
      if (kind === 'cpu') { const c = KB.core(id); u.coreId = id; u.freq = c.refF; }
      else if (kind === 'gpu') { const a = KB.gpu(id); u.archId = id; u.freq = +(a.maxF * 0.9).toFixed(2); }
      else if (kind === 'mem') { u.memId = id; if (st.pref) st.pref.mem = id; }
      else if (kind === 'npu') { u.npuId = id; if (st.pref) st.pref.npu = id; }
      else if (kind === 'isp') u.ispId = id;
      else if (kind === 'vdec') u.vdecId = id;
      else if (kind === 'adsp') u.adspId = id;
      else if (kind === 'hsio') { u.hsioId = id; const h = KB.hsio(id); u.w = h.w; u.h = h.h; }
      else if (kind === 'slc') { u.mb = +id; if (st.pref) st.pref.slc = +id; }
      if (kind !== 'hsio') { const fp = E.unitFootprint(u, st); u.w = fp.w; u.h = fp.h; }   // 高速连接尺寸自由
      st.units.push(u); last = u;
    }
    closePopup();
    if (n === 1) {
      st.selected = last.uid; st.pending = last.uid;
      save(); render();
      toast('已加入待放置 —— 拖到裸片上，或先点它再点裸片');
    } else {
      E.autoPlace(st, true); st.selected = last.uid;
      save(); render();
      toast('已添加 ' + n + ' 个，并自动铺开');
    }
  }

  /* ---------------- 输入 ---------------- */
  function onInput(e) {
    const t = e.target;
    if (t.dataset.freqCpu !== undefined) {
      const id = t.dataset.freqCpu, c = KB.core(id);
      st.units.forEach(u => { if (u.kind === 'cpu' && u.coreId === id) u.freq = +t.value; });
      t.style.setProperty('--p', ((t.value - 0.6) / (c.maxF - 0.6) * 100) + '%');
      const lb = document.querySelector(`[data-flabel-cpu="${id}"]`); if (lb) lb.textContent = f2(+t.value) + ' GHz';
      liveStats(); return;
    }
    if (t.dataset.freqGpu !== undefined) {
      const id = t.dataset.freqGpu, a = KB.gpu(id);
      st.units.forEach(u => { if (u.kind === 'gpu' && u.archId === id) u.freq = +t.value; });
      t.style.setProperty('--p', ((t.value - 0.4) / (a.maxF - 0.4) * 100) + '%');
      const lb = document.querySelector(`[data-flabel-gpu="${id}"]`); if (lb) lb.textContent = f2(+t.value) + ' GHz';
      liveStats(); return;
    }
    if (t.dataset.oc) {
      st.oc[t.dataset.oc] = +t.value;
      const mn = +t.min || 0, mx = +t.max || 100;
      t.style.setProperty('--p', ((+t.value - mn) / Math.max(1e-6, mx - mn) * 100) + '%');
      updateOCLive();
      return;
    }
    if (t.id === 'f-name' || t.id === 'f-name2') { st.chipName = t.value || '未命名 SoC'; save(); return; }
    if (t.id === 'f-slogan') { st.slogan = t.value; save(); return; }
  }

  function onChange(e) {
    const t = e.target;
    /* 滑块松手：只存盘，不重绘（重绘会闪，还会打断下一次拖动） */
    if (t.dataset.oc) { save(); updateOCLive(); return; }
    /* 单条互连链接 */
    if (t.dataset.xlink !== undefined) {
      const key = t.dataset.xlink;
      st.xdie.links[key] = t.value;
      save(); render();
      const [a, b] = key.split('-');
      toast('Die ' + (+a + 1) + ' ↔ Die ' + (+b + 1) + ' → ' + KB.xdie(t.value).name);
      return;
    }
    if (t.dataset.set) {
      const k = t.dataset.set;
      if (k === 'xtopo') {
        st.xdie.topology = t.value;
        rebuildXdieLinks(st);
        save(); render();
        toast('互连拓扑 → ' + KB.xtopo(t.value).name);
        return;
      }
      if (k === 'xtype') {
        st.xdie.defaultType = t.value;
        st.xdie.links = {};                 // 默认连接方式改了 → 全部链接跟着换
        rebuildXdieLinks(st);
        save(); render();
        toast('全部链接 → ' + KB.xdie(t.value).name);
        return;
      }
      if (k === 'node') { st.node = t.value; E.syncAllUnits(st); }
      else if (k === 'modem') st.modem = t.value;
      else if (k === 'noc') st.noc = t.checked;
      else if (k === 'unitMem' || k === 'unitNpu' || k === 'unitIsp' || k === 'unitVdec' || k === 'unitAdsp') {
        const u = st.units.find(x => x.uid === st.selected);
        if (u) {
          if (k === 'unitMem') u.memId = t.value;
          else if (k === 'unitNpu') u.npuId = t.value;
          else if (k === 'unitIsp') u.ispId = t.value;
          else if (k === 'unitVdec') u.vdecId = t.value;
          else u.adspId = t.value;
          E.ensureSizes(st);
          if (u.x >= 0 && !E.canPlace(st, u.uid, u.x, u.y, u.w, u.h)) { u.x = -1; u.y = -1; }
        }
      }
      E.syncAllUnits(st);
      if (k === 'node' || k === 'unitMem' || k === 'unitNpu' || k === 'unitIsp' || k === 'unitVdec' || k === 'unitAdsp') E.autoPlaceAll(st, true);
      save(); render(); return;
    }
    /* 频率滑条松手 → 完整重绘 */
    if (t.dataset.freqCpu !== undefined || t.dataset.freqGpu !== undefined) { save(); render(); return; }
    if (t.id === 'f-brand') { st.brand = t.value; save(); }
  }

  function updateDieTabCounts() {
    st.dies.forEach((d, i) => {
      const el = document.querySelector(`.die-tab[data-die="${i}"] small`);
      if (el) el.textContent = (d.units || []).filter(u => u.x >= 0).length + ' 块';
    });
  }

  function liveStats() {
    const an = E.analyze(st);
    updateDieTabCounts();
    const set = (k, v) => { const el = document.querySelector(`[data-stat="${k}"]`); if (el) el.innerHTML = v; };
    set('cells', an.cells + '<span class="muted" style="font-size:11px">/' + an.areaTotal + 'mm²</span>');
    set('single', fmt(an.score.single));
    set('multi', fmt(an.score.multi));
    set('eff', (an.cpu.eff * 100).toFixed(0) + '%');
    set('gpu', fmt(an.gpu.fps));
    set('power', f1(an.baseP + an.cpu.pk + an.gpu.pk));
    set('yield', (an.yieldRate * 100).toFixed(1) + '%');
    saveSoon();
  }

  /* ---------------- 文案 ---------------- */
  function specText() {
    const an = E.analyze(st);
    const allU = E.allUnitsOf(st);
    const by = (kind, key) => {
      const m = {};
      allU.filter(u => u.kind === kind && u.x >= 0).forEach(u => { m[u[key]] = (m[u[key]] || 0) + (u.count || 1); });
      return Object.keys(m).map(id => `${m[id]}× ${kind === 'cpu' ? KB.core(id).name : KB.gpu(id).name} @ ${f2(E.unitFreq(allU.find(u => u[key] === id && u.x >= 0)))}GHz`).join('\n  ');
    };
    return `【${st.chipName}】${st.slogan}
品牌：${st.brand}
制程：${KB.node(st.node).name} · ${an.dieCount} × ${st.mm2}mm² die = ${an.areaTotal}mm² · 利用率 ${(an.util * 100).toFixed(0)}%
封装：${an.dieCount > 1 ? an.xdie.topoDef.name + ' · ' + an.xdie.links.map(l => l.short).join(' / ') + ' · Q ' + (an.xdie.Q * 100).toFixed(0) + '%' : '单片'}
CPU：${an.cpu.cores} 核
  ${by('cpu', 'coreId')}
GPU：${an.gpu.cores} 核心
  ${by('gpu', 'archId')}
内存：${an.mem.label}（${an.mem.bw.toFixed(1)}GB/s，${an.mem.count} 块）
基带：${KB.modem(st.modem).name}
NPU：${an.npu.label}（${an.npu.tops} TOPS）
ISP：${an.isp.label}（${an.isp.cap} GPix/s）
视频编解码：${an.vdec.label}（解码力 ${an.vdec.cap}）
音频 DSP：${an.adsp.label}（${an.adsp.cap} GOPS）
高速连接：${an.hsio.label}${an.hsio.count ? '（' + fmt(an.hsio.bw) + 'GB/s，' + an.hsio.cells + ' 格）' : ''}
SLC：${an.slc.mb}MB（${an.slc.count} 块）${st.noc ? ' · NoC 互连' : ''}
预估 Geekbench 6：${fmt(an.score.single)} / ${fmt(an.score.multi)}
预估曼哈顿 3.1：${fmt(an.gpu.fps)} fps
单 die 良率 ${(an.dieYield * 100).toFixed(1)}% · 封装良率 ${(an.yieldRate * 100).toFixed(1)}% · 单颗成本 ¥${fmt(an.bom)}`;
  }
  function reviewText() {
    const r = st.result; if (!r || r.crashed) return '这次翻车了，没有成绩单……';
    return `${st.chipName} —— ${r.grade.title}（${r.grade.grade} 级）

“${st.slogan}”

鲸兔兔 v10 综合：${fmt(r.sust.total)}（峰值 ${fmt(r.peak.total)}）
Geekbench 6：单核 ${fmt(r.peak.single)} / 多核 ${fmt(r.peak.multi)}
GFXBench 曼哈顿 3.1：${fmt(r.peak.gpu)} fps
封装：${r.an.dieCount > 1 ? r.an.dieCount + ' die · ' + r.an.xdie.topoDef.name + ' · Q ' + (r.an.xdie.Q * 100).toFixed(0) + '%' : '单片'}
峰值功耗 ${f1(r.peakP)}W · 峰值温度 ${r.peakT.toFixed(0)}°C · 频率保持 ${(r.throttle * 100).toFixed(0)}%
封装良率 ${(r.an.yieldRate * 100).toFixed(1)}% · 单颗成本 ¥${fmt(r.an.bom)}

${r.grade.remark}`;
  }

  /* ============================================================
     液态玻璃
     ============================================================ */
  let lgSupported = false, lgUserOn = true, dispEl = null, lgAnim = false;
  const lgReduce = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
  const lgCoarse = () => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };

  /** 折射位移量按视口宽度取一个固定值：只在断点/旋转时算一次 */
  function syncGlassScale() {
    if (!dispEl) return;
    const s = Math.round(clamp((window.innerWidth || 1200) / 78, 10, 20));
    dispEl.setAttribute('scale', String(s));
  }
  function applyGlass() {
    const active = lgSupported && lgUserOn;
    document.body.classList.toggle('no-lg', !active);
    /* 持续动画只在桌面端开：手机 GPU 上逐帧重算 backdrop-filter，
       会把文字和滑块一起拖到「画一半」的状态 */
    lgAnim = active && !lgReduce() && !lgCoarse() && window.innerWidth >= 1024;
    const defs = document.querySelector('svg.lg-defs');
    try { if (defs) { lgAnim ? defs.unpauseAnimations() : defs.pauseAnimations(); } } catch (e) { }
    if (active) syncGlassScale();
    const btn = document.querySelector('#btn-glass .lbl');
    if (btn) btn.textContent = active ? '折射 开' : '折射 关';
  }
  function initGlass() {
    try {
      lgSupported = !!(window.CSS && CSS.supports &&
        (CSS.supports('backdrop-filter', 'url(#lg)') || CSS.supports('-webkit-backdrop-filter', 'url(#lg)')));
    } catch (e) { lgSupported = false; }
    dispEl = document.getElementById('disp');
    applyGlass();
    /* 只在尺寸稳定后重算一次，不再每帧改 filter 属性 */
    let rt = 0;
    window.addEventListener('resize', () => {
      clearTimeout(rt);
      rt = setTimeout(() => { if (lgSupported && lgUserOn) syncGlassScale(); }, 220);
    }, { passive: true });
    document.addEventListener('visibilitychange', () => {
      const defs = document.querySelector('svg.lg-defs'); if (!defs) return;
      try {
        (document.hidden || !lgAnim) ? defs.pauseAnimations() : defs.unpauseAnimations();
      } catch (e) { }
    });
  }
  function toggleGlass() {
    lgUserOn = !lgUserOn; applyGlass();
    toast(lgSupported && lgUserOn ? '已开启液态玻璃折射' : '已降级为纯模糊（省电模式）');
  }

  /* ---------------- 主题 ---------------- */
  function applyTheme() {
    const dark = st.theme === 'dark';
    document.body.classList.toggle('dark', dark);
    const l = document.querySelector('#theme-lbl');
    if (l) l.textContent = dark ? '暗灰' : '浅色';
  }
  function toggleTheme() {
    st.theme = st.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); save();
    toast(st.theme === 'dark' ? '已切换到暗灰主题' : '已切换到浅色主题');
  }

  function showHelp() {
    popup(`
      <div class="between"><h2>怎么玩？</h2>
        <button class="btn btn-icon" onclick="document.getElementById('modal').hidden=true">✕</button></div>
      <div class="stack" style="font-size:13px;line-height:1.85;color:var(--ink-2);margin-top:14px">
        <div><b style="color:var(--ink)">① 版型 · 面积 · 制程</b><br/>
          先选<b>版型</b>：移动端 SoC / 桌面端处理器 / 服务器处理器。
          它决定可选的裸片面积、散热池、功耗墙与温度墙，也换一套对手给你比。
          <b>切换版型或开新芯片都会把上一版的选择和版图清空。</b></div>
        <div><b style="color:var(--ink)">多 die 拼接（仅桌面 / 服务器）</b><br/>
          在①里选 2~4 块基础 die，像 Apple M Pro / Max / Ultra 那样拼成一颗大芯片。每块 die 有独立版图；版图页顶部会出现 <b>Die 1 / Die 2 / … / 总览图</b> 选择栏，默认显示 Die 1。<br/>
          「总览图」会把所有 die 拼在一起显示，并画出互连拓扑；你可以改<b>拓扑</b>（线性 / 环形 / 网格 / 全连接）和<b>默认连接方式</b>，也可以逐条覆盖每对 die 的链接（有机基板 / 硅桥 / 中介层 / D2D）。<br/>
          跨 die 的多核 / GPU / AI / 光追会按互连质量 <b>Q</b> 折损；媒体与本地内存不吃折损。多 die 封装还有更高的热阻惩罚，良率也会逐块相乘 —— 拼接不是无脑翻倍。</div>
        <div><b style="color:var(--ink)">② 摆版图（本作核心）</b><br/>
          点「＋ 添加 …」→ 选型号 → 拖到裸片上。CPU / GPU / 内存控制器 / NPU / SLC / <b>ISP / 视频解码 / 音频 DSP</b> 都能自己叠多块，数量不设上限。<br/>
          <b>高速连接</b>最特别（PCIe / D2D / Fabric）：它<b>没有物理最小面积</b>，加进来后在「选中模块」面板用 W / H 自由拉长拉宽，带宽、成本、功耗全按占格数算 —— 互连带宽越高，CPU 多核与 GPU 的扩展效率越好。<br/>
          媒体三件套（ISP / 视频解码 / 音频 DSP）会计入综合分里的「媒体引擎」，同时也出现在规格书与架构师点评里。<br/>
          <b>GPU 方块</b>可以拖右下角<b>自定义区块大小</b>：超出物理面积的部分会变成缓存/供电余量，
          每多 1 格给这颗核心 <b>+2%</b> 性能（最多 +10%）。<br/>
          <b>CPU 核心面积固定</b>：只由所选型号的物理面积决定，不能拉伸，只能横竖对调（面积不变）。<br/>
          按 <b>R</b> 键或点「横竖 ↻」把方块<b>横竖对调</b>。<br/>
          <b>Shift + 点击</b>多个 GPU 块多选 —— 只要它们<b>彼此相连</b>就能合并成一块 GPU 区域，
          共享 L2 每多一颗 +1.5%（最多 +6%）；补成矩形多出来的空格要自己吃面积。合并后可再拆开。<br/>
          <b>把 CPU 核心摆在 SLC 旁边</b>：距离越近缓存局部性越好，跑分最高 +12%（检查器里有实时显示）。<br/>
          <b>把模块拖出裸片边缘再松手 = 直接删除</b>；拖到一半又拖回去就取消。
          <b>在裸片空白处按住拖动 = 框选</b>（手机 / 平板：<b>长按空白处</b>进入选区，再拖动圈选），右侧「选区」面板里可以一键<b>合并 GPU</b>、<b>复制</b>或<b>删除</b>框内的全部模块。圈住 2 块以上相连、同架构同频的 GPU，点「合并 GPU」就能拼成一块大区域。
          <b>拖着选区里的任意一块 = 整块选区一起搬走</b>（相对排版不变，放不下会红框提示并退回原位）；按住 <b>Alt</b> 拖则只动你按的那一块。
          <b>复制是原样平移</b>：框内模块的相对排版、尺寸、频率统统不变，就近贴到旁边的空位（贴好后选区会跟过去，可以连着贴）；实在塞不下就整批进待放置区。
          拖动时才会显示网格对齐的落点预览（空位透明、冲突变红）；没拿东西时鼠标悬停不会出现任何框。
          默认尺寸塞不下的空位，模块会<b>自动变形适配</b>（比如 2×2 塞不进 1×4，就变成 1×4）；空位够大时不会白白变大，拖出去就恢复默认。
          待放置区里没用上的模块不会阻止流片，它们只是不参与计算。
</div>
        <div><b style="color:var(--ink)">③ 流片封装</b><br/>
          晶圆切出裸片、盖上基板、打上焊球 —— 得到一颗能展示的 SoC 和一份规格书。</div>
        <div><b style="color:var(--ink)">④ 超频实验室</b><br/>
          拉频率、加压、解锁功耗墙。每颗硅的<b>体质</b>随机：体质越好，安全超频上限越高。超过安全线就有概率翻车。</div>
        <div><b style="color:var(--ink)">⑤ 跑分发布会</b><br/>
          Geekbench 6、GFXBench 曼哈顿 3.1、内存、AI、媒体引擎与综合分。注意<b>峰值 vs 持续</b> —— 温度到稳态后会降频。</div>
        <div><b style="color:var(--ink)">多核扩展怎么算</b><br/>
          8 核以内沿用原来的移动端校准；核数越多，逐渐切换到该版型的多核基线：<b>移动 0.55 / 桌面 0.66 / 服务器 0.70</b>，服务器衰减最慢。
          再叠加 <b>SLC / 核</b>（4MB/核视为满配）和 <b>布局局部性</b>（最高 +12%）奖励，最高再给多核效率 +20%。
          所以“4 核一簇、每簇 16MB SLC、两簇共享 32MB”的大核设计会明显高于旧算法，不会被一刀切压成 18%。</div>
        <div class="hr"></div>
        <div><b style="color:var(--ink)">界面</b><br/>
          右上角三个开关：<b>浅色 / 暗灰</b>主题切换、<b>折射</b>开关（关掉退成纯模糊，省电）、帮助。</div>
        <div class="tiny">数据锚点：ARM CPU 全谱系（2020-2026）、高通 Oryon 四代规格、GB6 实测跑分、ARM / Adreno GPU 型号汇总、移动端基带型号参考。ISP / 视频解码 / 音频 DSP / 高速连接为模拟器补充的内建数据。</div>
      </div>`);
  }

  /* ============================================================
     自适应布局 · Adaptive Layout
     视口宽度 → 断点 id（xxs/xs/sm/md/lg/xl/xxl）
     断点切换时重排当前界面、重算裸片标签字号、重画图表
     ============================================================ */
  const ADP_BP = [
    { id: 'xxs', max: 430 },
    { id: 'xs',  max: 560 },
    { id: 'sm',  max: 820 },
    { id: 'md',  max: 1080 },
    { id: 'lg',  max: 1320 },
    { id: 'xl',  max: 1599 },
    { id: 'xxl', max: Infinity }
  ];
  const Adaptive = {
    id: null, raf: 0, timer: 0, ready: false,
    /** 顶栏实际高度同步到 --topbar-h：换行 / 安全区 / 字号变化都不会压住正文 */
    syncTopbar() {
      const bar = document.querySelector('.topbar');
      if (!bar) return;
      const h = Math.ceil(bar.getBoundingClientRect().height);
      /* 只有真的变了才写 CSS 变量：写一次等于全页样式重算，
         和 backdrop-filter 叠在一起就是一帧白闪 */
      if (h > 0 && h !== this._barH) {
        this._barH = h;
        document.documentElement.style.setProperty('--topbar-h', h + 'px');
      }
    },
    measure() {
      const w = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
      const h = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
      const bp = ADP_BP.find(b => w <= b.max) || ADP_BP[ADP_BP.length - 1];
      return { w, h, id: bp.id };
    },
    /** 裸片上的标签随格子物理尺寸缩放：n 越大、屏越窄，字越小 */
    fitDieLabels() {
      const die = document.getElementById('die');
      if (!die) return;
      const w = die.getBoundingClientRect().width;
      if (!w) return;
      const cell = w / Math.max(1, st.n);
      const fT = clamp(cell * 0.62, 5, 10.5);
      const fS = clamp(cell * 0.50, 4.5, 8.5);
      const root = document.documentElement.style;
      if (Math.abs(w - (this._dieW || 0)) >= 0.5 || st.n !== this._dieN) {
        this._dieW = w; this._dieN = st.n;
        root.setProperty('--blk-t', fT.toFixed(2) + 'px');
        root.setProperty('--blk-s', fS.toFixed(2) + 'px');
      }
      /* 每一块按自己的高度算「标题最多几行」，放不下就裁掉；副标题放不下就隐藏 */
      const lineT = fT * 1.12, lineS = fS * 1.18;
      die.querySelectorAll('.blk').forEach(el => {
        const hc = Math.max(1, Math.round(parseFloat(el.style.height) / 100 * st.n));
        const wc = Math.max(1, Math.round(parseFloat(el.style.width) / 100 * st.n));
        const avail = hc * cell - 4;                       // 去掉上下 padding
        const canSub = hc * wc > 1 && avail >= lineT * 1.4 + lineS * 1.15;
        const titleAvail = canSub ? avail - lineS * 1.15 : avail;
        const lines = clamp(Math.floor(titleAvail / lineT) || 1, 1, 3);
        el.style.setProperty('--blk-lines', lines);
        el.classList.toggle('hide-sub', !canSub);
      });
    },
    redraw() {
      if (st.screen === 'result' && st.result && !st.result.crashed) {
        const cv = document.getElementById('chart2');
        if (cv) drawChart(cv, st.result.series, st.result.series.length);
      }
      if (st.screen === 'bench' && st.result) {
        const cv = document.getElementById('chart');
        if (cv) drawChart(cv, st.result.series, st.result.series.length);
      }
      if (st.screen === 'layout' && st.overview) setTimeout(drawOverviewLinks, 30);
    },
    apply(force) {
      const m = this.measure();
      const root = document.documentElement;
      const style = root.style;
      const changed = m.id !== this.id;
      this.id = m.id;
      root.dataset.bp = m.id;
      document.body.dataset.bp = m.id;
      const vw = m.w + 'px', dvh = (m.h / 100).toFixed(2) + 'px';
      if (vw !== this._vw) { this._vw = vw; style.setProperty('--vw', vw); }
      if (dvh !== this._dvh) { this._dvh = dvh; style.setProperty('--dvh', dvh); }
      const gut = Math.round(clamp(m.w * 0.019, 12, 26)) + 'px';
      if (gut !== this._gut) { this._gut = gut; style.setProperty('--gutter', gut); }
      this.syncTopbar();
      this.fitDieLabels();

      if (!force && !changed) { this.redraw(); return; }

      document.documentElement.dataset.screen = st.screen;
      const ae = document.activeElement;
      const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'SELECT' || ae.tagName === 'TEXTAREA');
      // 断点切换才重排；正在输入、拖动或跑分动画时不打断
      if (changed && this.ready && !typing && !drag && st.screen !== 'bench') {
        const y = window.scrollY;
        render();
        requestAnimationFrame(() => window.scrollTo(0, y));
        return;
      }
      this.redraw();
    },
    schedule() {
      cancelAnimationFrame(this.raf);
      this.raf = requestAnimationFrame(() => this.apply(false));
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.apply(false), 220);
    },
    refresh() { this.apply(true); render(); this.schedule(); },
    watch() {
      this.apply(true);
      this.ready = true;   // 首帧只测尺寸，不再重复渲染
      /* 顶栏高度是自适应的：字体、安全区、按钮换行都会改变它 */
      if (window.ResizeObserver) {
        const bar = document.querySelector('.topbar');
        if (bar) new ResizeObserver(() => this.syncTopbar()).observe(bar);
      }
      window.addEventListener('resize', () => this.schedule(), { passive: true });
      window.addEventListener('orientationchange', () => setTimeout(() => this.apply(true), 300));
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => this.schedule(), { passive: true });
      }
      document.addEventListener('visibilitychange', () => { if (!document.hidden) this.schedule(); });
    }
  };

  /* ---------------- 绑定 / 启动 ---------------- */
  function bind() {
    document.addEventListener('pointerdown', onDown, { passive: false });
    document.addEventListener('pointermove', onMove, { passive: true });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', () => {
      clearTimeout(lpTimer); setDieArming(false);
      if (drag) { drag = null; hidePreview(); setDelHint(false); }
    });
    /* 长按裸片时不要弹出系统的「复制/搜索」菜单 */
    document.addEventListener('contextmenu', e => {
      if (e.target.closest && e.target.closest('#die')) e.preventDefault();
    });
    /* 长按进入选区后，锁住页面滚动，让这一根手指专心拉框 */
    document.addEventListener('touchmove', e => {
      if (drag && drag.mode === 'rect') e.preventDefault();
    }, { passive: false });
    document.addEventListener('click', onUp2);
    document.addEventListener('change', onChange);
    document.addEventListener('input', onInput);
    $('#btn-glass').addEventListener('click', toggleGlass);
    $('#btn-theme').addEventListener('click', toggleTheme);
    $('#btn-help').addEventListener('click', showHelp);
    $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closePopup(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { st.pending = null; st.selRect = null; hidePreview(); closePopup(); if (st.screen === 'layout') render(); }
      if ((e.key === 'r' || e.key === 'R') && st.screen === 'layout' && st.selected) {
        const el = document.activeElement;
        if (el && (el.tagName === 'INPUT' || el.tagName === 'SELECT')) return;
        rotateSel(); return;
      }
      if ((e.key === 'Delete' || e.key === 'Backspace') && st.screen === 'layout' && st.selected) {
        const el = document.activeElement;
        if (el && (el.tagName === 'INPUT' || el.tagName === 'SELECT')) return;
        st.units = st.units.filter(u => u.uid !== st.selected); st.selected = null;
        save(); render(); toast('已删除');
      }
    });
  }
  /* 让 input 事件按需处理 */

  function init() {
    try {
      load();
      if (!st.theme) st.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      applyTheme();
      initGlass();
      bind();
      if (!st.quality) st.quality = E.makeQuality(rngSeed());
      bindActive(st);
      rebuildXdieLinks(st);
      E.syncAllUnits(st);
      render();
      const firstStage = document.getElementById('stage');
      if (firstStage && !firstStage.children.length) {
        if (window.__lastRenderError) throw window.__lastRenderError;
        throw new Error('首屏渲染为空：stage 没有子节点（屏幕：' + st.screen + '）');
      }
      Adaptive.watch();
      if (window.__bootDone) window.__bootDone();
      if (window.__buildChanged) {
        window.__buildChanged = false;
        toast('跑分算法/散热模型已更新到 v15.3，旧成绩已失效，请重新跑分', 5200);
      }
    } catch (err) {
      if (window.__bootFail) window.__bootFail('初始化时报错：<br>' + (err && err.message ? err.message : err));
      else throw err;
    }
  }

  window.ARM.debug = () => ({
    st: JSON.parse(JSON.stringify(st)),
    an: E.analyze(st), lim: E.limits(st, st.quality),
    rk: E.riskOf(st, st.oc, st.quality),
    sim: E.simulate(st, st.oc, st.quality, { rng: () => 1 })
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>
<script>
/* 独立诊断层：即使主脚本只跑了一半 / 报错，也能看见到底卡在哪 */
(function () {
  var lastErr = '';
  window.addEventListener('error', function (e) {
    lastErr = (e.message || '未知错误') + (e.filename ? ' @ ' + e.filename + ':' + (e.lineno || 0) : '');
  });
  function showDiag() {
    var stage = document.getElementById('stage');
    var steps = document.getElementById('steps');
    var boot = document.getElementById('boot');
    if (!stage || !steps) return;
    if (stage.children.length && steps.children.length) return;   // 正常渲染，不打扰
    var old = document.getElementById('diag');
    if (old) old.remove();
    var d = document.createElement('div');
    d.id = 'diag';
    d.style.cssText = 'position:fixed;inset:0;z-index:10002;overflow:auto;background:#141417;color:#f2f2f4;' +
      'font:13px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px 32px;text-align:left';
    d.innerHTML =
      '<h2 style="margin:0 0 12px;font-size:20px">页面脚本没有完成渲染</h2>' +
      '<div style="max-width:780px;color:#b8b8c2">主脚本只完成了部分初始化，所以顶栏和背景出来了，但游戏内容没有挂上去。把下面这段信息发给小鲸即可定位。</div>' +
      '<pre style="margin:16px 0;padding:14px 16px;border:1px solid #33333b;border-radius:10px;' +
      'background:#1d1d22;white-space:pre-wrap;word-break:break-word;font:12px/1.7 ui-monospace,Consolas,monospace">' +
      'build: ' + ((document.querySelector('meta[name="build"]') || {}).content || '?') + '\n' +
      'readyState: ' + document.readyState + '\n' +
      'stage children: ' + stage.children.length + '\n' +
      'steps children: ' + steps.children.length + '\n' +
      'boot display: ' + (boot ? (boot.style.display || getComputedStyle(boot).display) : 'missing') + '\n' +
      'boot done: ' + (boot ? (boot.dataset.done || 'no') : 'missing') + '\n' +
      'boot text: ' + (boot ? (boot.innerText || '').replace(/\s+/g, ' ').slice(0, 400) : 'missing') + '\n' +
      'last error: ' + (lastErr || 'none') + '\n' +
      'last render error: ' + (window.__lastRenderError ? (window.__lastRenderError.message || String(window.__lastRenderError)) : 'none') + '\n' +
      'saved v6: ' + (function () { try { return localStorage.getItem('armdynasty.v6') ? 'yes' : 'no'; } catch (e) { return 'blocked'; } })() + '\n' +
      'url: ' + location.href + '\n' +
      'screen: ' + ((document.documentElement.dataset.screen) || '?') + '\n' +
      'ua: ' + navigator.userAgent +
      '</pre>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<button onclick="location.reload()" style="cursor:pointer;padding:10px 18px;border:0;border-radius:10px;' +
      'background:#f2f2f4;color:#141417;font-weight:650;font-size:13px">重新加载</button>' +
      '<button onclick="location.href=location.href.split(\'?\')[0]+\'?v=\'+Date.now()" style="cursor:pointer;padding:10px 18px;' +
      'border:1px solid #4a4a55;border-radius:10px;background:#26262c;color:#f2f2f4;font-weight:600;font-size:13px">绕过缓存重新加载</button>' +
      '<button onclick="try{localStorage.clear()}catch(e){};location.reload()" style="cursor:pointer;padding:10px 18px;' +
      'border:1px solid #6a3a3a;border-radius:10px;background:#3a2020;color:#ffd7d7;font-weight:600;font-size:13px">清空存档并重新加载</button>' +
      '</div>';
    document.body.appendChild(d);
  }
  setTimeout(showDiag, 1600);
})();
</script>
